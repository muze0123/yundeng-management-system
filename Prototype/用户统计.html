<style data-inline="app-shell">* { box-sizing: border-box; }

:root {
  color-scheme: light;
  --app-sidebar-width: 220px;
  --app-sidebar-compact-width: 68px;
  --app-topbar-height: 56px;
}

html,
body { min-height: 100%; }

body {
  margin: 0;
  background: #f7f8fa;
  color: #3a3f4a;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button,
input,
select,
textarea { font: inherit; letter-spacing: 0; }

button,
a { -webkit-tap-highlight-color: transparent; }

.mono {
  font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
}

.app-shell { display: flex; width: 100%; height: 100vh; min-height: 100vh; flex-direction: column; overflow: hidden; }
.app-shell-body { display: flex; min-height: 0; flex: 1; overflow: hidden; }

.app-sidebar {
  position: relative;
  z-index: 40;
  display: flex;
  width: var(--app-sidebar-width);
  height: 100%;
  flex: 0 0 auto;
  flex-direction: column;
  overflow: visible;
  background: #fff;
  transition: width .2s ease, transform .2s ease;
}

.app-sidebar.is-compact { width: var(--app-sidebar-compact-width); }

.app-brand-link { display: flex; min-width: 0; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.app-brand-mark { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 6px; background: #0066ff; color: #fff; font-size: 15px; font-weight: 700; }
.app-brand-copy { overflow: hidden; color: #1a1d24; font-size: 16px; font-weight: 600; white-space: nowrap; }

.app-icon-button {
  display: inline-grid;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  place-items: center;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #6e7685;
  cursor: pointer;
}

.app-icon-button:hover { background: #f3f4f6; color: #3a3f4a; }
.app-icon-button:focus-visible,
.app-menu-link:focus-visible,
.app-account-button:focus-visible,
.app-collapse-button:focus-visible,
.app-brand-link:focus-visible { outline: 2px solid #0066ff; outline-offset: 2px; }
.app-collapse-button {
  position: absolute;
  top: 50%;
  right: 0;
  z-index: 3;
  display: grid;
  width: 12px;
  height: 50px;
  padding: 0;
  transform: translate(50%, -50%);
  place-items: center;
  border: 0;
  border-radius: 6px;
  background: #e5e6ed;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease;
}
.app-collapse-button::before {
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-right: 7px solid currentColor;
  border-bottom: 6px solid transparent;
  content: "";
}
.app-collapse-button[aria-expanded="false"]::before {
  border-right: 0;
  border-left: 7px solid currentColor;
}
.app-sidebar:hover .app-collapse-button,
.app-sidebar:focus-within .app-collapse-button,
.app-collapse-button:focus-visible { opacity: 1; pointer-events: auto; }
.app-collapse-button:hover { background: #acb0ba; }

.app-primary-nav { min-height: 0; flex: 1; overflow: auto; padding: 12px 12px; }
.app-section-label { padding: 8px 8px 0; color: #9da2ac; font-size: 11px; line-height: 28px; }

.app-menu-link,
.app-bottom-link {
  display: flex;
  width: 100%;
  min-height: 38px;
  align-items: center;
  gap: 12px;
  margin: 0 0 4px;
  padding: 0 8px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #3a3f4a;
  font-size: 13px;
  line-height: 1.3;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}

.app-menu-link:hover,
.app-bottom-link:hover { background: #f3f4f6; }
.app-menu-link.is-active { background: #e6f0ff; color: #0066ff; font-weight: 600; }
.app-menu-link.is-group-active { background: #f3f4f6; color: #0066ff; font-weight: 600; }
.app-menu-icon { width: 16px; height: 16px; flex: 0 0 16px; }
.app-menu-label { min-width: 0; flex: 1; font-size: 13px; }
.app-group-chevron { width: 16px; height: 16px; transition: transform .2s ease; }
.app-group-toggle[aria-expanded="false"] .app-group-chevron { transform: rotate(-90deg); }
.app-submenu { overflow: hidden; max-height: 240px; opacity: 1; transition: max-height .2s ease, opacity .15s ease; }
.app-submenu.is-collapsed { max-height: 0; opacity: 0; pointer-events: none; }
.app-submenu .app-menu-link { min-height: 34px; padding-left: 36px; font-size: 13px; }
.app-sidebar-footer { padding: 12px; }
.app-sidebar-divider { height: 1px; margin-bottom: 12px; background: #dfe1e5; }

.app-sidebar.is-compact .app-menu-label,
.app-sidebar.is-compact .app-group-chevron,
.app-sidebar.is-compact .app-section-label,
.app-sidebar.is-compact .app-bottom-label { display: none; }
.app-sidebar.is-compact .app-menu-link,
.app-sidebar.is-compact .app-bottom-link { justify-content: center; padding-right: 0; padding-left: 0; }
.app-sidebar.is-compact .app-submenu { display: none; }

.app-workspace { display: flex; min-width: 0; height: 100%; min-height: 0; flex: 1; flex-direction: column; overflow: hidden; }
.app-topbar {
  position: relative;
  z-index: 50;
  display: flex;
  width: 100%;
  min-height: var(--app-topbar-height);
  flex: 0 0 var(--app-topbar-height);
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #fff;
  box-shadow: 0 4px 12px -4px rgba(26, 29, 36, .16);
  clip-path: inset(0 0 -16px 0);
}
.app-topbar-left,
.app-topbar-right { display: flex; min-width: 0; align-items: center; gap: 8px; }
.app-topbar-left { gap: 12px; }
.app-mobile-menu { display: none; }
.app-notice-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border: 1px solid #fff; border-radius: 50%; background: #d9001b; }
.app-topbar-separator { width: 1px; height: 20px; margin: 0 4px; background: #dfe1e5; }
.app-account-button { display: flex; align-items: center; gap: 8px; padding: 4px; border: 0; border-radius: 4px; background: transparent; color: #3a3f4a; cursor: pointer; }
.app-account-button:hover { background: #f3f4f6; }
.app-avatar { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 50%; background: #e6f0ff; color: #0066ff; font-weight: 600; }

.app-content { min-height: 0; flex: 1; overflow: auto; background: #f7f8fa; }
.app-route-outlet { min-height: 100%; }
.app-route-loading { display: grid; min-height: calc(100vh - var(--app-topbar-height)); place-items: center; color: #6e7685; }
.app-route-loading > div { display: flex; align-items: center; gap: 8px; }
.app-spinner { width: 16px; height: 16px; border: 2px solid #dfe1e5; border-top-color: #0066ff; border-radius: 50%; animation: app-spin .7s linear infinite; }
@keyframes app-spin { to { transform: rotate(360deg); } }

.app-business-module > .app-module-toolbar { display: none !important; }
.app-business-module > main { height: auto !important; min-height: calc(100vh - var(--app-topbar-height)) !important; overflow: visible !important; }
.app-business-module .app-module-compat { display: none !important; }

.app-popover {
  position: fixed;
  z-index: 70;
  border: 1px solid #dfe1e5;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 6px 24px rgba(26, 29, 36, .14);
}
.app-popover[hidden] { display: none; }
.app-notice-popover { top: 48px; right: 72px; width: min(340px, calc(100vw - 32px)); }
.app-account-popover { top: 48px; right: 16px; width: 184px; padding: 4px; }
.app-popover-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #dfe1e5; }
.app-popover-header strong { color: #1a1d24; font-size: 15px; }
.app-link-button { border: 0; background: transparent; color: #0066ff; cursor: pointer; }
.app-notice-item { display: flex; width: 100%; gap: 8px; padding: 12px 16px; border: 0; border-bottom: 1px solid #f0f1f3; background: #fff; text-align: left; cursor: pointer; }
.app-notice-item:hover { background: #f3f4f6; }
.app-notice-item-dot { width: 8px; height: 8px; flex: 0 0 8px; margin-top: 6px; border-radius: 50%; background: #0066ff; }
.app-notice-item-dot.is-read { background: #dfe1e5; }
.app-notice-title { color: #1a1d24; font-weight: 500; }
.app-notice-desc { overflow: hidden; margin-top: 4px; color: #6e7685; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.app-notice-time { margin-top: 4px; color: #9da2ac; font-size: 11px; }
.app-account-meta { padding: 10px 12px; border-bottom: 1px solid #f0f1f3; color: #6e7685; font-size: 12px; line-height: 1.7; }
.app-account-action { display: flex; width: 100%; min-height: 34px; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #3a3f4a; cursor: pointer; }
.app-account-action:hover { background: #f3f4f6; }

.app-mobile-overlay { position: fixed; inset: var(--app-topbar-height) 0 0; z-index: 38; border: 0; background: rgba(26, 29, 36, .28); }
.app-mobile-overlay[hidden] { display: none; }
.app-compact-flyout { position: fixed; z-index: 65; left: 76px; width: 176px; padding: 4px; border: 1px solid #dfe1e5; border-radius: 8px; background: #fff; box-shadow: 0 6px 24px rgba(26, 29, 36, .14); }
.app-compact-flyout[hidden] { display: none; }

.app-planning { min-height: calc(100vh - var(--app-topbar-height)); padding: 16px; }
.app-planning-inner { display: grid; min-height: 420px; place-items: center; background: #fff; }
.app-planning-copy { max-width: 460px; padding: 32px; text-align: center; }
.app-planning-icon { display: grid; width: 48px; height: 48px; margin: 0 auto; place-items: center; border-radius: 8px; background: #fdf2e9; color: #e7772d; }
.app-planning h1 { margin: 16px 0 8px; color: #1a1d24; font-size: 20px; }
.app-planning p { margin: 0; color: #6e7685; line-height: 1.7; }

.app-toast-container { position: fixed; top: 16px; left: 50%; z-index: 100; transform: translateX(-50%); pointer-events: none; }
.app-toast { margin-bottom: 8px; padding: 8px 16px; border-radius: 4px; background: #3a3f4a; color: #fff; box-shadow: 0 2px 8px rgba(26, 29, 36, .16); animation: app-toast-in .18s ease both; }
@keyframes app-toast-in { from { opacity: 0; transform: translateY(-8px); } }

@media (min-width: 768px) {
  .app-topbar { padding: 0 24px; }
}

@media (max-width: 767px) {
  .app-sidebar { position: fixed; top: var(--app-topbar-height); bottom: 0; left: 0; height: auto; transform: translateX(-100%); box-shadow: 0 6px 24px rgba(26, 29, 36, .16); }
  .app-sidebar.is-mobile-open { width: min(280px, calc(100vw - 48px)); transform: translateX(0); }
  .app-sidebar.is-compact { width: min(280px, calc(100vw - 48px)); }
  .app-sidebar.is-compact .app-menu-label,
  .app-sidebar.is-compact .app-group-chevron,
  .app-sidebar.is-compact .app-section-label,
  .app-sidebar.is-compact .app-bottom-label { display: block; }
  .app-sidebar.is-compact .app-menu-link,
  .app-sidebar.is-compact .app-bottom-link { justify-content: flex-start; padding-right: 8px; padding-left: 8px; }
  .app-sidebar.is-compact .app-submenu { display: block; }
  .app-collapse-button { display: none; }
  .app-mobile-menu { display: inline-grid; }
  .app-account-name,
  .app-account-chevron { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .app-sidebar,
  .app-collapse-button,
  .app-submenu,
  .app-group-chevron,
  .app-spinner,
  .app-toast { transition: none; animation: none; }
}

inear-gradient(90deg,#F0F1F3 25%,#F7F8FA 37%,#F0F1F3 63%);background-size:400% 100%;animation:shimmer 1.3s infinite}\n    @keyframes shimmer{to{background-position:-100% 0}}\n    .state-panel{min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}\n    .popover{box-shadow:0 6px 24px rgba(0,0,0,.12)}\n    .toast{animation:toast-in .2s ease both}\n    @keyframes toast-in{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}\n    .modal-overlay{background:rgba(0,0,0,.3)}\n    .dialog-panel{width:600px;max-width:92vw;height:250px;background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.12);display:flex;flex-direction:column;position:relative;animation:modal-in .15s ease}\n    @keyframes modal-in{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}\n    .anno-badge{position:fixed;width:20px;height:20px;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px 'JetBrains Mono',monospace;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:auto;cursor:pointer;transition:transform .15s}\n    .anno-badge:hover{transform:scale(1.2)}\n    @media(max-width:1279px){.chart-grid{grid-template-columns:1fr}.chart-panel{padding:16px 0}.chart-panel+.chart-panel{padding:16px 0;border-left:0;border-top:1px solid #E8EAED}}\n    @media(max-width:1023px){.sidebar:not(.compact){width:220px}.sidebar.compact{width:68px}.filter-item{flex:1 1 100%;width:100%}.control{flex:1;width:auto}.chart-wrap{height:260px}}\n    @media(max-width:767px){.sidebar{position:fixed;left:0;top:0;z-index:50;height:100vh;box-shadow:0 6px 24px rgba(0,0,0,.12)}.sidebar.compact{width:0}.filter-item{align-items:flex-start;flex-direction:column;gap:6px}.filter-label{width:auto;text-align:left}.control{width:100%;flex:none}.filter-actions{width:100%;padding-left:0}.chart-wrap{height:240px}.dialog-panel{height:auto;min-height:250px}.retention-cell{min-width:76px}}\n    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}\n  "],"styleLinks":[],"externalScripts":[],"scripts":["\n    'use strict';\n\n    // ---------- 基础工具 ----------\n    const $ = id => document.getElementById(id);\n    const palette = {primary:'#0066FF',primaryBg:'#E6F0FF',info:'#0091D5',success:'#0FC060',warning:'#E7772D',danger:'#D9001B',ink:'#3A3F4A',sub:'#6E7685',muted:'#9DA2AC',line:'#DFE1E5',lighter:'#F0F1F3'};\n    const formatInt = value => new Intl.NumberFormat('zh-CN',{maximumFractionDigits:0}).format(Math.round(value));\n    const formatPercent = value => value == null ? '—' : `${Number(value).toFixed(1)}%`;\n    const pad = value => String(value).padStart(2,'0');\n    const toDateKey = date => `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;\n    const shortDate = value => value.slice(5).replace('-','/');\n    const safeIcons = () => { if(window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons(); };\n    const escapeHTML = value => String(value).replace(/[&<>'\"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[character]));\n\n    // ---------- App Shell 导航 ----------\n    const navSections = [\n      {label:'用户管理',items:[\n        {id:'user-list',label:'用户列表',icon:'users',href:'index.html#user-list'},\n        {id:'user-statistics',label:'用户统计',icon:'chart-no-axes-column',href:'用户统计.html'},\n        {id:'team-list',label:'团队列表',icon:'users-round',href:'团队列表.html'},\n        {id:'enterprise-list',label:'企业列表',icon:'building-2',href:'企业列表.html'},\n        {id:'member-list',label:'成员列表',icon:'contact-round',href:'成员列表.html'}\n      ]},\n      {label:'订单管理',items:[\n        {id:'order-list',label:'订单列表',icon:'receipt-text',href:'订单列表.html'},\n        {id:'package-order',label:'套餐订单',icon:'package-check',href:'套餐订单.html'}\n      ]},\n      {label:'资源管理',items:[\n        {id:'environment-management',label:'环境管理',icon:'monitor-cog',href:'环境管理.html'},\n        {id:'proxy-list',label:'代理列表',icon:'network',href:'index.html#proxy-list'}\n      ]},\n      {label:'数据埋点',items:[\n        {id:'tracking-overview',label:'数据概览',icon:'layout-dashboard',href:'数据概览.html'},\n        {id:'tracking-governance',label:'口径治理',icon:'book-check',group:true,children:[{id:'tracking-events',label:'事件管理',href:'事件管理.html'},{id:'tracking-metrics',label:'指标管理',href:'指标管理.html'}]},\n        {id:'tracking-debug',label:'联调验证',icon:'radio-tower',href:'联调验证.html'},\n        {id:'tracking-quality',label:'质量监控',icon:'shield-alert',href:'质量监控.html'},\n        {id:'tracking-detail',label:'明细排查',icon:'list-filter',href:'明细排查.html'},\n        {id:'tracking-analysis',label:'数据分析',icon:'chart-column-increasing',href:'数据分析.html'},\n        {id:'tracking-dashboards',label:'资产沉淀',icon:'panels-top-left',href:'资产沉淀.html'},\n        {id:'tracking-insights',label:'决策复盘',icon:'lightbulb',href:'决策复盘.html'}\n      ]}\n    ];\n    let governanceExpanded = false;\n    let annoVisible=false,annoScopeStack=[],annoToggleDragged=false;\n    function menuLink(item,child=false){\n      const active=item.id==='user-statistics';\n      return `<a href=\"${item.href}\" class=\"menu-link ${active?'active-leaf':''} w-full px-2 flex items-center gap-3 text-left mb-1\" ${active?'aria-current=\"page\"':''} title=\"${item.label}\">${child?'':`<i data-lucide=\"${item.icon}\" class=\"menu-icon\"></i>`}<span class=\"menu-label flex-1\">${item.label}</span></a>`;\n    }\n    function renderNav(){\n      $('primaryNav').innerHTML=navSections.map(section=>`<div class=\"section-label\" aria-hidden=\"true\">${section.label}</div>${section.items.map(item=>item.group?`<div class=\"mb-1\"><button type=\"button\" data-nav-group=\"${item.id}\" class=\"menu-link w-full px-2 flex items-center gap-3 text-left\" aria-expanded=\"${governanceExpanded}\" aria-controls=\"submenu-${item.id}\"><i data-lucide=\"${item.icon}\" class=\"menu-icon\"></i><span class=\"menu-label flex-1\">${item.label}</span><i data-lucide=\"chevron-down\" class=\"group-chevron w-4 h-4\"></i></button><div id=\"submenu-${item.id}\" class=\"submenu ${governanceExpanded?'':'hidden'}\">${item.children.map(child=>menuLink(child,true)).join('')}</div></div>`:menuLink(item)).join('')}`).join('');\n      safeIcons();\n    }\n    function setSidebarCompact(compact,persist=true){\n      $('sidebar').classList.toggle('compact',compact);\n      const label=compact?'展开侧栏':'收起侧栏';\n      $('collapseBtn').title=label;$('collapseBtn').setAttribute('aria-label',label);\n      $('collapseBtn').innerHTML=`<i data-lucide=\"${compact?'panel-left-open':'panel-left-close'}\" class=\"w-[18px] h-[18px]\"></i>`;\n      if(persist){try{localStorage.setItem('yundeng-sidebar-compact',String(compact))}catch(_){}}\n      if(innerWidth<768)$('mobileOverlay').classList.toggle('hidden',compact);\n      safeIcons();renderAnnoBadges();\n    }\n    renderNav();\n    let initialCompact=innerWidth<1024;\n    try{const saved=localStorage.getItem('yundeng-sidebar-compact');if(saved!==null)initialCompact=saved==='true'}catch(_){}\n    setSidebarCompact(initialCompact,false);\n    $('collapseBtn').addEventListener('click',()=>setSidebarCompact(!$('sidebar').classList.contains('compact')));\n    $('mobileMenuBtn').addEventListener('click',()=>setSidebarCompact(false,false));\n    $('mobileOverlay').addEventListener('click',()=>setSidebarCompact(true,false));\n    $('primaryNav').addEventListener('click',event=>{const group=event.target.closest('[data-nav-group]');if(!group)return;governanceExpanded=!governanceExpanded;renderNav()});\n\n    // ---------- 页面状态与 Mock 数据 ----------\n    const appState={\n      pageState:'normal',tab:'trend',view:'chart',page:1,pageSize:10,refreshAt:new Date(),\n      filters:{days:30,status:'all',source:'all',affiliation:'all'},charts:[],querySerial:0\n    };\n    const metricHelp={\n      total:{title:'累计注册用户',text:'截至筛选结束日，按 user_id 去重的有效注册账号数；排除测试账号、合并别名和注册回滚记录。'},\n      new:{title:'新增注册用户',text:'注册完成时间落在统计周期内的去重 user_id 数；对比期为前一等长自然日区间。'},\n      active:{title:'期间活跃用户',text:'统计周期内至少产生一次有效业务行为的去重 user_id 数；不可由每日活跃人数相加得到。'},\n      retention:{title:'7 日留存率',text:'成熟注册 cohort 中，在注册后第 7 个北京时间自然日产生有效活跃的用户占比；未成熟 cohort 不计入。'}\n    };\n    function deterministicWave(index,base,amplitude,cycle=7){return Math.round(base+Math.sin(index/cycle*Math.PI*2)*amplitude+Math.cos(index/5)*amplitude*.35+(index%6)*3)}\n    function getFilterFactor(){\n      const status={all:1,normal:.86,disabled:.055,frozen:.028,cancelled:.057}[appState.filters.status];\n      const source={all:1,website:.47,invite:.31,partner:.14,admin:.08}[appState.filters.source];\n      const affiliation={all:1,linked:.72,independent:.28}[appState.filters.affiliation];\n      return status*source*affiliation;\n    }\n    function allocate(total,items){\n      let used=0;\n      return items.map((item,index)=>{const value=index===items.length-1?Math.max(0,total-used):Math.round(total*item.ratio);used+=value;return {...item,value}});\n    }\n    function buildMock(){\n      const days=appState.filters.days,factor=getFilterFactor(),end=new Date();end.setHours(0,0,0,0);\n      const start=new Date(end);start.setDate(end.getDate()-days+1);\n      const series=[];let total=Math.round(122840*factor);\n      for(let index=0;index<days;index++){\n        const date=new Date(start);date.setDate(start.getDate()+index);\n        const newUsers=Math.max(0,Math.round(deterministicWave(index+days,186,38)*factor));\n        total+=newUsers;\n        const dau=Math.max(0,Math.round(deterministicWave(index+3,1460,190)*Math.pow(factor,.78)));\n        const rolling7=Math.max(dau,Math.round(dau*(3.38+Math.sin(index/8)*.12)));\n        const d1=Number((48.6+Math.sin(index/6)*2.7).toFixed(1));\n        const mature7=index<=days-8;\n        const d7=mature7?Number((31.8+Math.cos(index/7)*2.2).toFixed(1)):null;\n        series.push({date:toDateKey(date),newUsers,total,dau,rolling7,d1,d7,status:index===days-1?'未完结':'完整'});\n      }\n      const newTotal=series.reduce((sum,row)=>sum+row.newUsers,0);\n      const maxDau=Math.max(...series.map(row=>row.dau));\n      const active=Math.round(maxDau*(days<=7?2.8:days<=30?6.9:12.6));\n      const mature=series.filter(row=>row.d7!=null);\n      const retention=mature.length?mature.reduce((sum,row)=>sum+row.d7,0)/mature.length:null;\n      const summary={total:series.at(-1).total,newUsers:newTotal,active,retention,netGrowth:newTotal,newChange:12.8,activeChange:9.4,retentionChange:2.1};\n      const sourceRatios=appState.filters.source==='all'?[{key:'website',label:'官网注册',ratio:.47},{key:'invite',label:'成员邀请',ratio:.31},{key:'partner',label:'渠道合作',ratio:.14},{key:'admin',label:'管理员创建',ratio:.08}]:[{key:appState.filters.source,label:$('sourceFilter').selectedOptions[0].text.replace('全部来源','全部来源'),ratio:1}];\n      const statusRatios=appState.filters.status==='all'?[{key:'normal',label:'正常',ratio:.86},{key:'disabled',label:'已停用',ratio:.055},{key:'frozen',label:'已冻结',ratio:.028},{key:'cancelled',label:'已注销',ratio:.057}]:[{key:appState.filters.status,label:$('statusFilter').selectedOptions[0].text,ratio:1}];\n      const affiliationRatios=appState.filters.affiliation==='all'?[{key:'linked',label:'有组织关系',ratio:.72},{key:'independent',label:'无组织关系',ratio:.28}]:[{key:appState.filters.affiliation,label:$('affiliationFilter').selectedOptions[0].text,ratio:1}];\n      const sources=allocate(newTotal,sourceRatios);\n      const statuses=allocate(summary.total,statusRatios);\n      const affiliations=allocate(summary.total,affiliationRatios);\n      const regions=allocate(summary.total,[{label:'广东',ratio:.226},{label:'浙江',ratio:.178},{label:'江苏',ratio:.151},{label:'上海',ratio:.119},{label:'北京',ratio:.104},{label:'其他地区',ratio:.178},{label:'未知',ratio:.044}]);\n      const cohorts=[];\n      for(let index=0;index<10;index++){\n        const age=index*3;\n        const date=new Date(end);date.setDate(end.getDate()-age);\n        const count=index===4?8:Math.max(12,Math.round((165+Math.sin(index)*32)*factor));\n        const suppressed=count<10;\n        const rates={};\n        [1,3,7,14,30].forEach(offset=>{rates[offset]=age>=offset&&!suppressed?Number(Math.max(8,60-Math.log2(offset+1)*10+Math.sin(index+offset)*2.4).toFixed(1)):null});\n        cohorts.push({date:toDateKey(date),age,count,suppressed,rates});\n      }\n      return {series,summary,sources,statuses,affiliations,regions,cohorts};\n    }\n    let mockData=buildMock();\n\n    // ---------- 渲染：通用状态 ----------\n    function destroyCharts(){appState.charts.forEach(chart=>{try{chart.destroy()}catch(_){}});appState.charts=[]}\n    function renderLoading(){\n      destroyCharts();\n      $('businessContent').innerHTML=`<div class=\"grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5\">${Array.from({length:4},()=>'<div class=\"kpi-card\"><div class=\"skeleton h-3 w-24\"></div><div class=\"skeleton h-8 w-32 mt-4\"></div><div class=\"skeleton h-3 w-40 mt-4\"></div></div>').join('')}</div><div class=\"border-b border-line h-10 flex gap-4\"><div class=\"skeleton h-5 w-24\"></div><div class=\"skeleton h-5 w-24\"></div><div class=\"skeleton h-5 w-24\"></div></div><div class=\"chart-grid mt-4\"><div class=\"chart-panel\"><div class=\"skeleton h-[280px]\"></div></div><div class=\"chart-panel\"><div class=\"skeleton h-[280px]\"></div></div></div>`;\n    }\n    function statePanel(icon,title,description,actionLabel,action){\n      return `<div class=\"state-panel\"><span class=\"w-12 h-12 rounded-lg bg-bg-page text-ink-muted flex items-center justify-center\"><i data-lucide=\"${icon}\" class=\"w-6 h-6\"></i></span><h2 class=\"mt-4 text-[18px] font-semibold text-ink-title\">${title}</h2><p class=\"mt-2 text-ink-sub\">${description}</p>${actionLabel?`<button type=\"button\" data-state-action=\"${action}\" class=\"btn btn-primary mt-5\">${actionLabel}</button>`:''}</div>`;\n    }\n    function renderState(){\n      $('staleBanner').classList.toggle('hidden',appState.pageState!=='stale');\n      $('exportBtn').disabled=appState.pageState==='stale'||appState.pageState==='loading'||appState.pageState==='forbidden';\n      if(appState.pageState==='loading'){renderLoading();safeIcons();return}\n      if(appState.pageState==='empty'){$('businessContent').innerHTML=statePanel('users','当前筛选条件下暂无用户数据','调整筛选条件或重置后重新查询','重置筛选','reset');safeIcons();return}\n      if(appState.pageState==='error'){$('businessContent').innerHTML=statePanel('triangle-alert','用户统计加载失败','请求编号 REQ-US-260813-042，请稍后重试','重新加载','retry');safeIcons();return}\n      if(appState.pageState==='forbidden'){$('businessContent').innerHTML=statePanel('shield-x','暂无用户统计查看权限','需要 user.statistics.read 权限后才能查看聚合结果','返回系统框架','back');safeIcons();return}\n      renderNormal();\n    }\n\n    // ---------- 渲染：KPI 与分析区 ----------\n    function trendText(value,suffix='%'){\n      if(value==null)return '<span class=\"trend-neutral\">不可比</span>';\n      const cls=value>0?'trend-up':value<0?'trend-down':'trend-neutral',arrow=value>0?'arrow-up-right':value<0?'arrow-down-right':'minus';\n      return `<span class=\"${cls} inline-flex items-center gap-1\"><i data-lucide=\"${arrow}\" class=\"w-3.5 h-3.5\"></i>${Math.abs(value).toFixed(1)}${suffix}</span>`;\n    }\n    function kpiCard(key,annotation,label,value,unit,comparison,description,icon){\n      return `<article class=\"kpi-card\"><div class=\"flex items-center justify-between gap-2\"><span class=\"text-[12px] text-ink-sub\">${label}</span><button type=\"button\" class=\"metric-help\" data-metric-help=\"${key}\" aria-label=\"查看${label}口径\"><i data-lucide=\"circle-help\" class=\"w-4 h-4\"></i></button></div><button type=\"button\" data-anno=\"${annotation}\" data-metric-jump=\"${key}\" class=\"metric-jump mt-2\"><span class=\"flex items-end gap-2\"><strong class=\"mono text-[26px] leading-8 text-ink-title\">${value}</strong><span class=\"text-[11px] text-ink-muted mb-1\">${unit}</span></span><span class=\"mt-2 flex items-center gap-1.5 text-[12px]\">${comparison}</span><span class=\"mt-1 block text-[11px] text-ink-muted truncate\">${description}</span></button></article>`;\n    }\n    function renderNormal(){\n      const summary=mockData.summary;\n      const kpis=[\n        kpiCard('total',9,'累计注册用户',formatInt(summary.total),'人',`<span class=\"trend-up inline-flex items-center gap-1\"><i data-lucide=\"user-plus\" class=\"w-3.5 h-3.5\"></i>本期净增 ${formatInt(summary.netGrowth)}</span>`,'截至筛选结束日，按 user_id 去重','users'),\n        kpiCard('new',10,'新增注册用户',formatInt(summary.newUsers),'人',`${trendText(summary.newChange)}<span class=\"text-ink-muted\">较上一等长周期</span>`,'注册完成时间落在统计周期内','user-plus'),\n        kpiCard('active',11,'期间活跃用户',formatInt(summary.active),'人',`${trendText(summary.activeChange)}<span class=\"text-ink-muted\">较上一等长周期</span>`,'周期内至少一次有效业务行为','activity'),\n        kpiCard('retention',12,'7 日留存率',formatPercent(summary.retention),'',`${trendText(summary.retentionChange,' 个百分点')}<span class=\"text-ink-muted\">较上一成熟 cohort</span>`,'仅计算已到第 7 日的注册 cohort','repeat-2')\n      ];\n      $('businessContent').innerHTML=`<div class=\"grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5\">${kpis.join('')}</div><div class=\"flex items-end justify-between gap-3 border-b border-line mb-1\"><div class=\"flex items-center overflow-x-auto\" role=\"tablist\" aria-label=\"用户统计分析类型\"><button type=\"button\" data-anno=\"13\" class=\"analysis-tab ${appState.tab==='trend'?'active':''}\" data-tab=\"trend\" role=\"tab\" aria-selected=\"${appState.tab==='trend'}\">规模与活跃</button><button type=\"button\" class=\"analysis-tab ${appState.tab==='structure'?'active':''}\" data-tab=\"structure\" role=\"tab\" aria-selected=\"${appState.tab==='structure'}\">用户结构</button><button type=\"button\" class=\"analysis-tab ${appState.tab==='retention'?'active':''}\" data-tab=\"retention\" role=\"tab\" aria-selected=\"${appState.tab==='retention'}\">留存分析</button></div><div data-anno=\"14\" class=\"segmented mb-1 shrink-0\" aria-label=\"结果展示方式\"><button type=\"button\" data-view=\"chart\" class=\"segment ${appState.view==='chart'?'active':''}\" aria-pressed=\"${appState.view==='chart'}\"><i data-lucide=\"chart-line\" class=\"w-3.5 h-3.5\"></i>${appState.tab==='retention'?'矩阵':'图表'}</button><button type=\"button\" data-view=\"table\" class=\"segment ${appState.view==='table'?'active':''}\" aria-pressed=\"${appState.view==='table'}\"><i data-lucide=\"table-2\" class=\"w-3.5 h-3.5\"></i>数据表</button></div></div><div id=\"analysisContent\"></div>`;\n      renderAnalysis();safeIcons();setTimeout(renderAnnoBadges,0);\n    }\n    function renderAnalysis(){\n      destroyCharts();appState.page=1;\n      if(appState.tab==='trend')renderTrend();\n      if(appState.tab==='structure')renderStructure();\n      if(appState.tab==='retention')renderRetention();\n      safeIcons();setTimeout(renderAnnoBadges,0);\n    }\n    function sectionHeading(title,meta,annotate=false){return `<div class=\"flex items-start justify-between gap-3 mb-3\"><div><h3 ${annotate?'data-anno=\"15\"':''} class=\"inline-block text-[16px] font-semibold text-ink-title\">${title}</h3><p class=\"mt-1 text-[12px] text-ink-muted\">${meta}</p></div></div>`}\n    function chartFallback(){return '<div class=\"h-full flex items-center justify-center text-ink-muted\">图表组件未加载，请切换数据表查看</div>'}\n    function chartOptions(){return {responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,color:palette.sub,font:{size:12}}},tooltip:{callbacks:{label:context=>`${context.dataset.label}：${formatInt(context.parsed.y)}`}}},scales:{x:{grid:{display:false},ticks:{color:palette.muted,maxTicksLimit:8,font:{size:11}}},y:{beginAtZero:true,grid:{color:palette.lighter},ticks:{color:palette.muted,font:{size:11}}}}}}\n    function createChart(canvas,config){if(!window.Chart){canvas.parentElement.innerHTML=chartFallback();return}appState.charts.push(new Chart(canvas,config))}\n\n    // ---------- 规模与活跃 ----------\n    function renderTrend(){\n      if(appState.view==='table'){renderDailyTable();return}\n      $('analysisContent').innerHTML=`<div class=\"chart-grid\"><section class=\"chart-panel\">${sectionHeading('用户增长趋势','新增按注册日统计；累计值为期末快照',true)}<div class=\"chart-wrap\"><canvas id=\"growthChart\" role=\"img\" aria-label=\"新增注册与累计注册趋势图\"></canvas></div></section><section class=\"chart-panel\">${sectionHeading('用户活跃趋势','日活跃与过去 7 个自然日滚动活跃')}<div class=\"chart-wrap\"><canvas id=\"activeChart\" role=\"img\" aria-label=\"日活跃与七日滚动活跃趋势图\"></canvas></div></section></div><div class=\"mt-3 pt-3 border-t border-line-lighter flex items-center justify-between flex-wrap gap-2 text-[12px] text-ink-muted\"><span>统计主体：按 <span class=\"mono\">user_id</span> 去重的平台注册账号</span><span class=\"mono\">ACTIVITY/user-valid-v1.3</span></div>`;\n      const labels=mockData.series.map(row=>shortDate(row.date));\n      createChart($('growthChart'),{type:'line',data:{labels,datasets:[{type:'bar',label:'新增注册用户',data:mockData.series.map(row=>row.newUsers),backgroundColor:'rgba(0,145,213,.45)',borderColor:palette.info,borderWidth:1,borderRadius:4,yAxisID:'y'},{label:'累计注册用户',data:mockData.series.map(row=>row.total),borderColor:palette.primary,backgroundColor:'rgba(0,102,255,.08)',pointRadius:0,pointHoverRadius:3,tension:.32,yAxisID:'y1'}]},options:{...chartOptions(),scales:{x:{grid:{display:false},ticks:{color:palette.muted,maxTicksLimit:8,font:{size:11}}},y:{beginAtZero:true,position:'left',grid:{color:palette.lighter},ticks:{color:palette.muted}},y1:{position:'right',grid:{drawOnChartArea:false},ticks:{color:palette.muted,callback:value=>`${Math.round(value/10000)}万`}}}}});\n      createChart($('activeChart'),{type:'line',data:{labels,datasets:[{label:'日活跃用户',data:mockData.series.map(row=>row.dau),borderColor:palette.success,backgroundColor:'rgba(15,192,96,.08)',fill:true,pointRadius:0,pointHoverRadius:3,tension:.32},{label:'7 日滚动活跃用户',data:mockData.series.map(row=>row.rolling7),borderColor:palette.warning,pointRadius:0,pointHoverRadius:3,tension:.32}]},options:chartOptions()});\n    }\n    function renderDailyTable(){\n      const rows=[...mockData.series].reverse();\n      $('analysisContent').innerHTML=`<div class=\"pt-4\">${sectionHeading('日粒度聚合数据','图表与数据表使用同一查询结果',true)}<div id=\"tableWrap\" class=\"overflow-x-auto\"></div><div id=\"pagination\" class=\"flex items-center justify-end flex-wrap gap-4 pt-5 text-[12px]\"></div></div>`;\n      renderPagedTable(rows,'daily');\n    }\n\n    // ---------- 用户结构 ----------\n    function renderStructure(){\n      if(appState.view==='table'){renderStructureTable();return}\n      const colors=[palette.primary,palette.info,palette.success,palette.warning];\n      $('analysisContent').innerHTML=`<div class=\"chart-grid\"><section class=\"chart-panel\">${sectionHeading('注册来源分布','按统计周期内新增注册用户计算',true)}<div class=\"chart-wrap\"><canvas id=\"sourceChart\" role=\"img\" aria-label=\"注册来源分布图\"></canvas></div></section><section class=\"chart-panel\">${sectionHeading('账号状态分布','按筛选结束时点的账号状态快照计算')}<div class=\"chart-wrap\"><canvas id=\"statusChart\" role=\"img\" aria-label=\"账号状态分布图\"></canvas></div></section></div><div class=\"grid grid-cols-1 xl:grid-cols-2 border-t border-line-light\"><section class=\"py-4 xl:pr-5\"><h3 class=\"text-[16px] font-semibold text-ink-title mb-3\">账号归属</h3><div id=\"affiliationList\" class=\"space-y-1\"></div></section><section class=\"py-4 xl:pl-5 xl:border-l border-line-light\"><h3 class=\"text-[16px] font-semibold text-ink-title mb-3\">地区分布</h3><div id=\"regionList\" class=\"space-y-1\"></div></section></div>`;\n      createChart($('sourceChart'),{type:'doughnut',data:{labels:mockData.sources.map(row=>row.label),datasets:[{data:mockData.sources.map(row=>row.value),backgroundColor:colors.slice(0,mockData.sources.length),borderColor:'#FFFFFF',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'64%',plugins:{legend:{position:'right',labels:{usePointStyle:true,boxWidth:8,color:palette.sub,font:{size:12}}},tooltip:{callbacks:{label:context=>`${context.label}：${formatInt(context.parsed)} 人`}}}}});\n      createChart($('statusChart'),{type:'bar',data:{labels:mockData.statuses.map(row=>row.label),datasets:[{label:'用户数',data:mockData.statuses.map(row=>row.value),backgroundColor:colors.slice(0,mockData.statuses.length),borderRadius:4}]},options:{...chartOptions(),plugins:{legend:{display:false},tooltip:{callbacks:{label:context=>`用户数：${formatInt(context.parsed.y)} 人`}}}}});\n      $('affiliationList').innerHTML=distributionHTML(mockData.affiliations);\n      $('regionList').innerHTML=distributionHTML(mockData.regions);\n    }\n    function distributionHTML(rows){const total=rows.reduce((sum,row)=>sum+row.value,0)||1;return rows.map(row=>{const percent=row.value/total*100;return `<div class=\"distribution-row\"><span class=\"truncate\">${escapeHTML(row.label)}</span><div class=\"distribution-track\"><span class=\"distribution-fill\" style=\"width:${percent.toFixed(1)}%\"></span></div><span class=\"mono text-right text-[12px]\">${formatPercent(percent)}</span></div>`}).join('')}\n    function structureRows(){\n      const groups=[['注册来源',mockData.sources,mockData.summary.newUsers],['账号状态',mockData.statuses,mockData.summary.total],['账号归属',mockData.affiliations,mockData.summary.total],['地区',mockData.regions,mockData.summary.total]];\n      return groups.flatMap(([dimension,rows,total])=>rows.map((row,index)=>({dimension,group:row.label,users:row.value,percent:total?row.value/total*100:0,newUsers:Math.round(row.value*(dimension==='注册来源'?1:.024)),active:Math.round(row.value*(.16+(index%3)*.035))})));\n    }\n    function renderStructureTable(){\n      $('analysisContent').innerHTML=`<div class=\"pt-4\">${sectionHeading('用户结构聚合数据','各维度按独立分母计算，占比不可跨维度相加',true)}<div id=\"tableWrap\" class=\"overflow-x-auto\"></div><div id=\"pagination\" class=\"flex items-center justify-end flex-wrap gap-4 pt-5 text-[12px]\"></div></div>`;\n      renderPagedTable(structureRows(),'structure');\n    }\n\n    // ---------- 留存分析 ----------\n    function cellStyle(rate){if(rate==null)return '';const alpha=Math.min(.32,.06+rate/100*.36);return `background:rgba(0,102,255,${alpha.toFixed(2)});color:${rate>44?'#1A1D24':'#3A3F4A'}`}\n    function renderRetention(){\n      if(appState.view==='table'){renderRetentionSummary();return}\n      $('analysisContent').innerHTML=`<div class=\"pt-4\">${sectionHeading('注册用户留存矩阵','未到观察日的 cohort 显示“未成熟”，不计入平均',true)}<div class=\"overflow-x-auto\"><table class=\"data-table min-w-[760px]\"><thead><tr><th>注册日期</th><th>注册用户</th><th>次日</th><th>第 3 日</th><th>第 7 日</th><th>第 14 日</th><th>第 30 日</th></tr></thead><tbody>${mockData.cohorts.map(row=>`<tr><td class=\"mono\">${row.date}</td><td class=\"mono\">${row.suppressed?'&lt;10':formatInt(row.count)}</td>${[1,3,7,14,30].map(offset=>{const rate=row.rates[offset];if(row.suppressed)return '<td class=\"retention-cell retention-muted\" title=\"低于隐私阈值\">—</td>';if(row.age<offset)return '<td class=\"retention-cell retention-muted\">未成熟</td>';const numerator=Math.round(row.count*rate/100);return `<td class=\"retention-cell\" style=\"${cellStyle(rate)}\" title=\"${numerator} / ${row.count}\">${formatPercent(rate)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class=\"mt-4 flex items-center justify-between flex-wrap gap-2 text-[12px] text-ink-muted\"><span>隐私阈值：cohort 小于 10 人时隐藏人数与比率</span><span>账号状态按当前快照筛选</span></div></div>`;\n    }\n    function retentionAverages(){return [1,3,7,14,30].map(offset=>{const rows=mockData.cohorts.filter(row=>row.rates[offset]!=null);return {offset,cohorts:rows.length,users:rows.reduce((sum,row)=>sum+row.count,0),rate:rows.length?rows.reduce((sum,row)=>sum+row.rates[offset],0)/rows.length:null}})}\n    function renderRetentionSummary(){\n      const rows=retentionAverages();\n      $('analysisContent').innerHTML=`<div class=\"pt-4\">${sectionHeading('留存周期汇总','仅汇总成熟且未触发隐私抑制的注册 cohort',true)}<div class=\"overflow-x-auto\"><table class=\"data-table\"><thead><tr><th>观察周期</th><th>成熟 cohort 数</th><th>纳入注册用户</th><th>平均留存率</th><th>数据状态</th></tr></thead><tbody>${rows.map(row=>`<tr><td>第 ${row.offset} 日</td><td class=\"mono\">${formatInt(row.cohorts)}</td><td class=\"mono\">${formatInt(row.users)}</td><td class=\"mono\">${formatPercent(row.rate)}</td><td><span class=\"inline-flex px-2 h-6 items-center rounded border border-success bg-success-bg text-success text-[11px]\">已成熟</span></td></tr>`).join('')}</tbody></table></div></div>`;\n    }\n\n    // ---------- 数据表与分页 ----------\n    function renderPagedTable(rows,type){\n      const totalPages=Math.max(1,Math.ceil(rows.length/appState.pageSize));\n      appState.page=Math.min(appState.page,totalPages);\n      const pageRows=rows.slice((appState.page-1)*appState.pageSize,appState.page*appState.pageSize);\n      if(type==='daily')$('tableWrap').innerHTML=`<table class=\"data-table min-w-[920px]\"><thead><tr><th>日期</th><th>新增注册</th><th>累计注册</th><th>日活跃用户</th><th>7 日滚动活跃</th><th>次日留存</th><th>7 日留存</th><th>数据状态</th></tr></thead><tbody>${pageRows.map(row=>`<tr><td class=\"mono\">${row.date}</td><td class=\"mono\">${formatInt(row.newUsers)}</td><td class=\"mono\">${formatInt(row.total)}</td><td class=\"mono\">${formatInt(row.dau)}</td><td class=\"mono\">${formatInt(row.rolling7)}</td><td class=\"mono\">${formatPercent(row.d1)}</td><td class=\"mono\">${row.d7==null?'未成熟':formatPercent(row.d7)}</td><td>${row.status==='完整'?'<span class=\"text-success\">完整</span>':'<span class=\"text-warning\">未完结</span>'}</td></tr>`).join('')}</tbody></table>`;\n      if(type==='structure')$('tableWrap').innerHTML=`<table class=\"data-table min-w-[820px]\"><thead><tr><th>维度</th><th>分组</th><th>用户数</th><th>维度内占比</th><th>期间新增</th><th>期间活跃</th><th>活跃率</th></tr></thead><tbody>${pageRows.map(row=>`<tr><td>${row.dimension}</td><td>${row.group}</td><td class=\"mono\">${formatInt(row.users)}</td><td class=\"mono\">${formatPercent(row.percent)}</td><td class=\"mono\">${formatInt(row.newUsers)}</td><td class=\"mono\">${formatInt(row.active)}</td><td class=\"mono\">${formatPercent(row.users?row.active/row.users*100:0)}</td></tr>`).join('')}</tbody></table>`;\n      renderPagination(rows.length,totalPages,type);\n    }\n    function pageItems(totalPages,current){\n      if(totalPages<=7)return Array.from({length:totalPages},(_,index)=>index+1);\n      const result=[1];if(current>3)result.push('…');for(let value=Math.max(2,current-1);value<=Math.min(totalPages-1,current+1);value++)result.push(value);if(current<totalPages-2)result.push('…');result.push(totalPages);return result;\n    }\n    function renderPagination(total,totalPages,type){\n      const start=total?((appState.page-1)*appState.pageSize+1):0,end=Math.min(total,appState.page*appState.pageSize);\n      $('pagination').innerHTML=`<div class=\"flex gap-1\" id=\"pgNav\" data-anno=\"16\"><button type=\"button\" class=\"pg-btn\" data-page=\"${appState.page-1}\" ${appState.page===1?'disabled':''} aria-label=\"上一页\">‹</button>${pageItems(totalPages,appState.page).map(item=>item==='…'?'<span class=\"pg-ellipsis\">…</span>':`<button type=\"button\" class=\"pg-btn ${item===appState.page?'pg-current':''}\" data-page=\"${item}\">${item}</button>`).join('')}<button type=\"button\" class=\"pg-btn\" data-page=\"${appState.page+1}\" ${appState.page===totalPages?'disabled':''} aria-label=\"下一页\">›</button></div><span class=\"pg-select-wrap\"><select id=\"pageSizeSelect\" class=\"pg-select\"><option value=\"10\" ${appState.pageSize===10?'selected':''}>10 条/页</option><option value=\"20\" ${appState.pageSize===20?'selected':''}>20 条/页</option><option value=\"50\" ${appState.pageSize===50?'selected':''}>50 条/页</option></select></span><span class=\"flex items-center gap-2\">跳至 <input id=\"pageJump\" class=\"pg-jump-input mono\" type=\"number\" min=\"1\" max=\"${totalPages}\" value=\"1\"> 页</span><span class=\"text-ink-muted whitespace-nowrap\">共 ${total} 条记录　${start}-${end}　第 ${appState.page}/${totalPages} 页</span>`;\n      $('pagination').dataset.tableType=type;\n    }\n\n    // ---------- 查询与业务交互 ----------\n    function syncFilters(){appState.filters={days:Number($('rangeFilter').value),status:$('statusFilter').value,source:$('sourceFilter').value,affiliation:$('affiliationFilter').value}}\n    function filterLabels(){return {range:$('rangeFilter').selectedOptions[0].text,status:$('statusFilter').selectedOptions[0].text,source:$('sourceFilter').selectedOptions[0].text,affiliation:$('affiliationFilter').selectedOptions[0].text}}\n    function setControlsDisabled(disabled){['rangeFilter','statusFilter','sourceFilter','affiliationFilter','queryBtn','resetBtn'].forEach(id=>$(id).disabled=disabled)}\n    function updateMeta(){const cutoff=new Date(appState.refreshAt.getTime()-12*60*1000);$('dataMeta').textContent=`数据截止 ${toDateKey(cutoff)} ${pad(cutoff.getHours())}:${pad(cutoff.getMinutes())} · 北京时间 · 口径 V1.0`;}\n    function runQuery(){\n      syncFilters();const serial=++appState.querySerial;appState.pageState='loading';setControlsDisabled(true);renderState();\n      setTimeout(()=>{if(serial!==appState.querySerial)return;mockData=buildMock();appState.refreshAt=new Date();appState.pageState='normal';appState.page=1;setControlsDisabled(false);updateMeta();renderState();updateURL()},520);\n    }\n    function resetFilters(run=true){$('rangeFilter').value='30';$('statusFilter').value='all';$('sourceFilter').value='all';$('affiliationFilter').value='all';if(run)runQuery()}\n    function updateURL(){try{const query=new URLSearchParams({days:String(appState.filters.days),status:appState.filters.status,source:appState.filters.source,affiliation:appState.filters.affiliation});history.replaceState(null,'',`${location.pathname}?${query}#user-statistics`)}catch(_){}}\n    function refreshData(){const icon=$('refreshBtn').querySelector('svg,[data-lucide]');if(icon)icon.classList.add('animate-spin');$('refreshBtn').disabled=true;setTimeout(()=>{appState.pageState='normal';appState.refreshAt=new Date();mockData=buildMock();updateMeta();renderState();$('refreshBtn').disabled=false;showToast('数据已刷新','success')},480)}\n    $('filterForm').addEventListener('submit',event=>{event.preventDefault();runQuery()});\n    $('resetBtn').addEventListener('click',()=>resetFilters(true));\n    $('refreshBtn').addEventListener('click',refreshData);\n    $('staleRefreshBtn').addEventListener('click',refreshData);\n    $('businessContent').addEventListener('click',event=>{\n      const tab=event.target.closest('[data-tab]');if(tab){appState.tab=tab.dataset.tab;appState.view='chart';renderNormal();return}\n      const view=event.target.closest('[data-view]');if(view){appState.view=view.dataset.view;renderNormal();return}\n      const metric=event.target.closest('[data-metric-jump]');if(metric){appState.tab=metric.dataset.metricJump==='retention'?'retention':'trend';appState.view='chart';renderNormal();return}\n      const help=event.target.closest('[data-metric-help]');if(help){openMetricHelp(help,help.dataset.metricHelp);return}\n      const stateAction=event.target.closest('[data-state-action]');if(stateAction){if(stateAction.dataset.stateAction==='reset')resetFilters(true);if(stateAction.dataset.stateAction==='retry')runQuery();if(stateAction.dataset.stateAction==='back')location.href='index.html';return}\n      const pageButton=event.target.closest('[data-page]');if(pageButton&&!pageButton.disabled){appState.page=Number(pageButton.dataset.page);rerenderCurrentTable();return}\n    });\n    $('businessContent').addEventListener('change',event=>{if(event.target.id==='pageSizeSelect'){appState.pageSize=Number(event.target.value);appState.page=1;rerenderCurrentTable()}});\n    $('businessContent').addEventListener('keydown',event=>{if(event.target.id==='pageJump'&&event.key==='Enter'){event.preventDefault();const max=Number(event.target.max);appState.page=Math.max(1,Math.min(max,Number(event.target.value)||1));rerenderCurrentTable()}});\n    function rerenderCurrentTable(){if(appState.tab==='trend')renderDailyTable();if(appState.tab==='structure')renderStructureTable()}\n\n    // ---------- 指标口径 Popover ----------\n    let metricHelpTrigger=null;\n    function openMetricHelp(trigger,key){\n      const item=metricHelp[key];metricHelpTrigger=trigger;$('metricPopoverTitle').textContent=item.title;$('metricPopoverText').textContent=item.text;\n      const rect=trigger.getBoundingClientRect(),popover=$('metricPopover');popover.classList.remove('hidden');\n      const width=300;popover.style.left=`${Math.max(8,Math.min(innerWidth-width-8,rect.right-width))}px`;popover.style.top=`${Math.min(innerHeight-popover.offsetHeight-8,rect.bottom+8)}px`;safeIcons();\n    }\n    function closeMetricHelp(restore=false){$('metricPopover').classList.add('hidden');if(restore&&metricHelpTrigger)metricHelpTrigger.focus();metricHelpTrigger=null}\n    $('metricPopoverClose').addEventListener('click',()=>closeMetricHelp(true));\n\n    // ---------- 导出 Dialog ----------\n    let exportTrigger=null;\n    function openExport(){\n      if(appState.pageState==='stale')return;exportTrigger=document.activeElement;const labels=filterLabels();\n      $('exportSummary').textContent=`${labels.range} · ${labels.status} · ${labels.source} · ${labels.affiliation}`;\n      $('exportOverlay').classList.remove('hidden');$('exportOverlay').classList.add('flex');pushAnnoScope($('exportPanel'));$('exportCancelBtn').focus();safeIcons();\n    }\n    function closeExport(restore=true){$('exportOverlay').classList.add('hidden');$('exportOverlay').classList.remove('flex');popAnnoScope($('exportPanel'));if(restore&&exportTrigger)exportTrigger.focus()}\n    $('exportBtn').addEventListener('click',openExport);\n    $('exportCloseBtn').addEventListener('click',()=>closeExport());\n    $('exportCancelBtn').addEventListener('click',()=>closeExport());\n    $('exportOverlay').addEventListener('cl   const notices = [
    { title: '质量监控待处理', desc: 'browser_start_success 事件成功率低于阈值。', time: '5 分钟前', unread: true },
    { title: '指标口径待确认', desc: '代理购买转化率 V2 草案等待审核。', time: '今天 09:30', unread: true },
    { title: '历史数据补偿完成', desc: '2026-08-10 PC 端缺失事件已完成回补。', time: '昨天 18:20', unread: false }
  ];

  const routes = new Map();
  const routeParents = new Map();
  navigation.forEach((section) => {
    section.items.forEach((item) => {
      routes.set(item.id, { ...item, section: section.label });
      if (item.children) {
        item.children.forEach((child) => {
          routes.set(child.id, { ...child, section: section.label, parentLabel: item.label });
          routeParents.set(child.id, item.id);
        });
      }
    });
  });

  const $ = (id) => document.getElementById(id);
  const outlet = $('appRouteOutlet');
  const content = $('appContent');
  const sidebar = $('appSidebar');
  let currentRoute = resolveRoute(INLINE_ROUTE || decodeURIComponent(location.hash.slice(1)) || 'home');
  let groupState = readJson(GROUP_STATE_KEY, { 'tracking-governance': true });
  let moduleReady = false;
  let reloadScheduled = false;

  function readJson(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? { ...fallback, ...JSON.parse(value) } : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function writeJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
  }

  function resolveRoute(routeId) {
    const route = routes.get(routeId);
    if (!route) return routes.get('home');
    if (route.group) return routes.get(route.children[0].id);
    return route;
  }

  function routeHref(routeId, search = '') {
    const file = ROUTE_FILES[routeId] || APP_ENTRY;
    const inPrototype = /\/Prototype\//.test(location.pathname);
    const target = routeId === 'home' ? (inPrototype ? '../index.html' : 'index.html') : (inPrototype ? file : 'Prototype/' + file);
    return target + (search || '');
  }

  function icon(name, className = 'app-menu-icon') {
    return `<i data-lucide="${name}" class="${className}"></i>`;
  }

  function renderNavigation() {
    const activeParent = routeParents.get(currentRoute.id);
    $('appPrimaryNav').innerHTML = navigation.map((section) => {
      const items = section.items.map((item) => {
        if (!item.group) {
          const active = item.id === currentRoute.id;
          return `<a class="app-menu-link${active ? ' is-active' : ''}" href="${routeHref(item.id)}" data-app-route="${item.id}" ${active ? 'aria-current="page"' : ''}>${icon(item.icon)}<span class="app-menu-label">${item.label}</span></a>`;
        }
        const active = activeParent === item.id;
        const expanded = groupState[item.id] !== false;
        return `<div class="app-menu-group"><button class="app-menu-link app-group-toggle${active ? ' is-group-active' : ''}" type="button" data-app-group="${item.id}" aria-expanded="${expanded}" aria-controls="app-submenu-${item.id}">${icon(item.icon)}<span class="app-menu-label">${item.label}</span>${icon('chevron-down', 'app-group-chevron')}</button><div id="app-submenu-${item.id}" class="app-submenu${expanded ? '' : ' is-collapsed'}">${item.children.map((child) => {
          const childActive = child.id === currentRoute.id;
          return `<a class="app-menu-link${childActive ? ' is-active' : ''}" href="${routeHref(child.id)}" data-app-route="${child.id}" ${childActive ? 'aria-current="page"' : ''}><span class="app-menu-label">${child.label}</span></a>`;
        }).join('')}</div></div>`;
      }).join('');
      return `<div class="app-section-label">${section.label}</div>${items}`;
    }).join('');
    window.lucide?.createIcons();
  }

  function renderRouteTitle() {
    document.title = `云登后台 · ${currentRoute.label}`;
  }

  function setSidebarCompact(compact) {
    sidebar.classList.toggle('is-compact', compact);
    $('appCollapseButton').setAttribute('aria-label', compact ? '展开侧栏' : '收起侧栏');
    $('appCollapseButton').setAttribute('title', compact ? '展开侧栏' : '收起侧栏');
    $('appCollapseButton').setAttribute('aria-expanded', String(!compact));
    try { localStorage.setItem(SIDEBAR_STATE_KEY, String(compact)); } catch (_) {}
    window.lucide?.createIcons();
  }

  function readSidebarCompact() {
    if (innerWidth < 768) return false;
    try {
      const saved = localStorage.getItem(SIDEBAR_STATE_KEY);
      return saved === null ? innerWidth < 1100 : saved === 'true';
    } catch (_) {
      return innerWidth < 1100;
    }
  }

  function openMobileSidebar() {
    sidebar.classList.add('is-mobile-open');
    $('appMobileOverlay').hidden = false;
    $('appMobileMenu').setAttribute('aria-expanded', 'true');
  }

  function closeMobileSidebar() {
    sidebar.classList.remove('is-mobile-open');
    $('appMobileOverlay').hidden = true;
    $('appMobileMenu').setAttribute('aria-expanded', 'false');
  }

  function renderCompactFlyout(groupId, trigger) {
    const group = routes.get(groupId);
    const flyout = $('appCompactFlyout');
    const rect = trigger.getBoundingClientRect();
    flyout.style.top = `${Math.min(innerHeight - 120, Math.max(60, rect.top))}px`;
    flyout.innerHTML = group.children.map((child) => `<a class="app-menu-link${child.id === currentRoute.id ? ' is-active' : ''}" href="${routeHref(child.id)}" data-app-route="${child.id}"><span class="app-menu-label">${child.label}</span></a>`).join('');
    flyout.hidden = false;
  }

  function closeCompactFlyout() { $('appCompactFlyout').hidden = true; }

  function renderNotices() {
    $('appNoticeList').innerHTML = notices.map((item) => `<button type="button" class="app-notice-item"><span class="app-notice-item-dot${item.unread ? '' : ' is-read'}"></span><span class="min-w-0"><span class="app-notice-title">${item.title}</span><span class="app-notice-desc block">${item.desc}</span><span class="app-notice-time mono block">${item.time}</span></span></button>`).join('');
  }

  function togglePopover(id) {
    ['appNoticePopover', 'appAccountPopover'].forEach((popoverId) => {
      if (popoverId !== id) $(popoverId).hidden = true;
    });
    $(id).hidden = !$(id).hidden;
  }

  function closePopovers() {
    $('appNoticePopover').hidden = true;
    $('appAccountPopover').hidden = true;
  }

  function toast(message) {
    const element = document.createElement('div');
    element.className = 'app-toast';
    element.textContent = message;
    $('appToastContainer').append(element);
    setTimeout(() => element.remove(), 2600);
  }

  function moduleStateKey(routeId) { return `${MODULE_STATE_PREFIX}${routeId}`; }

  function controlKey(element, index) {
    if (element.id) return `id:${element.id}`;
    if (element.name) return `name:${element.name}:${index}`;
    return `index:${index}`;
  }

  function activeKey(element, index) {
    if (element.id) return `id:${element.id}`;
    for (const key of ['tab', 'view', 'page', 'status', 'mode', 'type']) {
      if (element.dataset[key] !== undefined) return `data-${key}:${element.dataset[key]}`;
    }
    return `text:${(element.textContent || '').trim()}:${index}`;
  }

  function captureModuleState() {
    if (!moduleReady || !currentRoute?.id) return;
    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file')
      .map((element, index) => ({
        key: controlKey(element, index),
        value: element.type === 'checkbox' || element.type === 'radio' ? element.checked : element.value,
        checked: element.type === 'checkbox' || element.type === 'radio'
      }));
    const active = [...outlet.querySelectorAll('.tab.active, .pg-btn.active, [role="tab"][aria-selected="true"], [data-view].active, [data-page].active')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => activeKey(element, index));
    const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => ({ key: element.id || `index:${index}`, top: element.scrollTop, left: element.scrollLeft }));
    const state = { controls, active, contentScroll: { top: content.scrollTop, left: content.scrollLeft }, scrollables, savedAt: Date.now() };
    try { sessionStorage.setItem(moduleStateKey(currentRoute.id), JSON.stringify(state)); } catch (_) {}
  }

  function restoreModuleState() {
    let state;
    try { state = JSON.parse(sessionStorage.getItem(moduleStateKey(currentRoute.id)) || 'null'); } catch (_) {}
    if (!state) return;

    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file');
    const controlMap = new Map(controls.map((element, index) => [controlKey(element, index), element]));
    state.controls?.forEach((entry) => {
      const element = controlMap.get(entry.key);
      if (!element) return;
      if (entry.checked) element.checked = Boolean(entry.value);
      else element.value = entry.value;
    });

    const activeElements = [...outlet.querySelectorAll('.tab, .pg-btn, [role="tab"], [data-view], [data-page]')]
      .filter((element) => !element.closest('.app-module-compat'));
    const activeMap = new Map(activeElements.map((element, index) => [activeKey(element, index), element]));
    state.active?.forEach((key) => {
      const element = activeMap.get(key);
      if (element && !element.classList.contains('active')) element.click();
    });

    requestAnimationFrame(() => {
      content.scrollTo(state.contentScroll || { top: 0, left: 0 });
      const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
        .filter((element) => !element.closest('.app-module-compat'));
      state.scrollables?.forEach((entry) => {
        const element = entry.key.startsWith('index:') ? scrollables[Number(entry.key.slice(6))] : document.getElementById(entry.key);
        element?.scrollTo({ top: entry.top, left: entry.left });
      });
    });
  }

  function loadScript(src, marker = 'resource') {
    const absolute = new URL(src, document.baseURI).href;
    const existing = [...document.scripts].find((script) => script.src === absolute);
    if (existing) {
      if (existing.dataset.loaded === 'true' || !existing.dataset.appDynamic) return Promise.resolve();
      return new Promise((resolve, reject) => {
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', reject, { once: true });
      });
    }
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.dataset.appDynamic = marker;
      script.addEventListener('load', () => { script.dataset.loaded = 'true'; resolve(); }, { once: true });
      script.addEventListener('error', () => reject(new Error(`无法加载脚本：${src}`)), { once: true });
      document.head.append(script);
    });
  }

  function moduleResource(src) {
    return /^(?:[a-z]+:|\/|data:)/i.test(src) ? src : `${RESOURCE_ROOT}${src}`;
  }

  function loadStyle(href) {
    const resourceHref = /^(?:[a-z]+:|\/|data:)/i.test(href) ? href : `${RESOURCE_ROOT}${href}`;
    const absolute = new URL(resourceHref, document.baseURI).href;
    if ([...document.styleSheets].some((sheet) => sheet.href === absolute)) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = resourceHref;
    link.dataset.appModuleStyle = currentRoute.id;
    document.head.append(link);
  }

  function runInlineScript(source, index) {
    const script = document.createElement('script');
    script.dataset.appModuleScript = `${currentRoute.id}:${index}`;
    script.textContent = `${source}\n//# sourceURL=yundeng-module-${currentRoute.id}-${index}.js`;
    document.body.append(script);
  }

  function disableInvoiceAnnotations(route) {
    if (route.id !== 'invoice-management') return;
    const moduleRoot = outlet.querySelector('[data-module-root="invoice-management"]');
    if (!moduleRoot) return;
    const toggle = moduleRoot.querySelector('#invoiceAnnoToggle');
    const popup = moduleRoot.querySelector('#invoiceAnnoPopup');
    const layer = moduleRoot.querySelector('#invoiceAnnoLayer');
    if (toggle) {
      toggle.remove();
    }
    if (popup) {
      popup.remove();
    }
    if (layer) {
      layer.replaceChildren();
      layer.hidden = true;
      layer.setAttribute('aria-hidden', 'true');
    }
    const stripAnchors = () => moduleRoot.querySelectorAll('[data-anno]').forEach((element) => element.removeAttribute('data-anno'));
    stripAnchors();
    const anchorObserver = new MutationObserver(stripAnchors);
    anchorObserver.observe(moduleRoot, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-anno'] });
  }

  function rewriteLegacyLink(anchor) {
    const raw = anchor.getAttribute('href');
    if (!raw || raw.startsWith('#') || /^(javascript:|mailto:|tel:)/i.test(raw)) return;
    let url;
    try { url = new URL(raw, document.baseURI); } catch (_) { return; }
    if (url.origin !== location.origin && location.protocol !== 'file:') return;
    const file = decodeURIComponent(url.pathname.split('/').pop() || '');
    let routeId = legacyRoutes[file];
    if ((file === '系统框架.html' || file === 'index.html') && url.hash) routeId = decodeURIComponent(url.hash.slice(1));
    if (!routeId) return;
    anchor.href = routeHref(routeId, url.search);
    anchor.dataset.appRoute = routeId;
  }

  function rewriteLegacyLinks(root = outlet) {
    root.querySelectorAll?.('a[href]').forEach(rewriteLegacyLink);
  }

  async function loadModule(route) {
    outlet.innerHTML = '<div class="app-route-loading" role="status"><div><span class="app-spinner"></span><span>正在加载业务模块</span></div></div>';
    if (!route.module) {
      renderPlanning(route);
      return;
    }

    const bundle = INLINE_BUNDLE && INLINE_BUNDLE.id === route.module ? INLINE_BUNDLE : null;
    if (!bundle) throw new Error(`当前页面未内嵌模块：${route.module}`);

    bundle.styleLinks.forEach(loadStyle);
    bundle.styles.forEach((css, index) => {
      const style = document.createElement('style');
      style.dataset.appModuleStyle = `${route.id}:${index}`;
      style.textContent = css;
      document.head.append(style);
    });

    // Page-local dependencies are embedded in this HTML file.

    outlet.innerHTML = bundle.html;
    rewriteLegacyLinks();
    const observer = new MutationObserver((records) => {
      records.forEach((record) => record.addedNodes.forEach((node) => {
        if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.matches?.('a[href]')) rewriteLegacyLink(node);
          rewriteLegacyLinks(node);
        }
      }));
    });
    observer.observe(outlet, { childList: true, subtree: true });

    window.lucide?.createIcons();
    bundle.scripts.forEach(runInlineScript);
    window.lucide?.createIcons();
    disableInvoiceAnnotations(route);
    moduleReady = true;
    restoreModuleState();
  }

  function renderPlanning(route) {
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('calendar-clock', 'w-6 h-6')}</span><h1>${route.label}</h1><p>${route.description}。该模块已纳入统一系统框架，目前保留稳定路由入口，业务内容将在后续里程碑中开发。</p></div></div></section>`;
    window.lucide?.createIcons();
    moduleReady = true;
  }

  function renderLoadError(error) {
    console.error(error);
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('triangle-alert', 'w-6 h-6')}</span><h1>模块加载失败</h1><p>${String(error.message || error)}</p><button type="button" class="app-account-action mt-4 justify-center" id="appRetryModule">重新加载</button></div></div></section>`;
    $('appRetryModule')?.addEventListener('click', () => location.reload());
    window.lucide?.createIcons();
  }

  function navigate(routeId) {
    const target = resolveRoute(routeId);
    captureModuleState();
    closeMobileSidebar();
    closeCompactFlyout();
    if (target.id === currentRoute.id) {
      content.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    location.assign(routeHref(target.id, location.search));
  }

  function scheduleReload() {
    if (reloadScheduled) return;
    reloadScheduled = true;
    captureModuleState();
    location.reload();
  }

  function bindEvents() {
    $('appCollapseButton').addEventListener('click', () => setSidebarCompact(!sidebar.classList.contains('is-compact')));
    $('appMobileMenu').addEventListener('click', openMobileSidebar);
    $('appMobileOverlay').addEventListener('click', closeMobileSidebar);
    $('appNoticeButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appNoticePopover'); });
    $('appAccountButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appAccountPopover'); });
    $('appReadAll').addEventListener('click', () => { notices.forEach((item) => { item.unread = false; }); renderNotices(); $('appNoticeDot').hidden = true; toast('通知已全部标记为已读'); });

    document.addEventListener('click', (event) => {
      const routeLink = event.target.closest('[data-app-route]');
      if (routeLink) {
        event.preventDefault();
        navigate(routeLink.dataset.appRoute);
        return;
      }
      const groupButton = event.target.closest('[data-app-group]');
      if (groupButton) {
        const groupId = groupButton.dataset.appGroup;
        if (sidebar.classList.contains('is-compact') && innerWidth >= 768) {
          renderCompactFlyout(groupId, groupButton);
        } else {
          groupState[groupId] = groupButton.getAttribute('aria-expanded') !== 'true';
          writeJson(GROUP_STATE_KEY, groupState);
          renderNavigation();
        }
        return;
      }
      if (!event.target.closest('.app-popover, #appNoticeButton, #appAccountButton')) closePopovers();
      if (!event.target.closest('#appCompactFlyout, [data-app-group]')) closeCompactFlyout();
      const globalAction = event.target.closest('[data-app-global-action]');
      if (globalAction) toast(`${globalAction.textContent.trim()}将在对应功能模块开放`);
    });

    window.addEventListener('hashchange', scheduleReload);
    window.addEventListener('popstate', scheduleReload);
    window.addEventListener('pagehide', captureModuleState);
    window.addEventListener('beforeunload', captureModuleState);
    window.addEventListener('resize', () => {
      if (innerWidth >= 768) closeMobileSidebar();
      closeCompactFlyout();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      closePopovers();
      closeCompactFlyout();
      closeMobileSidebar();
    });
  }

  async function init() {
    if (!location.hash || !routes.has(decodeURIComponent(location.hash.slice(1)))) {
      history.replaceState(null, '', `${location.pathname}${location.search}#${currentRoute.id}`);
    } else if (routes.get(decodeURIComponent(location.hash.slice(1)))?.group) {
      history.replaceState(null, '', `${location.pathname}${location.search}#${currentRoute.id}`);
    }
    setSidebarCompact(readSidebarCompact());
    document.body.dataset.appRoute = currentRoute.id;
    renderNavigation();
    renderRouteTitle();
    renderNotices();
    bindEvents();
    window.lucide?.createIcons();
    try { await loadModule(currentRoute); } catch (error) { renderLoadError(error); }
  }

  window.YundengAppShell = {
    navigation,
    legacyRoutes,
    navigate,
    captureModuleState,
    routeHref
  };

  init();
})();
</script>
</body>
</html>
