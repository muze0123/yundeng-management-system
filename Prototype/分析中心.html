<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云登后台 · 分析中心</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#0066FF',hover:'#0052CC',bg:'#E6F0FF'},ink:{title:'#1A1D24',body:'#3A3F4A',sub:'#6E7685',muted:'#9DA2AC'},line:{DEFAULT:'#DFE1E5',lighter:'#F0F1F3'},bg:{page:'#F7F8FA',card:'#FFFFFF',hover:'#F3F4F6'},success:{DEFAULT:'#0FC060',bg:'#E7F9F0'},warning:{DEFAULT:'#E7772D',bg:'#FDF2E9'},danger:{DEFAULT:'#D9001B',bg:'#FFE8EB'},info:{DEFAULT:'#0091D5',bg:'#E4F4FB'}},fontFamily:{mono:['JetBrains Mono','monospace']}}}};</script>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#3A3F4A}.mono{font-family:'JetBrains Mono',monospace}.sidebar{width:220px}.nav-item{height:38px;border-radius:4px;display:flex;align-items:center;gap:10px;padding:0 12px}.nav-item:hover{background:#F3F4F6}.nav-item.group{color:#0066FF;font-weight:600}.submenu a{height:34px;padding-left:44px;font-size:12px}.submenu a.active{color:#0066FF;background:#E6F0FF;font-weight:600}.btn{height:32px;padding:0 14px;border-radius:4px;font-weight:500}.btn-primary{background:#0066FF;color:#fff}.btn-default{border:1px solid #DFE1E5;background:#fff}.control{height:32px;border:1px solid #DFE1E5;border-radius:4px;padding:0 8px;width:100%;outline:none}.control:focus{border-color:#0066FF;box-shadow:0 0 0 2px rgba(0,102,255,.12)}.tab{height:32px;padding:0 14px;border-radius:4px}.tab.active{background:#E6F0FF;color:#0066FF;font-weight:600}.builder-label{display:block;color:#6E7685;font-size:12px;margin:16px 0 6px}.step{border:1px solid #DFE1E5;border-radius:6px;padding:10px;background:#fff}.anno-badge{position:fixed;width:20px;height:20px;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px 'JetBrains Mono';text-align:center;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.15)}@media(max-width:1100px){.sidebar{width:68px}.brand-name,.menu-text,.submenu,.chev{display:none}.nav-item,.brand{justify-content:center;padding-left:0}.analysis-grid{display:block!important}.builder{width:100%!important;margin-bottom:16px}}</style></head>
<body class="bg-bg-page text-[13px]"><div class="flex min-h-screen"><aside class="sidebar sticky top-0 h-screen bg-white shrink-0 flex flex-col"><div class="brand h-14 px-5 flex items-center gap-2"><a href="后台index.html" class="flex items-center gap-2"><span class="w-7 h-7 rounded bg-primary text-white flex items-center justify-center font-bold">云</span><span class="brand-name font-semibold text-[16px]">云登后台</span></a></div><nav class="px-3 pt-3"><button class="nav-item group w-full"><i data-lucide="chart-no-axes-combined" class="w-[18px]"></i><span class="menu-text flex-1 text-left">数据埋点</span><i data-lucide="chevron-down" class="chev w-4"></i></button><div class="submenu mt-1 space-y-1"><a class="nav-item" href="数据总览.html">数据总览</a><a class="nav-item" href="事件管理.html">事件管理</a><a class="nav-item" href="事件明细.html">事件明细</a><a class="nav-item active" href="分析中心.html">分析中心</a><a class="nav-item" href="实时调试.html">实时调试</a><a class="nav-item" href="数据质量告警.html">数据质量告警</a></div></nav></aside><div class="flex-1 min-w-0 flex flex-col"><header class="h-14 bg-white shadow-[0_4px_12px_rgba(26,29,36,.10)] flex items-center justify-between px-6"><span class="text-ink-sub">数据埋点 / 分析中心</span><div class="flex gap-2"><button id="stateBtn" class="btn btn-default">模拟状态</button><button class="btn btn-default"><i data-lucide="folder-clock" class="w-4 inline mr-1"></i>已保存分析</button><span class="w-7 h-7 rounded-full bg-primary-bg text-primary flex items-center justify-center">数</span></div></header>
<main id="main" class="p-4 flex-1 overflow-auto relative"><div id="stateMenu" class="hidden absolute right-10 top-2 z-20 bg-white border rounded shadow p-1"></div><section class="bg-white rounded-lg p-5 mb-4"><div class="grid grid-cols-4 gap-4"><div><label class="text-ink-sub">日期范围</label><select class="control mt-1"><option>最近 7 天</option><option>最近 30 天</option></select></div><div><label class="text-ink-sub">团队</label><select class="control mt-1"><option>全部授权团队</option></select></div><div><label class="text-ink-sub">客户端</label><select class="control mt-1"><option>全部客户端</option><option>PC</option></select></div><div><label class="text-ink-sub">版本</label><select class="control mt-1"><option>全部版本</option></select></div></div></section>
<section class="bg-white rounded-lg p-5 min-h-[690px]"><div class="flex justify-between items-center mb-4"><div><h2 data-anno="1" class="inline-block text-[18px] font-semibold text-ink-title">自助分析工作台</h2><p class="text-ink-sub mt-1">配置生成不可变快照，结果不会被后续编辑悄悄改写。</p></div><div class="flex gap-2"><button id="saveAnalysis" class="btn btn-default">保存分析</button><button id="saveBoard" data-anno="2" class="btn btn-default">保存到看板</button></div></div><div id="analysisTabs" class="flex gap-2 mb-4 border-b border-line pb-3"><button class="tab active" data-type="event">事件分析</button><button class="tab" data-type="funnel">漏斗分析</button><button class="tab" data-type="retention">留存分析</button><button class="tab" data-type="path">路径分析</button><button class="tab" data-type="cohort">用户分群</button></div><div id="workArea" class="analysis-grid grid grid-cols-[360px_1fr] gap-4"></div></section></main></div></div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/30 flex items-center justify-center"><div id="modalPanel" class="w-[760px] max-w-[92vw] bg-white rounded-lg"><header class="p-4 border-b flex justify-between"><h2 data-anno="1" class="font-semibold text-[16px]">保存到看板</h2><button onclick="closeModal()">×</button></header><div class="p-8"><div class="flex items-center gap-3 mb-4"><label class="w-24 text-right">目标看板：</label><select class="control !w-[400px]"><option>产品经营总览</option><option>代理业务周报</option></select></div><div class="flex items-center gap-3"><label class="w-24 text-right">卡片名称：</label><input id="cardName" class="control !w-[400px]" value="实名认证转化分析"></div></div><footer class="p-4 border-t flex justify-end gap-3"><button onclick="closeModal()" class="btn btn-default">取消</button><button onclick="confirmSave()" class="btn btn-primary">保存</button></footer></div></div>
<div id="toastBox" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[80] bg-ink-title text-white px-4 py-2 rounded"></div><div id="annoLayer" style="position:fixed;inset:0;pointer-events:none;z-index:9998"></div><button id="annoToggle" class="fixed z-[9997] right-2 top-[120px] h-8 px-3 rounded-full bg-primary text-white">交互标注</button><div id="annoPopup" class="hidden fixed inset-0 z-[9999] bg-black/30 flex items-center justify-center"><div class="w-[520px] bg-white rounded-lg"><div class="p-4 border-b flex justify-between"><h2 id="annoTitle" class="font-semibold"></h2><button onclick="annoPopup.classList.add('hidden')">×</button></div><div id="annoDesc" class="p-5"></div></div></div>
<script>
let type='event',task='idle',progress=0,chart,state='normal',dirty=false,annoVisible=true,annoScopeStack=[];const events=['identity_guide_popup_view','identity_complete','proxy_purchase_success','environment_launch_result','environment_effective_run'];
function builder(){if(type==='event')return commonBuilder(`<label class="builder-label">分析事件</label><select data-anno="3" class="control"><option>identity_complete</option><option>environment_launch_result</option></select><label class="builder-label">指标</label><select class="control"><option>用户数</option><option>事件次数</option><option>人均次数</option></select><label class="builder-label">分组属性</label><select class="control"><option>auth_type</option><option>client</option><option>app_version</option></select>`);if(type==='funnel')return commonBuilder(`<label class="builder-label">漏斗模板</label><select id="template" data-anno="3" class="control"><option>代理首购</option><option>购后价值</option><option>新用户激活</option></select><div id="steps" class="space-y-2 mt-4">${['proxy_market_view','identity_complete','proxy_purchase_success','environment_effective_run'].map((x,i)=>`<div class="step flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-primary-bg text-primary flex items-center justify-center mono">${i+1}</span><span class="mono text-[12px] flex-1 truncate">${x}</span><i data-lucide="grip-vertical" class="w-4 text-ink-muted"></i></div>`).join('')}</div><label class="builder-label">最大步骤间隔</label><select class="control"><option>7 天</option><option>30 分钟</option><option>24 小时</option></select><label class="builder-label">认证类型</label><select class="control"><option>个人与企业对比</option><option>仅个人</option><option>仅企业</option></select>`);if(type==='retention')return commonBuilder(`<label class="builder-label">起始事件</label><select class="control"><option>register_submit_result</option></select><label class="builder-label">回访事件</label><select class="control"><option>environment_effective_run</option></select><label class="builder-label">观察单位</label><select class="control"><option>周</option><option>日</option><option>月</option></select><label class="builder-label">周期数</label><input type="number" class="control" value="8">`);if(type==='path')return commonBuilder(`<label class="builder-label">路径方向</label><select class="control"><option>从起点探索</option><option>从终点回溯</option></select><label class="builder-label">起点事件</label><select class="control"><option>app_open</option></select><label class="builder-label">最大步数</label><select class="control"><option>5 步</option><option>8 步</option></select><label class="builder-label">会话超时</label><select class="control"><option>30 分钟</option></select>`);return commonBuilder(`<label class="builder-label">分群类型</label><select class="control"><option>动态分群</option><option>快照分群</option></select><label class="builder-label">属性条件</label><div class="step"><select class="control mb-2"><option>auth_type</option></select><div class="flex gap-2"><select class="control"><option>等于</option></select><select class="control"><option>enterprise</option><option>personal</option></select></div></div><button class="mt-3 text-primary">+ 添加条件组</button>`)}
function commonBuilder(inner){return `<aside class="builder w-[360px] border border-line-lighter rounded-lg bg-bg-page p-4"><div class="flex justify-between"><strong class="text-ink-title">分析配置</strong><span id="dirtyTag" class="hidden text-warning text-[12px]">配置已变更</span></div>${inner}<button id="run" data-anno="4" class="btn btn-primary w-full mt-5">运行分析</button></aside>`}
function render(){if(chart){chart.destroy();chart=null}if(state==='forbidden'){workArea.innerHTML=message('shield-x','暂无分析权限','缺少 tracking.analysis.read');return}workArea.innerHTML=builder()+`<section id="result" class="border border-line-lighter rounded-lg min-h-[540px] p-5"></section>`;document.querySelectorAll('.builder input,.builder select').forEach(x=>x.onchange=()=>{dirty=true;dirtyTag.classList.remove('hidden');if(task==='success')showStale()});run.onclick=startTask;renderResult();lucide.createIcons();setTimeout(renderAnno,30)}
function renderResult(){const r=document.getElementById('result');if(state==='loading'||task==='processing'){r.innerHTML=`<div class="h-full flex flex-col justify-center items-center"><div class="w-64 h-2 rounded bg-line-lighter overflow-hidden"><div class="h-full bg-primary transition-all" style="width:${progress}%"></div></div><strong class="mt-4">正在计算 · ${progress}%</strong><p class="text-ink-sub mt-2">任务离开页面后仍会继续</p><button class="btn btn-default mt-4" onclick="cancelTask()">取消任务</button></div>`;return}if(state==='empty'){r.innerHTML=message('chart-no-axes-column-increasing','当前条件下暂无可分析数据','调整日期或筛选条件后重试');return}if(state==='error'){r.innerHTML=message('triangle-alert','分析任务失败','查询超时，请缩小范围后重试');return}if(task==='idle'){r.innerHTML=message('scan-search','配置分析条件后运行','结果将绑定本次查询快照');return}r.innerHTML=`<div id="stale" class="hidden mb-3 p-3 rounded bg-warning-bg text-warning flex justify-between"><span>配置已变更，重新运行后更新结果</span><button onclick="startTask()" class="font-medium">重新运行</button></div><div class="flex justify-between mb-4"><div><h3 class="font-semibold text-ink-title">${titleMap[type]}</h3><p class="text-[12px] text-ink-muted mt-1 mono">查询快照 · 2026-08-01 — 2026-08-07 · Asia/Shanghai</p></div><button class="text-primary">查看数据表</button></div><div class="h-[360px]"><canvas id="resultChart"></canvas></div><div class="mt-4 p-3 bg-bg-page rounded text-[12px] text-ink-sub">口径：按用户去重 · 查询耗时 <span class="mono">1.84s</span> · 数据更新于 <span class="mono">17:46:02</span></div>`;drawChart()}
const titleMap={event:'认证完成用户趋势',funnel:'代理首购漏斗',retention:'激活用户周留存',path:'用户核心路径',cohort:'企业认证用户分群'};
function message(icon,t,d){return `<div class="min-h-[480px] flex flex-col justify-center items-center text-center"><i data-lucide="${icon}" class="w-10 text-ink-muted"></i><h3 class="mt-4 text-[16px] font-semibold">${t}</h3><p class="text-ink-sub mt-2">${d}</p></div>`}
function drawChart(){
  const ctx=document.getElementById('resultChart');
  if(type==='funnel'){
    chart=new Chart(ctx,{
      type:'bar',
      data:{labels:['购买页','实名引导','认证完成','支付成功','有效运行'],datasets:[{label:'用户数',data:[4862,3214,2312,2136,1894],backgroundColor:['#0066FF','#247CFF','#4D94FF','#76ADFF','#A3C8FF'],borderRadius:4}]},
      options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#F0F1F3'}},y:{grid:{display:false}}}}
    });
  }else if(type==='retention'){
    chart=new Chart(ctx,{
      type:'line',
      data:{labels:['W0','W1','W2','W3','W4','W5','W6','W7'],datasets:[{label:'留存率',data:[100,62,51,45,41,38,36,null],borderColor:'#0066FF',backgroundColor:'rgba(0,102,255,.08)',fill:true,tension:.3}]},
      options:{maintainAspectRatio:false}
    });
  }else{
    chart=new Chart(ctx,{
      type:type==='event'?'line':'bar',
      data:{labels:['08/01','08/02','08/03','08/04','08/05','08/06','08/07'],datasets:[{label:titleMap[type],data:[280,316,298,362,420,446,486],borderColor:'#0066FF',backgroundColor:'rgba(0,102,255,.18)',tension:.35,fill:type==='event'}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{grid:{display:false}},y:{grid:{color:'#F0F1F3'}}}}
    });
  }
}
function startTask(){task='processing';progress=12;state='loading';renderResult();const timer=setInterval(()=>{progress+=22;if(progress>=100){clearInterval(timer);progress=100;task='success';state='normal';dirty=false;renderResult();lucide.createIcons()}else renderResult()},280)}function cancelTask(){task='idle';state='normal';progress=0;renderResult();toast('分析任务已取消')}window.cancelTask=cancelTask;function showStale(){const s=document.getElementById('stale');if(s)s.classList.remove('hidden')}
analysisTabs.onclick=e=>{if(!e.target.dataset.type)return;type=e.target.dataset.type;task='idle';dirty=false;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===e.target));render()};saveBoard.onclick=()=>{modal.classList.remove('hidden');pushScope(modalPanel)};function closeModal(){modal.classList.add('hidden');popScope(modalPanel)}function confirmSave(){closeModal();toast('卡片已保存到看板')}window.closeModal=closeModal;window.confirmSave=confirmSave;saveAnalysis.onclick=()=>toast(task==='success'?'分析已保存':'请先运行分析');
const states=['normal','loading','empty','error','forbidden'];stateMenu.innerHTML=states.map(s=>`<button data-s="${s}" class="block px-3 py-2 w-full text-left hover:bg-bg-hover mono">${s}</button>`).join('');stateBtn.onclick=()=>stateMenu.classList.toggle('hidden');stateMenu.onclick=e=>{if(e.target.dataset.s){state=e.target.dataset.s;task=state==='normal'?'idle':task;render();stateMenu.classList.add('hidden')}};
function toast(m){toastBox.textContent=m;toastBox.classList.remove('hidden');setTimeout(()=>toastBox.classList.add('hidden'),1800)}
const annotations={1:{title:'自助分析工作台',desc:['五类分析共用事件和属性字典。','结果绑定不可变 查询快照。']},2:{title:'保存到看板',desc:['只保存已运行结果，不保存未运行草稿。','成功后保持当前分析上下文。']},3:{title:'分析定义',desc:['漏斗支持 2–10 步和 personal/enterprise 分群。','废弃事件仅可查询废弃前历史。']},4:{title:'异步运行',desc:['服务端返回 taskId 和真实 progress。','旧任务完成不得覆盖新查询。']}};
function pushScope(el){annoScopeStack.push(el);renderAnno()}function popScope(el){annoScopeStack=annoScopeStack.filter(x=>x!==el);renderAnno()}function renderAnno(){annoLayer.innerHTML='';if(!annoVisible)return;(annoScopeStack.length?annoScopeStack.at(-1):document).querySelectorAll('[data-anno]').forEach(el=>{const r=el.getBoundingClientRect(),b=document.createElement('button');b.className='anno-badge';b.textContent=el.dataset.anno;b.style.top=r.top-10+'px';b.style.left=r.right-10+'px';b.onclick=()=>{const a=annotations[el.dataset.anno]||{title:'保存卡片',desc:['选择目标看板与卡片名称。']};annoTitle.textContent=a.title;annoDesc.innerHTML=a.desc.map(x=>'<p class="mb-2">• '+x+'</p>').join('');annoPopup.classList.remove('hidden')};annoLayer.appendChild(b)})}annoToggle.onclick=()=>{annoVisible=!annoVisible;renderAnno()};main.onscroll=renderAnno;window.onresize=renderAnno;render();lucide.createIcons();
</script><script src="侧栏交互.js"></script><script src="标注交互.js"></script></body></html>
