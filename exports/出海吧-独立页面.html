<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>出海吧 · 出海工具导航</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script>
  /* design.md §七 Tailwind 配置镜像（单一事实来源） */
  tailwind.config = {
    theme: { extend: {
      colors: {
        primary: { DEFAULT: '#0066FF', hover: '#0052CC', active: '#0047B3', bg: '#E6F0FF' },
        ink: { title: '#1A1D24', body: '#3A3F4A', sub: '#6E7685', muted: '#9DA2AC' },
        line: { DEFAULT: '#DFE1E5', light: '#E8EAED', lighter: '#F0F1F3' },
        bg: { page: '#F7F8FA', card: '#FFFFFF', hover: '#F3F4F6' },
        success: { DEFAULT: '#0FC060', bg: '#E7F9F0' },
        warning: { DEFAULT: '#E7772D', bg: '#FDF2E9' },
        danger: { DEFAULT: '#D9001B', bg: '#FFE8EB' },
        info: { DEFAULT: '#0091D5', bg: '#E4F4FB' }
      },
      borderRadius: { DEFAULT: '4px', md: '6px', lg: '8px' },
      fontFamily: {
        sans: ['-apple-system','BlinkMacSystemFont','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue','Helvetica','Arial','sans-serif'],
        mono: ['JetBrains Mono','monospace']
      }
    } }
  };
</script>
<style>
  /* 焦点态单一指示铁律（design.md §5.13）：B 类实心描边，输入类 A 类柔光环 */
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #0066FF; outline-offset: 2px; }
  input:focus { outline: none; border-color: #0066FF; box-shadow: 0 0 0 2px rgba(0,102,255,.12); }

  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  /* ---------- 左侧导航（参考 PartnerShare：粗图标 + 粗体文字，全高侧栏） ---------- */
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; border-radius: 6px;
              color: #1A1D24; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
              transition: background .15s, color .15s; }
  .nav-item svg { width: 18px; height: 18px; stroke-width: 2.4; color: #1A1D24; flex: none; }
  .nav-item:hover { background: #F3F4F6; }
  .nav-item.is-active { background: #E6F0FF; color: #0066FF; }
  .nav-item.is-active svg { color: #0066FF; }
  .nav-count { margin-left: auto; font-size: 11px; color: #9DA2AC; font-weight: 400; }
  .nav-item.is-active .nav-count { color: #0066FF; }
  /* 侧栏类型兜底图标：中性浅灰块 + 深色首字（贴近参考图的单色粗图标观感） */
  .nav-type-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
                   border-radius: 6px; background: #F0F1F3; color: #1A1D24; font-weight: 700; font-size: 11px; flex: none; }

  /* 折叠态：隐藏文字与数量，仅图标 */
  .sidebar-collapsed .nav-label, .sidebar-collapsed .nav-count { display: none; }
  .sidebar-collapsed .nav-item { justify-content: center; padding: 0; width: 40px; margin: 0 auto; }

  /* ---------- 分组标题 ---------- */
  .group-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; color: #1A1D24; }
  .group-sub { font-size: 12px; color: #9DA2AC; font-weight: 400; }

  /* ---------- 精选 chips（design.md §5.1 状态 Tab） ---------- */
  /* 数量数字用等宽字体（与后台模块 .font-mono 同口径：JetBrains Mono + 表格数字，
     保证多位数不抖动）。⚠️ 不能只写 class="mono" 而不定义 —— Tailwind 生成的是 font-mono，
     未定义的 .mono 是死类名，数字会静默回落到正文字体 */
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 12px; font-size: 13px;
          background: #fff; color: #6E7685; border: 1px solid #DFE1E5; border-radius: 4px; cursor: pointer; transition: all .15s; }
  .chip + .chip { margin-left: -1px; }
  .chip:hover { color: #0066FF; border-color: #0066FF; position: relative; z-index: 1; }
  .chip.is-active { border: 1px solid #0066FF; color: #0066FF; background: #E6F0FF; font-weight: 600; position: relative; z-index: 1; }

  /* ---------- 网站卡片 ---------- */
  /* 注意：hover 的 transform 会让卡片自身形成层叠上下文，若只在气泡上设 z-index，
     气泡会被 DOM 顺序更靠后的同行卡片盖住（表现为「气泡被遮住」）。
     因此层级必须抬升到卡片自身（hover → z-index:30），气泡才能越过相邻卡片。 */
  .site-card { position: relative; z-index: 0; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px;
               background: #fff; border: 1px solid #DFE1E5; border-radius: 8px; cursor: pointer;
               transition: box-shadow .15s, transform .15s, border-color .15s; min-width: 0; }
  .site-card:hover, .site-card:focus-within { z-index: 30; }
  .site-card:hover { border-color: #E8EAED; box-shadow: 0 2px 8px rgba(0,0,0,.06); transform: translateY(-1px); }
  .site-name { font-size: 14px; font-weight: 600; color: #1A1D24; line-height: 20px; }
  .site-intro { margin-top: 2px; font-size: 12px; color: #6E7685; line-height: 18px;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* hover 全显简介：卡内浮层展开全部文本，不裁切、不推动布局 */
  .site-intro-full { position: absolute; left: 12px; right: 12px; top: calc(100% - 6px); z-index: 40;
                     background: #fff; border: 1px solid #E8EAED; border-radius: 6px;
                     box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 10px 12px;
                     font-size: 12px; color: #3A3F4A; line-height: 18px;
                     opacity: 0; visibility: hidden; transition: opacity .15s, visibility .15s; pointer-events: none; }
  .site-card:hover .site-intro-full, .site-card:focus-within .site-intro-full { opacity: 1; visibility: visible; }
  /* 卡片贴近内容区底部时，气泡向上展开，避免被内容区滚动容器裁切（由脚本置 is-flip） */
  .site-card.is-flip .site-intro-full { top: auto; bottom: calc(100% - 6px); }
  /* 精选角标（橙色斜角） */
  .feat-ribbon { position: absolute; top: 0; right: 0; width: 34px; height: 34px; overflow: hidden; border-radius: 0 8px 0 0; pointer-events: none; }
  .feat-ribbon::before { content: ''; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 34px 34px 0; border-color: transparent #E7772D transparent transparent; }
  .feat-ribbon span { position: absolute; top: 4px; right: 2px; font-size: 10px; color: #fff; font-weight: 600; transform: rotate(45deg); }

  /* 头像（无图标降级：首字母色块） */
  .avatar-fallback { display: flex; align-items: center; justify-content: center; flex: none;
                     border-radius: 8px; color: #fff; font-weight: 600; }

  /* ---------- 页脚（内容区底部，白色背景） ----------
     左右与底部留 20px 间距（Tailwind mx-5 mb-5），8px 圆角；因不再是通栏贴边，改用四边描边 */
  .site-footer { background: #fff; border: 1px solid #E8EAED; border-radius: 8px; }
  /* 栏目标题用 ink.body（参考 PartnerShare 页脚的浅灰标题层级；#1A1D24 过重） */
  .site-footer-col-title { font-size: 13px; font-weight: 600; color: #3A3F4A; margin: 0 0 12px; }
  .site-footer-slogan { margin: 0; max-width: 34em; font-size: 12px; line-height: 20px; color: #6E7685; }
  .site-footer-link { font-size: 13px; line-height: 22px; color: #6E7685; transition: color .15s; }
  .site-footer-link:hover { color: #0066FF; }
  /* 法务行用 ink.sub 而非 ink.muted：#9DA2AC 在白底对比度仅 2.56:1，不达 WCAG AA；
     #6E7685 为 4.57:1，满足正文 4.5:1 要求 */
  .site-footer-legal { margin: 0; font-size: 12px; line-height: 20px; color: #6E7685; }
  .site-footer-legal a { color: #6E7685; transition: color .15s; }
  .site-footer-legal a:hover { color: #0066FF; }
  /* 公安备案徽标（内嵌 base64，维持单文件自包含；62×67 源图按 20px 高等比缩放） */
  .gongan-badge { display: inline-block; height: 20px; width: auto; vertical-align: -5px; margin-right: 5px; }

  /* 联系方式图标 + 悬停/聚焦浮层（邮箱地址、二维码）
     按钮为深色圆角方形（参考 PartnerShare 页脚），hover 切主色 */
  .contact-item { position: relative; }
  .contact-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
                 border: 0; border-radius: 8px; background: #1A1D24; color: #fff; cursor: pointer;
                 transition: background .15s, color .15s; }
  .contact-btn:hover { background: #0066FF; color: #fff; }
  .contact-btn svg { width: 18px; height: 18px; }
  .contact-pop { position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 30; margin: 0;
                 background: #fff; border: 1px solid #E8EAED; border-radius: 8px;
                 box-shadow: 0 6px 24px rgba(0,0,0,.12);
                 opacity: 0; visibility: hidden; transform: translateY(4px);
                 transition: opacity .15s, transform .15s, visibility .15s; pointer-events: none; }
  .contact-item:hover .contact-pop,
  .contact-item:focus-within .contact-pop { opacity: 1; visibility: visible; transform: translateY(0); }
  .contact-pop-email { padding: 10px 12px; font-size: 13px; color: #1A1D24; white-space: nowrap; }
  .contact-pop-qr { padding: 10px; text-align: center; }
  .contact-pop-cap { margin: 8px 0 0; font-size: 12px; line-height: 16px; color: #6E7685; }
  /* 二维码占位槽：替换时改为 <img class="qr-slot" src="真实图片路径" alt="..."> 即可（见页脚 TODO 注释） */
  .qr-slot { display: flex; align-items: center; justify-content: center; width: 132px; height: 132px;
             background: #F7F8FA; border: 1px dashed #DFE1E5; border-radius: 6px; color: #9DA2AC; }
  .qr-slot svg { width: 40px; height: 40px; }

  /* ---------- 回到顶部（页面右下角悬浮） ---------- */
  .totop-wrap { position: fixed; right: 24px; bottom: 24px; z-index: 40; }
  .totop-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
               border: 1px solid #E8EAED; border-radius: 50%; background: #fff; color: #3A3F4A; cursor: pointer;
               box-shadow: 0 4px 16px rgba(0,0,0,.10);
               transition: color .15s, border-color .15s, box-shadow .15s; }
  .totop-btn:hover { color: #0066FF; border-color: #0066FF; box-shadow: 0 6px 20px rgba(0,102,255,.18); }
  .totop-btn svg { width: 18px; height: 18px; }
  /* 提示语置于按钮左侧（贴右缘，向上/向下都可能出界，向左最稳） */
  .totop-tip { position: absolute; right: calc(100% + 8px); top: 50%; z-index: 40; margin: 0;
               padding: 6px 10px; border: 1px solid #E8EAED; border-radius: 6px; background: #fff;
               box-shadow: 0 6px 24px rgba(0,0,0,.12); font-size: 12px; line-height: 16px; color: #1A1D24;
               white-space: nowrap; opacity: 0; visibility: hidden;
               transform: translateY(calc(-50% + 4px));
               transition: opacity .15s, transform .15s, visibility .15s; pointer-events: none; }
  .totop-wrap:hover .totop-tip,
  .totop-wrap:focus-within .totop-tip { opacity: 1; visibility: visible; transform: translateY(-50%); }

  /* 降级动效：尊重系统「减少动态效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body class="bg-bg-page font-sans text-ink-body">
<div class="flex h-screen overflow-hidden" id="layoutBody">

  <!-- ======================= 左侧类型导航（全高，参考图样式） ======================= -->
  <aside id="sidebar" class="w-[220px] flex-none bg-white border-r border-line-light overflow-y-auto py-3 transition-[width] duration-200"
         aria-label="网站类型导航">
    <nav id="typeNav" class="px-3 flex flex-col gap-1"></nav>
  </aside>

  <!-- ======================= 右列：顶部导航栏 + 内容区 ======================= -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- 顶部导航栏：汉堡按钮 + 平台 logo + 平台名称（仅覆盖内容区，不横跨侧栏） -->
    <header class="flex items-center gap-3 h-14 px-5 bg-white border-b border-line-light z-20 flex-none">
      <button id="collapseBtn" type="button" aria-label="收起/展开导航" aria-expanded="true"
              class="flex items-center justify-center w-8 h-8 rounded text-ink-title hover:bg-bg-hover transition-colors">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="flex items-center gap-2.5" aria-label="出海吧">
        <span class="flex items-center justify-center w-7 h-7 rounded-lg text-white flex-none"
              style="background:linear-gradient(135deg,#2D6BFF 0%,#7C5CFF 100%)">
          <i data-lucide="rocket" class="w-4 h-4"></i>
        </span>
        <span class="text-[17px] font-bold text-ink-title tracking-wide">出海吧</span>
      </div>
    </header>

    <!-- ======================= 内容区 ======================= -->
    <main id="content" class="flex-1 overflow-y-auto flex flex-col" tabindex="-1">
      <div class="flex-1 px-6 py-5">
        <div id="groups"></div>
        <div id="emptyAll" class="hidden text-center text-ink-muted py-24" >
          <i data-lucide="package-open" class="w-10 h-10 mx-auto mb-3"></i>
          <p>暂无网站数据，请在云登后台「出海吧」中添加</p>
        </div>
      </div>

      <!-- ======================= 页脚（白色背景，贴内容区底部） ======================= -->
      <footer class="site-footer flex-none mx-5 mb-5 px-6 py-8">
        <div class="grid grid-cols-1 gap-8 md:grid-cols-[2fr_1fr_auto] md:gap-12">
          <!-- 左侧：logo + 平台名称 + 一句话定位 -->
          <div>
            <div class="flex items-center gap-2.5 mb-2.5">
              <span class="flex items-center justify-center w-7 h-7 rounded-lg text-white flex-none"
                    style="background:linear-gradient(135deg,#2D6BFF 0%,#7C5CFF 100%)">
                <i data-lucide="rocket" class="w-4 h-4"></i>
              </span>
              <span class="text-[15px] font-bold text-ink-title">出海吧</span>
            </div>
            <p class="site-footer-slogan">帮出海 SaaS 找到推广者、跑起联盟、放大用户推荐。先免费接入，跑出数据再升级。</p>
          </div>

          <!-- 中间：产品 -->
          <div>
            <h3 class="site-footer-col-title">产品</h3>
            <a class="site-footer-link" href="https://www.yunlogin.com/" target="_blank" rel="noopener noreferrer">云登指纹浏览器</a>
          </div>

          <!-- 右侧：联系方式（图标悬停/聚焦展开邮箱地址与二维码） -->
          <div>
            <h3 class="site-footer-col-title">联系方式</h3>
            <div class="flex items-center gap-2.5">
              <div class="contact-item">
                <a class="contact-btn" href="mailto:service@yunlogin.com" aria-label="邮箱 service@yunlogin.com" aria-describedby="pop-mail">
                  <i data-lucide="mail"></i>
                </a>
                <span class="contact-pop contact-pop-email" id="pop-mail" role="tooltip">service@yunlogin.com</span>
              </div>
              <div class="contact-item">
                <button class="contact-btn" type="button" aria-label="微信二维码" aria-describedby="pop-wechat">
                  <i data-lucide="message-circle"></i>
                </button>
                <div class="contact-pop contact-pop-qr" id="pop-wechat" role="tooltip">
                  <!-- TODO: 替换为真实微信二维码：<img class="qr-slot" src="真实图片路径" alt="微信二维码"> -->
                  <div class="qr-slot"><i data-lucide="qr-code"></i></div>
                  <p class="contact-pop-cap">微信二维码</p>
                </div>
              </div>
              <div class="contact-item">
                <button class="contact-btn" type="button" aria-label="24 小时在线咨询二维码" aria-describedby="pop-service">
                  <i data-lucide="headphones"></i>
                </button>
                <div class="contact-pop contact-pop-qr" id="pop-service" role="tooltip">
                  <!-- TODO: 替换为真实客服二维码：<img class="qr-slot" src="真实图片路径" alt="24 小时在线咨询二维码"> -->
                  <div class="qr-slot"><i data-lucide="qr-code"></i></div>
                  <p class="contact-pop-cap">24 小时在线咨询</p>
                </div>
              </div>
            </div>
          </div>
        </div>

/* ---------- 数据读取与监听 ---------- */
let data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.types) && Array.isArray(parsed.sites)) return parsed;
    }
  } catch (_) { /* file:// 受限或数据损坏时回退种子 */ }
  return JSON.parse(JSON.stringify(SEED));
}

window.addEventListener('storage', (event) => {
  if (event.key === STORE_KEY) { data = loadData(); featuredFilter = 'all'; render(); }
});

/* ---------- 工具函数 ---------- */
const $ = (sel) => document.querySelector(sel);
function hostOf(url) { try { return new URL(url).hostname; } catch (_) { return ''; } }
function faviconUrl(url) {
  const host = hostOf(url);
  return host ? `https://favicon.im/${host}?larger=true` : '';
}
/* 基于名称生成稳定的降级头像配色（取 design.md 语义色系） */
const AVATAR_COLORS = ['#0066FF', '#0FC060', '#E7772D', '#0091D5', '#7C5CFF', '#D9001B'];
function avatarColor(name) {
  let hash = 0;
  for (const ch of String(name)) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

/* 图标统一渲染：icon(dataURL) 优先，其次 favicon 自动匹配，最后首字母头像。
   favicon 加载失败通过全局 handleFavError 降级，避免内联 onerror 的引号转义问题 */
function iconHtml(item, size, extraClass = '') {
  const s = `width:${size}px;height:${size}px;border-radius:8px;flex:none;object-fit:contain;background:#F7F8FA;`;
  if (item.icon) return `<img src="${escapeHtml(item.icon)}" alt="" style="${s}" onerror="this.style.display='none'"/>`;
  const fav = faviconUrl(item.url || '');
  if (fav) {
    return `<img src="${fav}" alt="" style="${s}"
              onerror="handleFavError(this)" data-name="${escapeHtml(item.name)}" data-size="${size}" data-cls="${escapeHtml(extraClass)}"/>`;
  }
  return avatarFallbackHtml(item.name, size, extraClass);
}
function avatarFallbackHtml(name, size, extraClass = '') {
  return `<span class="avatar-fallback ${extraClass}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px;background:${avatarColor(name)}">${escapeHtml(String(name).trim().charAt(0) || '网')}</span>`;
}
/* 全局：favicon 加载失败 → 替换为首字母色块头像 */
function handleFavError(img) {
  img.outerHTML = avatarFallbackHtml(img.dataset.name || '', Number(img.dataset.size) || 20, img.dataset.cls || '');
}

/* ---------- 左侧导航 ---------- */
/* 类型兜底图标：中性浅灰块 + 深色首字（有上传图时用上传图） */
function sidebarTypeIcon(t) {
  if (t.icon) return '<img src="' + escapeHtml(t.icon) + '" alt="" style="width:20px;height:20px;border-radius:6px;object-fit:contain;flex:none;background:#F7F8FA" onerror="this.style.display=\'none\'"/>';
  return '<span class="nav-type-icon">' + escapeHtml(String(t.name).trim().charAt(0) || '类') + '</span>';
}
function renderNav() {
  const featuredCount = data.sites.filter((s) => s.featured).length;
  const items = [{ id: '__featured', name: '精选推荐', icon: '', featured: true, count: featuredCount }]
    .concat(data.types.map((t) => ({ id: t.id, name: t.name, icon: t.icon, count: countOf(t.id) })));
  $('#typeNav').innerHTML = items.map((it) => `
    <a class="nav-item" href="#group-${it.id}" data-nav="${it.id}" title="${escapeHtml(it.name)}">
      ${it.featured
        ? `<i data-lucide="thumbs-up" class="flex-none"></i>`
        : sidebarTypeIcon(it)}
      <span class="nav-label truncate">${escapeHtml(it.name)}</span>
      <span class="nav-count">${it.count}</span>
    </a>`).join('');
  lucide.createIcons();
}

function countOf(typeId) { return data.sites.filter((s) => s.typeId === typeId).length; }
function typeNameOf(typeId) { const t = data.types.find((t) => t.id === typeId); return t ? t.name : '未分类'; }

/* ---------- 内容分组 ---------- */
let featuredFilter = 'all';

function cardHtml(site) {
  return `
  <a class="site-card" href="${escapeHtml(site.url)}" target="_blank" rel="noopener noreferrer" tabindex="0" aria-label="${escapeHtml(site.name)}">
    ${site.featured ? '<span class="feat-ribbon"><span>荐</span></span>' : ''}
    ${iconHtml(site, 40)}
    <div class="flex-1 min-w-0">
      <div class="site-name truncate">${escapeHtml(site.name)}</div>
      <div class="site-intro">${escapeHtml(site.intro)}</div>
    </div>
    <div class="site-intro-full">${escapeHtml(site.intro)}<div class="mt-1 text-[11px]" style="color:#9DA2AC">${escapeHtml(site.url)}</div></div>
  </a>`;
}

function renderGroups() {
  const groups = [];
  /* 精选推荐：跨类型聚合 + 类型 chips 过滤 */
  const featured = data.sites.filter((s) => s.featured);
  if (featured.length) {
    const chips = [{ id: 'all', name: '全部', count: featured.length }]
      .concat(data.types
        .map((t) => ({ id: t.id, name: t.name, count: featured.filter((s) => s.typeId === t.id).length }))
        .filter((t) => t.count > 0));
    const shown = featuredFilter === 'all' ? featured : featured.filter((s) => s.typeId === featuredFilter);
    groups.push(`
      <section id="group-__featured" class="mb-8 scroll-mt-4" aria-label="精选推荐">
        <div class="group-title mb-1"><i data-lucide="sparkles" class="w-[18px] h-[18px]" style="color:#E7772D"></i>精选推荐<span class="group-sub">${featured.length} 个网站</span></div>
        <div class="flex flex-wrap gap-2 mb-4">
          ${chips.map((c) => `<button type="button" class="chip ${featuredFilter === c.id ? 'is-active' : ''}" data-chip="${c.id}">${escapeHtml(c.name)} <span class="mono text-[11px]">${c.count}</span></button>`).join('')}
        </div>
        <div class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${shown.map(cardHtml).join('')}</div>
      </section>`);
  }
  /* 各类型分组（按 types 顺序） */
  data.types.forEach((t) => {
    const sites = data.sites.filter((s) => s.typeId === t.id);
    if (!sites.length) return;
    groups.push(`
      <section id="group-${t.id}" class="mb-8 scroll-mt-4" aria-label="${escapeHtml(t.name)}">
        <div class="group-title mb-3">${sidebarTypeIcon(t)}${escapeHtml(t.name)}<span class="group-sub">${sites.length} 个网站</span></div>
        <div class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${sites.map(cardHtml).join('')}</div>
      </section>`);
  });
  $('#groups').innerHTML = groups.join('');
  $('#emptyAll').classList.toggle('hidden', groups.length > 0);
  lucide.createIcons();
}

function render() { renderNav(); renderGroups(); highlightNav(); }

/* ---------- chips 交互 ---------- */
$('#groups').addEventListener('click', (event) => {
  const chip = event.target.closest('[data-chip]');
  if (!chip) return;
  featuredFilter = chip.dataset.chip;
  renderGroups();
});

/* ---------- 气泡朝向自适应 ----------
 * 卡片贴近内容区底部时向下空间不足，气泡会被 overflow 容器裁切，
 * 此时为卡片加 is-flip 让其改为向上展开（CSS 见 .site-card.is-flip）。 */
function orientBubble(card) {
  const bubble = card.querySelector('.site-intro-full');
  if (!bubble) return;
  const contentRect = $('#content').getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  const spaceBelow = contentRect.bottom - cardRect.bottom;
  const spaceAbove = cardRect.top - contentRect.top;
  const need = bubble.offsetHeight + 16;
  card.classList.toggle('is-flip', spaceBelow < need && spaceAbove > need);
}
$('#groups').addEventListener('mouseover', (event) => {
  const card = event.target.closest('.site-card');
  if (!card || card.contains(event.relatedTarget)) return;  /* 卡内移动不重算 */
  orientBubble(card);
});
$('#groups').addEventListener('focusin', (event) => {
  const card = event.target.closest('.site-card');
  if (card) orientBubble(card);
});

/* ---------- 侧栏收起/展开 ---------- */
$('#collapseBtn').addEventListener('click', () => {
  const collapsed = $('#layoutBody').classList.toggle('sidebar-collapsed');
  $('#sidebar').style.width = collapsed ? '68px' : '220px';
  $('#collapseBtn').setAttribute('aria-expanded', String(!collapsed));
});

/* ---------- 滚动定位与高亮联动（scroll spy） ---------- */
function highlightNav() {
  const content = $('#content');
  const sections = [...content.querySelectorAll('section[id^="group-"]')];
  if (!sections.length) return;
  const top = content.scrollTop + 24;
  let currentId = sections[0].id.replace('group-', '');
  for (const sec of sections) {
    if (sec.offsetTop <= top) currentId = sec.id.replace('group-', '');
  }
  document.querySelectorAll('[data-nav]').forEach((a) => {
    a.classList.toggle('is-active', a.dataset.nav === currentId);
  });
}
$('#content').addEventListener('scroll', highlightNav, { passive: true });
$('#typeNav').addEventListener('click', (event) => {
  const link = event.target.closest('[data-nav]');
  if (!link) return;
  /* 锚点定位交给 href，同时立即同步高亮，避免滚动 spy 延迟 */
  const id = link.dataset.nav;
  requestAnimationFrame(() => {
    document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('is-active', a.dataset.nav === id));
  });
});

/* ---------- 回到顶部（线性滚动） ----------
 * 用户要求「线性滑到页面顶部」：位移与时间成正比（原生 behavior:'smooth' 是缓动曲线，不符）。
 * 时长随距离缩放并限幅；系统开启「减少动态效果」时直接跳顶。 */
const REDUCED_MOTION = window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function scrollToTop() {
  const el = $('#content');
  const start = el.scrollTop;
  if (start <= 0) return;
  if (REDUCED_MOTION) { el.scrollTop = 0; return; }
  const duration = Math.min(900, Math.max(280, start * 0.5));
  const t0 = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - t0) / duration);
    el.scrollTop = start * (1 - p);   /* 线性插值 */
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
$('#totopBtn').addEventListener('click', scrollToTop);

/* ---------- 启动 ---------- */
render();
</script>
