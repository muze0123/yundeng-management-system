<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云登后台 · 看板管理</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="筛选布局.css"><script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#0066FF',hover:'#0052CC',bg:'#E6F0FF'},ink:{title:'#1A1D24',body:'#3A3F4A',sub:'#6E7685',muted:'#9DA2AC'},line:{DEFAULT:'#DFE1E5',lighter:'#F0F1F3'},bg:{page:'#F7F8FA',card:'#FFFFFF',hover:'#F3F4F6'},success:{DEFAULT:'#0FC060',bg:'#E7F9F0'},warning:{DEFAULT:'#E7772D',bg:'#FDF2E9'},danger:{DEFAULT:'#D9001B',bg:'#FFE8EB'},info:{DEFAULT:'#0091D5',bg:'#E4F4FB'}},fontFamily:{mono:['JetBrains Mono','monospace']}}}};</script><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#3A3F4A}.mono{font-family:'JetBrains Mono',monospace}.sidebar{width:220px}.nav-item{height:38px;border-radius:4px;display:flex;align-items:center;gap:10px;padding:0 12px}.nav-item:hover{background:#F3F4F6}.nav-item.group{color:#0066FF;font-weight:600}.submenu a{height:34px;padding-left:44px;font-size:12px}.submenu a.active{color:#0066FF;background:#E6F0FF;font-weight:600}.btn{height:32px;padding:0 14px;border-radius:4px;font-weight:500}.btn-primary{background:#0066FF;color:white}.btn-default{border:1px solid #DFE1E5;background:#fff}.control{height:32px;border:1px solid #DFE1E5;border-radius:4px;padding:0 8px;outline:none}.board-card{border:1px solid #E8EAED;border-radius:8px;padding:18px;transition:.16s}.board-card:hover{box-shadow:0 8px 20px rgba(26,29,36,.08);transform:translateY(-2px)}.grid-canvas{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:40px;gap:12px}.widget{border:1px solid #E8EAED;border-radius:8px;background:white;padding:14px;overflow:hidden}.widget.dragging{outline:2px solid #0066FF}.anno-badge{position:fixed;width:20px;height:20px;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px 'JetBrains Mono';text-align:center;pointer-events:auto}@media(max-width:1100px){.sidebar{width:68px}.brand-name,.menu-text,.submenu,.chev{display:none}.nav-item,.brand{justify-content:center}.board-grid{grid-template-columns:repeat(2,1fr)!important}}</style></head>
<body class="bg-bg-page text-[13px]"><div class="flex min-h-screen"><aside class="sidebar sticky top-0 h-screen bg-white shrink-0"><div class="brand h-14 px-5 flex items-center gap-2"><a href="后台index.html" class="flex items-center gap-2"><span class="w-7 h-7 rounded bg-primary text-white flex items-center justify-center font-bold">云</span><span class="brand-name font-semibold text-[16px]">云登后台</span></a></div><nav class="px-3 pt-3"><button class="nav-item group w-full"><i data-lucide="chart-no-axes-combined" class="w-[18px]"></i><span class="menu-text flex-1 text-left">数据埋点</span><i data-lucide="chevron-down" class="chev w-4"></i></button><div class="submenu mt-1 space-y-1"><a class="nav-item" href="数据总览.html">数据总览</a><a class="nav-item" href="事件管理.html">事件管理</a><a class="nav-item" href="事件明细.html">事件明细</a><a class="nav-item" href="分析中心.html">分析中心</a><a class="nav-item" href="实时调试.html">实时调试</a><a class="nav-item" href="数据质量告警.html">数据质量告警</a></div></nav></aside><div class="flex-1 min-w-0 flex flex-col"><header class="h-14 bg-white shadow-[0_4px_12px_rgba(26,29,36,.10)] flex items-center justify-between px-6"><span class="text-ink-sub">数据埋点 / 看板管理</span><div class="flex items-center gap-2"><button id="stateBtn" class="btn btn-default">模拟状态</button><span class="w-7 h-7 rounded-full bg-primary-bg text-primary flex items-center justify-center">数</span></div></header><main id="main" class="p-4 flex-1 overflow-auto relative"><div id="stateMenu" class="hidden absolute right-10 top-2 z-20 bg-white border rounded shadow p-1"></div><section id="filterCard" class="bg-white rounded-lg p-5 mb-4"><div class="filter-flow"><div class="filter-item"><label class="filter-label">搜索看板</label><input id="search" class="control" placeholder="看板名称"></div><div class="filter-item"><label class="filter-label">类型</label><select class="control"><option>全部类型</option><option>系统看板</option><option>团队看板</option></select></div><div class="filter-item"><label class="filter-label">可见范围</label><select class="control"><option>全部范围</option><option>团队</option><option>私有</option></select></div><div class="filter-actions"><button id="query" class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div></div></section><section id="contentCard" class="bg-white rounded-lg p-5 min-h-[680px]"></section></main></div></div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/30 flex items-center justify-center"><div id="modalPanel" class="w-[760px] bg-white rounded-lg"><header class="p-4 border-b flex justify-between"><h2 data-anno="1" class="font-semibold">新建看板</h2><button onclick="closeModal()">×</button></header><div class="p-8"><div class="flex gap-3 items-center mb-4"><label class="w-24 text-right">看板名称：</label><input id="newName" class="control w-[400px]" maxlength="60"></div><div class="flex gap-3 items-center"><label class="w-24 text-right">可见范围：</label><select class="control w-[400px]"><option>团队可见</option><option>仅自己</option><option>指定角色</option></select></div></div><footer class="p-4 border-t flex justify-end gap-3"><button onclick="closeModal()" class="btn btn-default">取消</button><button onclick="createBoard()" class="btn btn-primary">创建并编辑</button></footer></div></div>
<div id="toastBox" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[80] bg-ink-title text-white px-4 py-2 rounded"></div><div id="annoLayer" style="position:fixed;inset:0;pointer-events:none;z-index:9998"></div><button id="annoToggle" class="fixed z-[9997] right-2 top-[120px] h-8 px-3 rounded-full bg-primary text-white">交互标注</button>
<script>
const boards=[['产品经营总览','system','全部团队',9,'系统','08-07 17:42',true],['新用户激活周报','team','产品团队',6,'王敏','08-07 16:18',true],['代理业务看板','team','增长运营',8,'周方','08-07 15:40',false],['环境稳定性监控','system','全部团队',7,'系统','08-07 14:08',true],['实名认证专项','private','仅自己',5,'陈宁','08-06 19:24',false],['RPA 采用分析','team','产品团队',4,'徐凯','08-06 15:12',false],['客户端版本质量','team','研发团队',10,'李楠','08-05 21:06',true],['空白草稿看板','private','仅自己',0,'王敏','08-05 09:30',false]];
let mode='list',active=0,state='normal',dirty=false,charts=[],annoVisible=true,annoScopeStack=[];function render(){charts.forEach(c=>c.destroy());charts=[];if(state==='loading'){contentCard.innerHTML='<div class="grid grid-cols-3 gap-4">'+Array(6).fill('<div class="h-40 bg-line-lighter animate-pulse rounded"></div>').join('')+'</div>';return}if(state==='empty'){contentCard.innerHTML=empty('暂无看板','新建看板后可添加分析卡片');return}if(state==='error'){contentCard.innerHTML=empty('看板加载失败','网络异常，请保留筛选后重试');return}mode==='list'?renderList():renderBoard();lucide.createIcons();setTimeout(renderAnno,30)}
function empty(t,d){return `<div class="h-[540px] flex flex-col items-center justify-center"><i data-lucide="layout-dashboard" class="w-10 text-ink-muted"></i><h3 class="mt-4 text-[16px] font-semibold">${t}</h3><p class="mt-2 text-ink-sub">${d}</p><button onclick="openModal()" class="btn btn-primary mt-4">新建看板</button></div>`}
function renderList(){filterCard.classList.remove('hidden');contentCard.innerHTML=`<div class="flex justify-between mb-4"><div><h2 data-anno="1" class="inline-block text-[18px] font-semibold text-ink-title">看板列表</h2><p class="text-ink-sub mt-1">把已运行分析沉淀为可复用的团队资产。</p></div><button data-anno="2" onclick="openModal()" class="btn btn-primary">+ 新建看板</button></div><div class="board-grid grid grid-cols-3 gap-4">${boards.map((b,i)=>`<button class="board-card text-left" data-i="${i}"><div class="flex justify-between"><span class="w-9 h-9 rounded ${b[1]==='system'?'bg-primary-bg text-primary':'bg-info-bg text-info'} flex items-center justify-center"><i data-lucide="layout-dashboard" class="w-4"></i></span><i data-lucide="${b[6]?'star':'star-off'}" class="w-4 ${b[6]?'text-warning':'text-ink-muted'}"></i></div><h3 class="mt-4 font-semibold text-[16px] text-ink-title">${b[0]}</h3><p class="text-ink-sub mt-1">${b[2]} · ${b[4]}</p><div class="mt-4 pt-3 border-t border-line-lighter flex justify-between text-[12px] text-ink-muted"><span class="mono">${b[3]} 张卡片</span><span class="mono">${b[5]}</span></div></button>`).join('')}</div>`;document.querySelectorAll('.board-card').forEach(x=>x.onclick=()=>{active=+x.dataset.i;mode='view';render()})}
function renderBoard(){filterCard.classList.add('hidden');const b=boards[active];contentCard.innerHTML=`<div class="flex justify-between items-start mb-4"><div class="flex items-start gap-3"><button id="back" class="w-8 h-8 border rounded flex items-center justify-center"><i data-lucide="arrow-left" class="w-4"></i></button><div><h2 data-anno="1" class="inline-block text-[18px] font-semibold text-ink-title">${b[0]}</h2><p class="text-ink-sub mt-1">${b[2]} · 数据更新于 <span class="mono">17:48:20</span></p></div></div><div class="flex gap-2"><button id="edit" data-anno="2" class="btn btn-default">${mode==='edit'?'取消编辑':'编辑布局'}</button><button id="save" class="btn btn-primary ${mode==='edit'?'':'hidden'}">保存布局</button></div></div>${b[3]===0?empty('添加分析卡片，开始搭建看板','卡片只接受已运行的分析快照'):`<div id="canvas" class="grid-canvas">${widgets().join('')}</div>`}`;back.onclick=()=>{if(dirty&&!confirm('当前布局尚未保存，确定离开？'))return;mode='list';dirty=false;render()};edit.onclick=()=>{mode=mode==='edit'?'view':'edit';dirty=false;render()};if(mode==='edit')save.onclick=()=>{dirty=false;mode='view';toast('看板已保存');render()};drawWidgets();bindWidgets()}
function widgets(){return [`<article data-anno="3" draggable="${mode==='edit'}" class="widget col-span-3 row-span-2" tabindex="0"><span class="text-ink-sub">周成功运行环境</span><strong class="block text-[26px] mono mt-3 text-ink-title">18,320</strong><span class="text-success mono">+12.1%</span></article>`,`<article draggable="${mode==='edit'}" class="widget col-span-3 row-span-2"><span class="text-ink-sub">代理购买成功</span><strong class="block text-[26px] mono mt-3 text-ink-title">2,136</strong><span class="text-success mono">+3.8%</span></article>`,`<article draggable="${mode==='edit'}" class="widget col-span-6 row-span-5"><h3 class="font-semibold text-ink-title">核心用户趋势</h3><div class="h-[150px] mt-2"><canvas id="wChart1"></canvas></div></article>`,`<article draggable="${mode==='edit'}" class="widget col-span-6 row-span-5"><h3 class="font-semibold text-ink-title">实名认证转化</h3><div class="h-[150px] mt-2"><canvas id="wChart2"></canvas></div></article>`]}
function drawWidgets(){if(!document.getElementById('wChart1'))return;charts.push(new Chart(wChart1,{type:'line',data:{labels:['一','二','三','四','五','六','日'],datasets:[{data:[11,12,12,14,15,17,18],borderColor:'#0066FF',tension:.3}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{display:false}}}}));charts.push(new Chart(wChart2,{type:'bar',data:{labels:['曝光','点击','提交','通过','恢复'],datasets:[{data:[4862,3214,2476,2312,2186],backgroundColor:'#0066FF'}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{display:false}}}}))}
function bindWidgets(){if(mode!=='edit')return;document.querySelectorAll('.widget').forEach(w=>{w.ondragstart=()=>w.classList.add('dragging');w.ondragend=()=>{w.classList.remove('dragging');dirty=true;toast('布局已调整，记得保存')};w.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();dirty=true;toast(e.shiftKey?'卡片尺寸已调整':'卡片位置已调整')}}})}
function openModal(){modal.classList.remove('hidden');annoScopeStack.push(modalPanel);renderAnno()}function closeModal(){modal.classList.add('hidden');annoScopeStack=[];renderAnno()}function createBoard(){if(!newName.value.trim()){toast('请填写看板名称');return}boards.push([newName.value,'private','仅自己',0,'数据管理员','刚刚',false]);active=boards.length-1;closeModal();mode='edit';render()}window.openModal=openModal;window.closeModal=closeModal;window.createBoard=createBoard;
query.onclick=()=>renderList();const states=['normal','loading','empty','error'];stateMenu.innerHTML=states.map(s=>`<button data-s="${s}" class="block px-3 py-2 w-full text-left hover:bg-bg-hover mono">${s}</button>`).join('');stateBtn.onclick=()=>stateMenu.classList.toggle('hidden');stateMenu.onclick=e=>{if(e.target.dataset.s){state=e.target.dataset.s;mode='list';render();stateMenu.classList.add('hidden')}};
function toast(m){toastBox.textContent=m;toastBox.classList.remove('hidden');setTimeout(()=>toastBox.classList.add('hidden'),1800)}const annotations={1:{title:'看板上下文',desc:['列表与查看模式保留筛选和返回位置。','系统看板只读，团队看板按权限编辑。']},2:{title:'布局草稿',desc:['拖拽和缩放只修改 layoutDraft。','离开未保存布局必须确认。']},3:{title:'分析快照卡片',desc:['卡片绑定已运行 analysis snapshot。','方向键移动，Shift+方向键调整尺寸。']}};
function renderAnno(){annoLayer.innerHTML='';if(!annoVisible)return;(annoScopeStack.at(-1)||document).querySelectorAll('[data-anno]').forEach(el=>{const r=el.getBoundingClientRect(),b=document.createElement('button');b.className='anno-badge';b.textContent=el.dataset.anno;b.style.top=r.top-10+'px';b.style.left=r.right-10+'px';annoLayer.appendChild(b)})}annoToggle.onclick=()=>{annoVisible=!annoVisible;renderAnno()};main.onscroll=renderAnno;window.onresize=renderAnno;render();lucide.createIcons();
</script><script src="侧栏交互.js"></script><script src="标注交互.js"></script></body></html>
