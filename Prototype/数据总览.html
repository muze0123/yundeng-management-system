<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云登后台 · 数据总览</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#0066FF',hover:'#0052CC',active:'#0047B3',bg:'#E6F0FF'},ink:{title:'#1A1D24',body:'#3A3F4A',sub:'#6E7685',muted:'#9DA2AC'},line:{DEFAULT:'#DFE1E5',light:'#E8EAED',lighter:'#F0F1F3'},bg:{page:'#F7F8FA',card:'#FFFFFF',hover:'#F3F4F6'},success:{DEFAULT:'#0FC060',bg:'#E7F9F0'},warning:{DEFAULT:'#E7772D',bg:'#FDF2E9'},danger:{DEFAULT:'#D9001B',bg:'#FFE8EB'},info:{DEFAULT:'#0091D5',bg:'#E4F4FB'}},borderRadius:{DEFAULT:'4px',md:'6px',lg:'8px'},fontFamily:{sans:['-apple-system','BlinkMacSystemFont','PingFang SC','Microsoft YaHei','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}};</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#3A3F4A}.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}.sidebar{width:220px;transition:.22s}.sidebar.compact{width:68px}.sidebar.compact .brand-name,.sidebar.compact .menu-text,.sidebar.compact .chev{display:none}.sidebar.compact .nav-item,.sidebar.compact .brand{justify-content:center;padding-left:0;padding-right:0}.sidebar.compact .submenu{display:none}.nav-item{height:38px;border-radius:4px;display:flex;align-items:center;gap:10px;padding:0 12px}.nav-item:hover{background:#F3F4F6}.nav-item.group{color:#0066FF;font-weight:600}.submenu a{height:34px;padding-left:44px;font-size:12px}.submenu a.active{color:#0066FF;background:#E6F0FF;font-weight:600}.filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}.filter-item{display:flex;align-items:center}.filter-label{width:70px;flex:none;text-align:right;color:#1A1D24;font-size:13px}.filter-label:after{content:'：'}.control{height:32px;border:1px solid #DFE1E5;border-radius:4px;padding:0 8px;outline:none;width:100%;background:white}.control:focus{border-color:#0066FF;box-shadow:0 0 0 2px rgba(0,102,255,.12)}.btn{height:32px;padding:0 14px;border-radius:4px;font-weight:500}.btn-primary{background:#0066FF;color:white}.btn-default{background:white;border:1px solid #DFE1E5}.kpi{background:#F7F8FA;border:1px solid #F0F1F3;border-radius:6px;padding:14px}.skeleton{background:linear-gradient(90deg,#F0F1F3 25%,#F7F8FA 37%,#F0F1F3 63%);background-size:400% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-100% 0}}.anno-badge{position:fixed;width:20px;height:20px;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px 'JetBrains Mono';text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:auto;cursor:pointer}.funnel-row{display:grid;grid-template-columns:150px 1fr 80px;align-items:center;gap:12px}.bar{height:8px;background:#E6F0FF;border-radius:4px;overflow:hidden}.bar span{height:100%;display:block;background:#0066FF;border-radius:4px}.health-pulse{width:8px;height:8px;background:#0FC060;border-radius:50%;box-shadow:0 0 0 5px rgba(15,192,96,.12)}
@media(max-width:1100px){.sidebar{width:68px}.sidebar .brand-name,.sidebar .menu-text,.sidebar .chev{display:none}.sidebar .nav-item,.sidebar .brand{justify-content:center;padding-left:0;padding-right:0}.sidebar .submenu{display:none}} </style><link rel="stylesheet" href="筛选布局.css"></head>
<body class="bg-bg-page text-[13px]"><div class="flex min-h-screen"><aside id="sidebar" class="sidebar sticky top-0 h-screen bg-white flex flex-col shrink-0 overflow-hidden"><div class="brand h-14 px-5 flex items-center gap-2"><a href="后台index.html" class="flex items-center gap-2"><span class="w-7 h-7 rounded-md bg-primary text-white flex items-center justify-center font-bold">云</span><span class="brand-name text-[16px] font-semibold text-ink-title">云登后台</span></a><button id="collapse" class="ml-auto w-8 h-8 flex items-center justify-center rounded hover:bg-bg-hover"><i data-lucide="panel-left-close" class="w-[18px]"></i></button></div><nav class="px-3 flex-1 pt-3"><button class="nav-item group w-full"><i data-lucide="chart-no-axes-combined" class="w-[18px]"></i><span class="menu-text flex-1 text-left">数据埋点</span><i data-lucide="chevron-down" class="chev w-4"></i></button><div class="submenu mt-1 space-y-1"><a class="nav-item active" href="数据总览.html">数据总览</a><a class="nav-item" href="事件管理.html">事件管理</a><a class="nav-item" href="事件明细.html">事件明细</a><a class="nav-item" href="分析中心.html">分析中心</a><a class="nav-item" href="实时调试.html">实时调试</a><a class="nav-item" href="数据质量告警.html">数据质量告警</a></div></nav><div class="p-3 border-t border-line-light"><button class="nav-item w-full"><i data-lucide="settings-2" class="w-[18px]"></i><span class="menu-text">系统设置</span></button></div></aside>
<div class="flex-1 min-w-0 flex flex-col"><header class="h-14 bg-white shadow-[0_4px_12px_rgba(26,29,36,.10)] flex items-center justify-between px-6 z-10"><span class="text-ink-sub">数据埋点 / 数据总览</span><div class="flex items-center gap-2"><div class="flex items-center gap-2 px-3 h-8 rounded bg-success-bg text-success"><span class="health-pulse"></span><span>数据链路正常</span></div><button id="stateBtn" class="btn btn-default flex items-center gap-2"><i data-lucide="flask-conical" class="w-4"></i>模拟状态</button><button class="w-8 h-8 rounded hover:bg-bg-hover flex items-center justify-center"><i data-lucide="bell" class="w-[18px]"></i></button><span class="w-7 h-7 rounded-full bg-primary-bg text-primary flex items-center justify-center font-semibold">数</span></div></header>
<main id="mainContent" class="flex-1 p-4 overflow-auto relative"><div id="stateMenu" class="hidden absolute right-16 top-2 z-30 w-44 bg-white border border-line rounded-lg shadow-lg p-1"></div>
<section class="bg-white rounded-lg p-5 md:p-6 mb-4"><div class="filter-flow"><div class="filter-item"><label class="filter-label">日期范围</label><select id="range" data-anno="1" class="control"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option></select></div><div class="filter-item"><label class="filter-label">团队</label><select id="team" class="control"><option>全部授权团队</option><option>云登产品团队</option><option>增长运营团队</option></select></div><div class="filter-item"><label class="filter-label">客户端</label><select id="client" class="control"><option>全部客户端</option><option>PC</option><option>Web</option><option>Server</option></select></div><div class="filter-item"><label class="filter-label">版本</label><select id="version" class="control"><option>全部版本</option><option>4.0.2.4</option><option>4.0.2.3</option></select></div><div class="filter-actions"><button id="query" data-anno="2" class="btn btn-primary">查询</button><button id="reset" class="btn btn-default">重置</button></div></div></section>
<section id="contentCard" class="bg-white rounded-lg p-5 md:p-6 min-h-[620px]"><div class="flex justify-between items-start mb-4"><div><h2 data-anno="3" class="inline-block text-[18px] font-semibold text-ink-title">经营与链路总览</h2><p class="text-ink-sub mt-1">数据更新于 <span id="updated" class="mono">2026-08-07 17:42:16</span> · Asia/Shanghai</p></div><button id="refresh" class="btn btn-default flex items-center gap-2"><i data-lucide="refresh-cw" class="w-4"></i>刷新</button></div><div id="content"></div></section></main></div></div>
<div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[80] bg-ink-title text-white rounded px-4 py-2 shadow-lg"></div><div id="annoLayer" style="position:fixed;inset:0;pointer-events:none;z-index:9998"></div><button id="annoToggle" class="fixed z-[9997] right-2 top-[120px] h-8 px-3 rounded-full bg-primary text-white shadow flex items-center gap-1.5"><i data-lucide="tags" class="w-4"></i><span class="text-[12px]">交互标注</span></button><div id="annoPopup" class="hidden fixed inset-0 z-[9999] bg-black/30 flex items-center justify-center"><div class="w-[520px] bg-white rounded-lg"><div class="p-4 border-b flex justify-between"><h2 id="annoTitle" class="font-semibold"></h2><button id="annoClose">×</button></div><div id="annoDesc" class="p-5 leading-relaxed"></div></div></div>
<script>
const kpis=[['日活跃用户','12,486','+8.6%','日活跃用户'],['激活用户','1,842','+5.2%','7日内有效启动'],['周成功运行环境','18,320','+12.1%','周成功运行环境'],['代理购买成功','2,136','+3.8%','支付且资产入账'],['成交金额','¥426,580','+9.4%','代理与套餐收入'],['启动成功率','98.72%','+0.34pp','成功÷启动请求'],['P0 到达率','99.72%','-0.08pp','进入分析事实层'],['数据延迟 P95','2m 14s','-18s','服务端至可查询']];
const funnel=[['引导弹窗曝光',4862,100],['点击去认证',3214,66.1],['到达认证页',3088,63.5],['提交认证',2476,50.9],['审核通过',2312,47.6],['恢复购买/启动',2186,45.0]];
const proxy=[['购买成功',2940,100],['绑定环境',2672,90.9],['检测成功',2518,85.6],['启动成功',2380,81.0],['有效运行',2296,78.1]];
let chart,state='normal',annoVisible=true;const content=document.getElementById('content');
function normalHTML(){return `<div data-anno="4" class="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-4">${kpis.map(k=>`<button class="kpi text-left hover:border-primary transition"><div class="flex justify-between"><span class="text-ink-sub">${k[0]}</span><i data-lucide="info" class="w-3.5 text-ink-muted"></i></div><strong class="block mt-2 text-[22px] text-ink-title mono">${k[1]}</strong><div class="mt-1"><span class="${k[2].startsWith('-')?'text-danger':'text-success'} mono">${k[2]}</span><span class="text-ink-muted ml-2">${k[3]}</span></div></button>`).join('')}</div><div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-4"><div data-anno="5" class="border border-line-light rounded-lg p-4"><div class="flex justify-between"><div><h3 class="font-semibold text-ink-title">核心用户与环境趋势</h3><p class="text-[12px] text-ink-muted mt-1">最近 7 天 · 日粒度</p></div><button class="text-primary text-[12px]">查看数据表</button></div><div class="h-[240px] mt-3"><canvas id="trendChart"></canvas></div></div><div data-anno="6" class="border border-line-light rounded-lg p-4"><div class="flex justify-between"><div><h3 class="font-semibold text-ink-title">实名认证转化</h3><p class="text-[12px] text-ink-muted mt-1">按用户去重 · 7 天窗口</p></div><div class="flex bg-bg-page rounded p-0.5"><button class="authTab px-3 py-1 rounded bg-white text-primary shadow-sm" data-type="personal">个人</button><button class="authTab px-3 py-1 rounded" data-type="enterprise">企业</button></div></div><div id="authFunnel" class="mt-5 space-y-3"></div></div></div><div class="grid grid-cols-1 xl:grid-cols-2 gap-4"><div data-anno="7" class="border border-line-light rounded-lg p-4"><h3 class="font-semibold text-ink-title">代理购后价值</h3><p class="text-[12px] text-ink-muted mt-1">购买成功至有效运行</p><div class="mt-5 space-y-3">${proxy.map(x=>`<div class="funnel-row"><span>${x[0]}</span><div class="bar"><span style="width:${x[2]}%"></span></div><span class="mono text-right">${x[1]}</span></div>`).join('')}</div></div><div data-anno="8" class="border border-line-light rounded-lg p-4"><div class="flex justify-between"><div><h3 class="font-semibold text-ink-title">数据质量摘要</h3><p class="text-[12px] text-ink-muted mt-1">P0 事件质量护栏</p></div><a href="数据质量告警.html" class="text-primary text-[12px]">查看 3 项告警 →</a></div><div class="grid grid-cols-2 gap-3 mt-5"><div class="p-3 bg-success-bg rounded"><span class="text-ink-sub">属性完整率</span><strong class="block mono text-[18px] text-success mt-1">99.68%</strong></div><div class="p-3 bg-warning-bg rounded"><span class="text-ink-sub">重复率</span><strong class="block mono text-[18px] text-warning mt-1">0.12%</strong></div><div class="p-3 bg-success-bg rounded"><span class="text-ink-sub">非法枚举</span><strong class="block mono text-[18px] text-success mt-1">0</strong></div><div class="p-3 bg-info-bg rounded"><span class="text-ink-sub">双端差异</span><strong class="block mono text-[18px] text-info mt-1">0.31%</strong></div></div></div></div>`}
function render(){if(chart){chart.destroy();chart=null}if(state==='loading')content.innerHTML='<div class="grid grid-cols-4 gap-3">'+Array(8).fill('<div class="h-24 rounded skeleton"></div>').join('')+'</div><div class="grid grid-cols-2 gap-4 mt-4"><div class="h-72 rounded skeleton"></div><div class="h-72 rounded skeleton"></div></div>';else if(state==='empty')content.innerHTML=emptyState('database','当前时间范围暂无数据','切换到最近 30 天查看历史数据','查看最近 30 天');else if(state==='error')content.innerHTML=emptyState('cloud-off','数据加载失败','网络异常，请保留筛选后重试','重新加载');else if(state==='forbidden')content.innerHTML=emptyState('shield-x','暂无查看权限','缺少 tracking.overview.read 权限','申请权限');else if(state==='extreme'){content.innerHTML=normalHTML().replace('12,486','99,999,999+').replace('98.72%','<0.01%');afterRender()}else{content.innerHTML=normalHTML();afterRender()}lucide.createIcons();setTimeout(renderAnno,50)}
function emptyState(icon,title,desc,action){return `<div class="h-[500px] flex flex-col items-center justify-center text-center"><span class="w-12 h-12 rounded-full bg-bg-page flex items-center justify-center text-ink-muted"><i data-lucide="${icon}"></i></span><h3 class="mt-4 text-[16px] font-semibold text-ink-title">${title}</h3><p class="mt-2 text-ink-sub">${desc}</p><button class="btn btn-primary mt-4" onclick="state='normal';render()">${action}</button></div>`}
function afterRender(){renderFunnel('personal');chart=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:['08/01','08/02','08/03','08/04','08/05','08/06','08/07'],datasets:[{label:'活跃用户',data:[10242,10820,11076,11642,11980,12120,12486],borderColor:'#0066FF',backgroundColor:'rgba(0,102,255,.08)',fill:true,tension:.35,pointRadius:2},{label:'有效环境',data:[14620,14980,15310,16080,16820,17640,18320],borderColor:'#0091D5',tension:.35,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,usePointStyle:true}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#F0F1F3'},ticks:{font:{family:'JetBrains Mono'}}}}}});document.querySelectorAll('.authTab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.authTab').forEach(x=>x.className='authTab px-3 py-1 rounded');b.className='authTab px-3 py-1 rounded bg-white text-primary shadow-sm';renderFunnel(b.dataset.type)})}
function renderFunnel(type){const data=type==='personal'?funnel:funnel.map((x,i)=>[x[0],Math.round(x[1]*.28),Math.max(0,x[2]-i*2.4)]);document.getElementById('authFunnel').innerHTML=data.map(x=>`<div class="funnel-row"><span>${x[0]}</span><div class="bar"><span style="width:${x[2]}%"></span></div><span class="mono text-right">${x[1]}</span></div>`).join('')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}document.getElementById('query').onclick=()=>{state='loading';render();setTimeout(()=>{state='normal';document.getElementById('updated').textContent=new Date().toLocaleString('zh-CN',{hour12:false});render();toast('查询已更新')},650)};document.getElementById('reset').onclick=()=>{document.getElementById('range').value='7';document.getElementById('client').selectedIndex=0;toast('筛选条件已重置')};document.getElementById('refresh').onclick=()=>document.getElementById('query').click();document.getElementById('collapse').onclick=()=>document.getElementById('sidebar').classList.toggle('compact');
const states=['normal','loading','empty','error','forbidden','extreme'];document.getElementById('stateMenu').innerHTML=states.map(s=>`<button class="block w-full text-left px-3 py-2 rounded hover:bg-bg-hover mono" data-state="${s}">${s}</button>`).join('');document.getElementById('stateBtn').onclick=()=>document.getElementById('stateMenu').classList.toggle('hidden');document.getElementById('stateMenu').onclick=e=>{if(e.target.dataset.state){state=e.target.dataset.state;render();e.currentTarget.classList.add('hidden')}};
const annotations={1:{title:'全局日期筛选',desc:['默认最近 7 天，最大 730 天。','超过 90 天按周聚合，分母为 0 时显示“—”。']},2:{title:'查询与请求防竞态',desc:['点击后取消旧请求并生成新的 requestId。','旧响应不得覆盖当前筛选结果。']},3:{title:'经营与链路总览',desc:['数据更新时间与时区始终可见。','单卡失败不阻塞整页。']},4:{title:'核心指标卡',desc:['点击指标可下钻到分析中心。','数字使用等宽字体，环比不可比时显示“不可比”。']},5:{title:'核心趋势',desc:['图表和数据表共用同一结果。','图例可隐藏序列，颜色不是唯一信息。']},6:{title:'实名认证转化',desc:['个人与企业通过 auth_type 分群。','审核通过后继续跟踪任务恢复率。']},7:{title:'代理购后价值',desc:['购买→绑定→检测→启动→有效运行。','每一步按用户去重。']},8:{title:'数据质量摘要',desc:['展示 P0 数据质量护栏。','点击进入质量告警并携带筛选。']}};
function renderAnno(){const l=document.getElementById('annoLayer');l.innerHTML='';if(!annoVisible)return;document.querySelectorAll('[data-anno]').forEach(el=>{const r=el.getBoundingClientRect();if(r.top<0||r.top>innerHeight)return;const b=document.createElement('button');b.className='anno-badge';b.textContent=el.dataset.anno;b.style.top=r.top-10+'px';b.style.left=r.right-10+'px';b.onclick=()=>showAnno(el.dataset.anno);l.appendChild(b)})}function showAnno(id){const a=annotations[id];document.getElementById('annoTitle').textContent=a.title;document.getElementById('annoDesc').innerHTML=a.desc.map(x=>'<p class="mb-2">• '+x+'</p>').join('');document.getElementById('annoPopup').classList.remove('hidden')}document.getElementById('annoClose').onclick=()=>document.getElementById('annoPopup').classList.add('hidden');document.getElementById('annoToggle').onclick=()=>{annoVisible=!annoVisible;renderAnno()};document.getElementById('mainContent').onscroll=renderAnno;window.onresize=renderAnno;render();lucide.createIcons();
</script><script src="侧栏交互.js"></script><script src="标注交互.js"></script></body></html>
