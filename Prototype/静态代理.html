<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云登后台 · 静态代理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0066FF', hover: '#0052CC', active: '#0047B3', bg: '#E6F0FF' },
            ink: { title: '#1A1D24', body: '#3A3F4A', sub: '#6E7685', muted: '#9DA2AC' },
            line: { DEFAULT: '#DFE1E5', light: '#E8EAED', lighter: '#F0F1F3' },
            page: '#F7F8FA',
            card: '#FFFFFF',
            hover: '#F3F4F6',
            bg: { page: '#F7F8FA', card: '#FFFFFF', hover: '#F3F4F6', subtle: '#F5F8FF' },
            success: { DEFAULT: '#0FC060', bg: '#E7F9F0' },
            warning: { DEFAULT: '#E7772D', bg: '#FDF2E9' },
            danger: { DEFAULT: '#D9001B', bg: '#FFE8EB' },
            info: { DEFAULT: '#0091D5', bg: '#E4F4FB' }
          },
          fontFamily: { mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #f7f8fa;
      color: #3a3f4a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button, input, select { font: inherit; letter-spacing: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 0 16px;
      background: #fff;
      box-shadow: 0 4px 12px -4px rgba(26, 29, 36, .16);
      position: relative;
      z-index: 20;
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 6px;
      background: #0066ff;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .brand-copy { color: #1a1d24; font-size: 16px; font-weight: 600; white-space: nowrap; }
    .icon-button {
      display: inline-grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #6e7685;
      cursor: pointer;
    }
    .icon-button:hover { background: #f3f4f6; color: #3a3f4a; }
    .avatar {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      background: #e6f0ff;
      color: #0066ff;
      font-weight: 600;
    }
    .topbar-sep { width: 1px; height: 20px; background: #dfe1e5; }
    .account {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #3a3f4a;
      cursor: pointer;
    }
    .account:hover { background: #f3f4f6; }
    .layout { display: flex; min-height: 0; flex: 1; }
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid #e8eaed;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-scroll { flex: 1; overflow: auto; padding: 12px; }
    .nav-item,
    .sub-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      min-height: 38px;
      margin: 0 0 4px;
      padding: 0 8px;
      border-radius: 4px;
      color: #3a3f4a;
      text-decoration: none;
      cursor: pointer;
      border: 0;
      background: transparent;
      font-size: 14px;
      text-align: left;
    }
    .nav-item:hover,
    .sub-item:hover { background: #f3f4f6; }
    .nav-item.is-active,
    .sub-item.is-active { background: #e6f0ff; color: #0066ff; font-weight: 600; }
    .nav-icon { width: 16px; height: 16px; flex: 0 0 16px; }
    .nav-label { flex: 1; min-width: 0; }
    .side-group { margin-bottom: 4px; }
    .group-btn {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      min-height: 38px;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #3a3f4a;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }
    .group-btn:hover { background: #f3f4f6; }
    .group-btn.is-active { color: #0066ff; background: #f3f4f6; font-weight: 600; }
    .group-chevron {
      margin-left: auto;
      width: 14px;
      height: 14px;
      color: #9da2ac;
      transition: transform .18s ease;
      flex: 0 0 14px;
    }
    .side-group.is-open .group-chevron { transform: rotate(180deg); }
    .side-submenu { padding-left: 0; margin: 4px 0 8px; display: grid; gap: 4px; }
    .side-group:not(.is-open) .side-submenu { display: none; }
    .sub-item { min-height: 34px; padding-left: 36px; font-size: 14px; }
    .sidebar-footer { padding: 12px; }
    .sidebar-divider { height: 1px; margin-bottom: 12px; background: #dfe1e5; }
    .workspace { min-width: 0; flex: 1; overflow: auto; }
    .page { padding: 16px; }
    .section {
      background: #fff;
      border-radius: 8px;
      padding: 20px 20px 16px;
    }
    .section + .section { margin-top: 16px; }
    .filter-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .filter-item {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: max-content 300px;
      align-items: center;
      gap: 0;
      min-width: 0;
    }
    .filter-label {
      width: 86px;
      justify-self: end;
      color: #6e7685;
      text-align: right;
      white-space: nowrap;
    }
    .filter-label::after { content: "："; }
    .filter-control { width: 300px; min-width: 0; }
    .control {
      width: 300px;
      max-width: 100%;
      height: 34px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      padding: 0 12px;
      color: #3a3f4a;
      background: #fff;
      outline: none;
    }
    .control:focus { border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0, 102, 255, .08); }
    .select-wrap { position: relative; }
    .select-wrap select { appearance: none; padding-right: 34px; }
    .select-wrap::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 1.5px solid #9da2ac;
      border-bottom: 1.5px solid #9da2ac;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    .filter-actions { height: 32px; display: flex; align-items: center; gap: 8px; justify-content: flex-start; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary { background: #0066ff; color: #fff; }
    .btn-primary:hover { background: #0052cc; }
    .btn-ghost { background: #fff; color: #3a3f4a; border-color: #dfe1e5; }
    .btn-ghost:hover { background: #f3f4f6; }
    .data-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .title-line { display: flex; align-items: baseline; gap: 8px; }
    .title-line h2 { margin: 0; color: #1a1d24; font-size: 16px; font-weight: 600; }
    .title-line .count { color: #9da2ac; font-size: 12px; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .table-wrap {
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 1980px; table-layout: fixed; }
    thead th {
      padding: 9px 12px;
      background: #f0f1f3;
      color: #6e7685;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      border-bottom: 1px solid #e8eaed;
      white-space: nowrap;
    }
    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #f0f1f3;
      color: #3a3f4a;
      vertical-align: top;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.5;
    }
    tbody tr:hover { background: #f3f4f6; }
    .checkbox { width: 16px; height: 16px; accent-color: #0066ff; }
    .link { color: #0066ff; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .muted { color: #9da2ac; }
    .mono-cell { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }
    .tag-success { color: #0fc060; background: #e7f9f0; }
    .tag-warning { color: #e7772d; background: #fdf2e9; }
    .tag-info { color: #0091d5; background: #e4f4fb; }
    .tag-muted { color: #6e7685; background: #f0f1f3; }
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .switch-track {
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: #dfe1e5;
      position: relative;
      flex: 0 0 36px;
      transition: background-color .15s ease;
    }
    .switch-track::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(26, 29, 36, .16);
      transition: transform .15s ease;
    }
    .switch.is-on .switch-track { background: #0fc060; }
    .switch.is-on .switch-track::before { transform: translateX(16px); }
    .pagination {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 20px;
      color: #6e7685;
      font-size: 12px;
    }
    .pg-group { display: inline-flex; align-items: center; gap: 8px; }
    .pg-button {
      width: 30px;
      height: 30px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      background: #fff;
      color: #3a3f4a;
      cursor: pointer;
    }
    .pg-button:hover { background: #f3f4f6; }
    .pg-button:disabled { cursor: not-allowed; color: #9da2ac; background: #f7f8fa; }
    .pg-jump {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pg-input {
      width: 48px;
      height: 30px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      padding: 0 8px;
      text-align: center;
    }
    .pg-size {
      width: 84px;
      height: 30px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      padding: 0 8px;
      background: #fff;
      appearance: none;
    }
    .cascade {
      position: relative;
    }
    .cascade-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 40;
      width: 620px;
      border: 1px solid #dfe1e5;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 24px rgba(26, 29, 36, .14);
      overflow: hidden;
    }
    .cascade-panel[hidden] { display: none; }
    .cascade-head {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f1f3;
      color: #9da2ac;
      font-size: 12px;
    }
    .cascade-body {
      display: grid;
      grid-template-columns: 180px 180px 1fr;
      min-height: 256px;
    }
    .cascade-col {
      border-right: 1px solid #f0f1f3;
      padding: 8px;
      overflow: auto;
    }
    .cascade-col:last-child { border-right: 0; }
    .cascade-option {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #3a3f4a;
      cursor: pointer;
      text-align: left;
    }
    .cascade-option:hover { background: #f3f4f6; }
    .cascade-option.is-active { background: #e6f0ff; color: #0066ff; font-weight: 600; }
    .cascade-option small { color: #9da2ac; font-size: 12px; }
    .city-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 34px;
      width: 100%;
      padding: 0 12px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      background: #fff;
      color: #3a3f4a;
      cursor: pointer;
      text-align: left;
    }
    .city-chip:hover { background: #f3f4f6; }
    .notice {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1300;
      pointer-events: none;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .3);
      padding: 24px;
    }
    .modal-overlay.is-open { display: flex; }
    .modal {
      width: min(760px, 100%);
      max-height: calc(100vh - 48px);
      overflow: hidden;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .12);
      display: flex;
      flex-direction: column;
    }
    .modal.sm { width: min(600px, 100%); }
    .modal.dialog { height: 250px; }
    .modal-header {
      min-height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e8eaed;
    }
    .modal-title {
      margin: 0;
      color: #1a1d24;
      font-size: 16px;
      font-weight: 600;
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #9da2ac;
      cursor: pointer;
    }
    .modal-close:hover { background: #f3f4f6; color: #6e7685; }
    .modal-body {
      padding: 32px 24px;
      overflow: auto;
    }
    .modal.dialog .modal-body {
      flex: 1;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-footer {
      padding: 16px 24px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid #e8eaed;
      margin-top: auto;
    }
    .form-row {
      display: grid;
      grid-template-columns: 90px minmax(0, 400px);
      align-items: start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .form-label {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #6e7685;
      white-space: nowrap;
      font-size: 13px;
    }
    .form-label::after { content: "："; }
    .modal-form {
      width: 502px;
      max-width: 100%;
      margin: 0 auto;
    }
    .modal-form-wide {
      max-width: none;
      margin: 0;
    }
    .form-control {
      width: 400px;
      max-width: 100%;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      outline: none;
      background: #fff;
      color: #3a3f4a;
    }
    .form-control:focus { border-color: #0066ff; box-shadow: 0 0 0 2px rgba(0, 102, 255, .12); }
    .form-control.textarea { min-height: 120px; padding: 10px 12px; resize: vertical; }
    .inline-field {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      white-space: nowrap;
      color: #3a3f4a;
    }
    .inline-field label { display: inline-flex; align-items: center; gap: 6px; }
    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      padding-top: 4px;
    }
    .tag-grid label { display: inline-flex; align-items: center; gap: 6px; color: #3a3f4a; }
    .cascade-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .cascade-box {
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      background: #fff;
      min-height: 210px;
      overflow: hidden;
    }
    .cascade-box.slim { min-height: 170px; }
    .cascade-box-header {
      padding: 10px 12px;
      border-bottom: 1px solid #e8eaed;
      color: #6e7685;
      font-size: 12px;
      font-weight: 600;
      background: #f7f8fa;
    }
    .cascade-box-body {
      padding: 8px;
      display: grid;
      gap: 4px;
    }
    .cascade-choice {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 4px;
      border: 0;
      background: transparent;
      color: #3a3f4a;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .cascade-choice:hover { background: #f3f4f6; }
    .cascade-choice.is-active { background: #e6f0ff; color: #0066ff; font-weight: 600; }
    .number-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .number-table th,
    .number-table td {
      padding: 14px 12px;
      border-bottom: 1px solid #f0f1f3;
      text-align: left;
      vertical-align: middle;
    }
    .number-table th {
      color: #6e7685;
      font-size: 12px;
      font-weight: 600;
      background: #f7f8fa;
      white-space: nowrap;
    }
    .number-table td:first-child,
    .number-table th:first-child { width: 150px; }
    .number-table td:nth-child(2),
    .number-table th:nth-child(2) { width: 110px; }
    .number-table td:last-child,
    .number-table th:last-child { width: auto; }
    .number-input {
      width: 100%;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      outline: none;
      background: #fff;
      color: #3a3f4a;
    }
    .number-input:focus { border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0, 102, 255, .08); }
    .radio-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: 24px;
      white-space: nowrap;
    }
    .sale-pool-box {
      width: 100%;
      max-width: 502px;
      margin: 0 auto;
    }
    .sale-pool-select {
      width: 100%;
      height: 32px;
      padding: 0 16px;
      border: 1px solid #dfe1e5;
      border-radius: 4px;
      appearance: none;
      background: #fff;
      color: #3a3f4a;
      font-size: 13px;
    }
    .sale-pool-select:focus { border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0, 102, 255, .08); }
    .sale-pool-wrap { position: relative; }
    .sale-pool-wrap > select { appearance: none; -webkit-appearance: none; padding-right: 40px; }
    .sale-pool-wrap::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 1.5px solid #9da2ac;
      border-bottom: 1.5px solid #9da2ac;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    .cell-action-btn {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 0;
      padding: 0;
      border-radius: 4px;
      background: transparent;
      color: #9da2ac;
      cursor: pointer;
      flex: 0 0 20px;
    }
    .cell-action-btn.is-hovered { color: #0066ff; background: #f3f4f6; }
    .sale-pool-column { text-overflow: clip; }
    .product-link { border: 0; padding: 0; background: transparent; cursor: pointer; text-align: left; }
    .segment-table { min-width: 660px; }
    .segment-table td { overflow-wrap: anywhere; }
    .segment-table th:nth-child(2), .segment-table td:nth-child(2) { padding-left: 20px; }
    .segment-table tbody tr:nth-child(even) { background: #f7f8fa; }
    .pg-button.is-current { background: #0066ff; color: #fff; border-color: #0066ff; }
    .sale-pool-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .confirm-copy {
      min-height: 140px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #6e7685;
      font-size: 13px;
      line-height: 1.8;

              <div class="sale-pool-box">
                <div class="form-row">
                  <label class="form-label">售卖池</label>
                  <div class="sale-pool-wrap">
                    <select id="salePoolSelect" class="sale-pool-select">
                      <option ${modalState.salePool === '未知' ? 'selected' : ''}>未知</option>
                      <option ${modalState.salePool === '静态住宅标准' ? 'selected' : ''}>静态住宅标准</option>
                      <option ${modalState.salePool === '静态住宅优质' ? 'selected' : ''}>静态住宅优质</option>
                      <option ${modalState.salePool === '云平台' ? 'selected' : ''}>云平台</option>
                    </select>
                  </div>
                </div>
              </div>
            </form>
            <footer class="modal-footer">
              <button class="btn btn-ghost" type="button" data-modal-close>取消</button>
              <button class="btn btn-primary" type="button" data-modal-submit>提交</button>
            </footer>
          </section>`;
      }
      return '';
    }

    function fillChannels() {
      els.channelFilter.innerHTML = ['<option value="">请选择</option>']
        .concat(channels.map((value) => `<option value="${value}">${value}</option>`))
        .join('');
    }

    function getSelectedRegionLabel() {
      return state.region.filter(Boolean).join(' / ') || '请选择';
    }

    function renderRegionColumns() {
      els.regionText.textContent = state.region.filter(Boolean).length ? getSelectedRegionLabel() : '请选择';
      els.regionText.classList.toggle('text-ink-muted', !state.region.filter(Boolean).length);

      const continents = regionTree.map((item) => `
        <button class="cascade-option ${item.name === state.continent ? 'is-active' : ''}" type="button" data-continent="${item.name}">
          <span>${item.name}</span><small>›</small>
        </button>
      `).join('');
      els.continentList.innerHTML = continents;

      const continent = regionTree.find((item) => item.name === state.continent) || regionTree[0];
      const countries = continent.children.map((item) => `
        <button class="cascade-option ${item.name === state.country ? 'is-active' : ''}" type="button" data-country="${item.name}">
          <span>${item.name}</span><small>›</small>
        </button>
      `).join('');
      els.countryList.innerHTML = countries;

      const country = continent.children.find((item) => item.name === state.country) || continent.children[0];
      const districts = country.districts.map((name) => `
        <button class="cascade-option ${name === state.district ? 'is-active' : ''}" type="button" data-district="${name}">
          <span>${name}</span><small>可选</small>
        </button>
      `).join('');
      els.districtList.innerHTML = districts;
    }

    function openRegion() {
      state.regionOpen = true;
      els.regionPanel.hidden = false;
      els.regionBtn.setAttribute('aria-expanded', 'true');
      renderRegionColumns();
    }

    function closeRegion() {
      state.regionOpen = false;
      els.regionPanel.hidden = true;
      els.regionBtn.setAttribute('aria-expanded', 'false');
    }

    function applyRegionSelection() {
      state.region = [state.continent, state.country, state.district].filter(Boolean);
      renderRegionColumns();
      renderTable();
    }

    function setDefaultRegion() {
      const firstContinent = regionTree[0];
      const firstCountry = firstContinent.children[0];
      state.continent = firstContinent.name;
      state.country = firstCountry.name;
      state.district = firstCountry.districts[0];
      state.region = [];
      renderRegionColumns();
    }

    function filtersMatch(row) {
      const regionOk = !state.region.length || row.region.includes(state.region.join(' / ')) || row.region.includes(state.country) || row.region.includes(state.continent);
      return (
        (!state.source || row.source === state.source) &&
        (!state.salePool || row.salePool === state.salePool) &&
        (!state.channel || row.channel === state.channel) &&
        (!state.display || (state.display === '显示' ? row.visible : !row.visible)) &&
        regionOk
      );
    }

    function getFilteredRows() {
      return rows.filter(filtersMatch);
    }

    function renderTable() {
      const filtered = getFilteredRows();
      const total = filtered.length;
      const pages = Math.max(1, Math.ceil(total / state.pageSize));
      state.page = Math.min(state.page, pages);
      const start = (state.page - 1) * state.pageSize;
      const items = filtered.slice(start, start + state.pageSize);

      els.totalCount.textContent = `共 ${total} 条`;
      els.totalInfo.textContent = `共 ${total} 条记录`;
      els.pageInfo.textContent = `第 ${total ? state.page : 1} / ${pages} 页`;
      els.jumpPage.value = String(total ? state.page : 1);
      els.prevPage.disabled = state.page <= 1;
      els.nextPage.disabled = state.page >= pages;
      els.checkAll.checked = false;

      els.tableBody.innerHTML = items.map((row) => `
        <tr data-row-id="${row.id}">
          <td><input class="checkbox row-check" type="checkbox" aria-label="选择 ${row.productName}"></td>
          <td>${row.source}</td>
          <td><button class="link product-link" type="button" data-product-segments="${row.id}">${row.productName}</button></td>
          <td>${row.channel}</td>
          <td title="${row.region}">${row.region}</td>
          <td>${row.type}</td>
          <td>${row.bandwidth}</td>
          <td>${row.isp}</td>
          <td>${row.network}</td>
          <td class="sale-pool-column">
            <div class="sale-pool-cell">
              <span>${row.salePool}</span>
              <button class="cell-action-btn" type="button" data-sale-pool-edit="${row.id}" aria-label="编辑售卖池" title="编辑售卖池">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
            </div>
          </td>
          <td class="mono-cell">${row.cost.toFixed(2)}</td>
          <td class="mono-cell">${row.sale.toFixed(2)}</td>
          <td class="mono-cell">${row.floor.toFixed(2)}</td>
          <td>${row.cycle}</td>
          <td title="${row.packageText}">${row.packageText}</td>
          <td>${typeof row.stock === 'number' ? `<span class="mono-cell">${row.stock}</span>` : `<span class="tag tag-success">${row.stock}</span>`}</td>
          <td>${row.recommend === '-' ? '<span class="muted">-</span>' : `<span class="tag tag-info">${row.recommend}</span>`}</td>
          <td>${row.unsuitable === '-' ? '<span class="muted">-</span>' : `<span class="tag tag-warning">${row.unsuitable}</span>`}</td>
          <td title="${row.note}">${row.note}</td>
          <td>
            <button class="switch ${row.visible ? 'is-on' : ''}" type="button" data-toggle-visible="${row.id}" aria-label="${row.visible ? '隐藏' : '显示'}">
              <span class="switch-track" aria-hidden="true"></span>
              <span>${row.visible ? '显示' : '隐藏'}</span>
            </button>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    function syncFiltersFromUI() {
      state.source = els.sourceFilter.value;
      state.salePool = els.salePoolFilter.value;
      state.channel = els.channelFilter.value;
      state.display = els.displayFilter.value;
    }

    function applySearch() {
      syncFiltersFromUI();
      state.page = 1;
      closeRegion();
      renderTable();
      toast('筛选结果已更新');
    }

    function resetAll() {
      els.sourceFilter.value = '';
      els.salePoolFilter.value = '';
      els.channelFilter.value = '';
      els.displayFilter.value = '';
      state.source = '';
      state.salePool = '';
      state.channel = '';
      state.display = '';
      state.page = 1;
      state.pageSize = Number(els.pageSize.value);
      setDefaultRegion();
      renderTable();
      toast('筛选条件已重置');
    }

    function updateRegionByClick(target) {
      const continentName = target.dataset.continent;
      const countryName = target.dataset.country;
      const districtName = target.dataset.district;
      if (continentName) {
        state.continent = continentName;
        const continent = regionTree.find((item) => item.name === continentName);
        const firstCountry = continent.children[0];
        state.country = firstCountry.name;
        state.district = firstCountry.districts[0];
      }
      if (countryName) {
        const continent = regionTree.find((item) => item.name === state.continent);
        const country = continent.children.find((item) => item.name === countryName);
        state.country = country.name;
        state.district = country.districts[0];
      }
      if (districtName) {
        state.district = districtName;
        applyRegionSelection();
        closeRegion();
        return;
      }
      applyRegionSelection();
    }

    function getSelectedRowIds() {
      return Array.from(document.querySelectorAll('.row-check:checked')).map((checkbox) => Number(checkbox.closest('tr')?.dataset.rowId)).filter(Boolean);
    }

    function handleAction(name) {
      const modalActions = new Set(['set-product', 'set-price', 'set-duration', 'set-display', 'set-recommend', 'sync-platform', 'set-sale-pool']);
      const selectionRequiredActions = new Set([
        'batch-show',
        'batch-hide',
        'sync-reference',
        ...modalActions
      ]);
      if (selectionRequiredActions.has(name)) {
        const selectedIds = getSelectedRowIds();
        if (!selectedIds.length) {
          toast('请选择需要设置的数据');
          return;
        }
        if (modalActions.has(name)) {
          const initialSalePool = rows.find((row) => row.id === selectedIds[0])?.salePool || modalState.salePool;
          openModal(name, name === 'set-sale-pool' ? { targetIds: selectedIds, salePool: initialSalePool } : {});
          return;
        }
        const messages = {
          'batch-show': '已批量设置为显示',
          'batch-hide': '已批量设置为隐藏',
          'sync-reference': '参考数据已同步'
        };
        toast(messages[name] || '已执行操作');
        return;
      }
      if (name === 'set-region-order') {
        openModal(name);
        return;
      }
      toast('已执行操作');
    }

    document.getElementById('regionFilterBtn').addEventListener('click', () => {
      state.regionOpen ? closeRegion() : openRegion();
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.cascade')) closeRegion();
    });

    els.modalLayer.addEventListener('submit', (event) => {
      if (event.target.id !== 'segmentForm') return;
      event.preventDefault();
      const values = new FormData(event.target);
      productSegments.get(segmentState.productId).forEach(item => {
        if (segmentState.selected.has(item.id)) {
          ['recommend', 'unsuitable', 'note'].forEach(key => { item[key] = values.get(key).trim(); });
        }
      });
      openModal('segments');
      toast('号段推荐已更新');
    });
    els.modalLayer.addEventListener('input', (event) => {
      const counter = els.modalLayer.querySelector(`[data-count-for="${event.target.id}"]`);
      if (counter) counter.textContent = `${event.target.value.length}/${event.target.maxLength}`;
    });
    els.modalLayer.addEventListener('change', (event) => {
      const target = event.target;
      if (target.matches('[data-segment-id]')) {
        const id = Number(target.dataset.segmentId);
        target.checked ? segmentState.selected.add(id) : segmentState.selected.delete(id);
        const checks = [...els.modalLayer.querySelectorAll('[data-segment-id]')];
        const all = els.modalLayer.querySelector('[data-segment-all]');
        all.checked = checks.every(input => input.checked);
        all.indeterminate = checks.some(input => input.checked) && !all.checked;
      }
      if (target.matches('[data-segment-all]')) {
        els.modalLayer.querySelectorAll('[data-segment-id]').forEach(input => {
          input.checked = target.checked;
          target.checked ? segmentState.selected.add(Number(input.dataset.segmentId)) : segmentState.selected.delete(Number(input.dataset.segmentId));
        });
      }
      if (target.matches('[data-segment-size]')) { segmentState.pageSize = Number(target.value); segmentState.page = 1; openModal('segments'); }
      if (target.matches('[data-segment-jump]')) { segmentState.page = Math.floor(Number(target.value)) || 1; openModal('segments'); }
    });
    els.modalLayer.addEventListener('click', (event) => {
      if (event.target.closest('[data-segment-edit]')) {
        if (!segmentState.selected.size) { toast('请选择需要设置的号段'); return; }
        openModal('segment-edit'); return;
      }
      const pageButton = event.target.closest('[data-segment-page]');
      if (pageButton) { segmentState.page = Number(pageButton.dataset.segmentPage); openModal('segments'); return; }

      if (event.target === els.modalLayer) closeModal();
      if (event.target.closest('[data-modal-close]')) closeModal();
      const submit = event.target.closest('[data-modal-submit]');
      if (submit) {
        const active = modalState.active;
        if (active === 'sync-platform') {
          toast('三方平台推荐已同步');
        } else if (active === 'set-sale-pool') {
          modalState.salePool = document.getElementById('salePoolSelect')?.value || modalState.salePool;
          const nextSalePool = modalState.salePool;
          const targetIds = modalState.salePoolTargets.length ? modalState.salePoolTargets : getSelectedRowIds();
          targetIds.forEach((id) => {
            const row = rows.find((item) => item.id === id);
            if (row) row.salePool = nextSalePool;
          });
          renderTable();
          toast(`售卖池已更新为 ${modalState.salePool}`);
        } else if (active === 'set-region-order') {
          toast('地区排序已保存');
        } else if (active === 'set-product') {
          toast('产品信息已提交');
        } else if (active === 'set-price') {
          toast('价格设置已提交');
        } else if (active === 'set-duration') {
          toast('时长折扣已提交');
        } else if (active === 'set-display') {
          toast('显示设置已提交');
        } else if (active === 'set-recommend') {
          toast('推荐内容已提交');
        }
        closeModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modalState.active) closeModal();
      if (event.key === 'Tab' && modalState.active) {
        const controls = [...els.modalLayer.querySelectorAll('button:not(:disabled), input, select, textarea')];
        const first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
      }
    });

    const sideGroups = Array.from(document.querySelectorAll('.side-group'));
    function setOpenGroup(groupId) {
      sideGroups.forEach((group) => {
        const isOpen = group.dataset.group === groupId;
        group.classList.toggle('is-open', isOpen);
        const toggle = group.querySelector('[data-group-toggle]');
        const submenu = group.querySelector('.side-submenu');
        if (toggle) toggle.setAttribute('aria-expanded', String(isOpen));
        if (submenu) submenu.hidden = !isOpen;
      });
    }

    document.getElementById('sidebar').addEventListener('click', (event) => {
      const toggle = event.target.closest('[data-group-toggle]');
      if (!toggle) return;
      const group = toggle.closest('.side-group');
      if (!group) return;
      const groupId = group.dataset.group;
      const shouldOpen = !group.classList.contains('is-open');
      setOpenGroup(shouldOpen ? groupId : '');
    });

    setOpenGroup('section-proxy-package');

    els.continentList.addEventListener('click', (event) => {
      const button = event.target.closest('[data-continent]');
      if (!button) return;
      updateRegionByClick(button);
      renderRegionColumns();
    });

    els.countryList.addEventListener('click', (event) => {
      const button = event.target.closest('[data-country]');
      if (!button) return;
      updateRegionByClick(button);
      renderRegionColumns();
    });

    els.districtList.addEventListener('click', (event) => {
      const button = event.target.closest('[data-district]');
      if (!button) return;
      updateRegionByClick(button);
    });

    els.searchBtn.addEventListener('click', applySearch);
    els.resetBtn.addEventListener('click', resetAll);
    els.pageSize.addEventListener('change', () => {
      state.pageSize = Number(els.pageSize.value);
      state.page = 1;
      renderTable();
    });
    els.jumpPage.addEventListener('change', () => {
      const total = getFilteredRows().length;
      const pages = Math.max(1, Math.ceil(total / state.pageSize));
      const next = Math.min(pages, Math.max(1, Number(els.jumpPage.value) || 1));
      state.page = next;
      renderTable();
    });
    els.prevPage.addEventListener('click', () => {
      if (state.page > 1) state.page -= 1;
      renderTable();
    });
    els.nextPage.addEventListener('click', () => {
      const pages = Math.max(1, Math.ceil(getFilteredRows().length / state.pageSize));
      if (state.page < pages) state.page += 1;
      renderTable();
    });
    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]');
      if (!action) return;
      handleAction(action.dataset.action);
    });
    // 显式清除浮层打开前的 hover，避免关闭浮层后浏览器保留旧悬停状态。
    els.tableBody.addEventListener('pointerover', (event) => {
      const button = event.target.closest('[data-sale-pool-edit]');
      if (button && !modalState.active) button.classList.add('is-hovered');
    });
    els.tableBody.addEventListener('pointerout', (event) => {
      const button = event.target.closest('[data-sale-pool-edit]');
      if (button && !button.contains(event.relatedTarget)) button.classList.remove('is-hovered');
    });
    els.tableBody.addEventListener('click', (event) => {
      const product = event.target.closest('[data-product-segments]');
      if (product) {
        segmentState.productId = Number(product.dataset.productSegments);
        segmentState.selected.clear(); segmentState.page = 1; segmentState.pageSize = 50;
        openModal('segments'); return;
      }
      const salePoolEdit = event.target.closest('[data-sale-pool-edit]');
      if (salePoolEdit) {
        salePoolEdit.classList.remove('is-hovered');
        const id = Number(salePoolEdit.dataset.salePoolEdit);
        const row = rows.find((item) => item.id === id);
        if (!row) return;
        openModal('set-sale-pool', { targetIds: [id], salePool: row.salePool, restoreFocus: event.detail === 0 });
        return;
      }
      const toggle = event.target.closest('[data-toggle-visible]');
      if (!toggle) return;
      const id = Number(toggle.dataset.toggleVisible);
      const row = rows.find((item) => item.id === id);
      if (!row) return;
      row.visible = !row.visible;
      renderTable();
    });
    els.checkAll.addEventListener('change', () => {
      document.querySelectorAll('.row-check').forEach((checkbox) => {
        checkbox.checked = els.checkAll.checked;
      });
      toast(els.checkAll.checked ? '当前页已全选' : '当前页已取消全选');
    });

    document.getElementById('mobileMenu').addEventListener('click', () => {
      els.sidebar.classList.add('is-open');
      els.overlay.hidden = false;
    });
    els.overlay.addEventListener('click', () => {
      els.sidebar.classList.remove('is-open');
      els.overlay.hidden = true;
    });

    fillChannels();
    setDefaultRegion();
    renderRegionColumns();
    renderTable();
    lucide.createIcons();
  </script>
</body>
</html>
