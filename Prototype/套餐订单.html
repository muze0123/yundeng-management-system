<style data-inline="app-shell">* { box-sizing: border-box; }

:root {
  color-scheme: light;
  --app-sidebar-width: 220px;
  --app-sidebar-compact-width: 68px;
  --app-topbar-height: 56px;
}

html,
body { min-height: 100%; }

body {
  margin: 0;
  background: #f7f8fa;
  color: #3a3f4a;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button,
input,
select,
textarea { font: inherit; letter-spacing: 0; }

button,
a { -webkit-tap-highlight-color: transparent; }

.mono {
  font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
}

.app-shell { display: flex; width: 100%; height: 100vh; min-height: 100vh; flex-direction: column; overflow: hidden; }
.app-shell-body { display: flex; min-height: 0; flex: 1; overflow: hidden; }

.app-sidebar {
  position: relative;
  z-index: 40;
  display: flex;
  width: var(--app-sidebar-width);
  height: 100%;
  flex: 0 0 auto;
  flex-direction: column;
  overflow: visible;
  background: #fff;
  transition: width .2s ease, transform .2s ease;
}

.app-sidebar.is-compact { width: var(--app-sidebar-compact-width); }

.app-brand-link { display: flex; min-width: 0; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.app-brand-mark { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 6px; background: #0066ff; color: #fff; font-size: 15px; font-weight: 700; }
.app-brand-copy { overflow: hidden; color: #1a1d24; font-size: 16px; font-weight: 600; white-space: nowrap; }

.app-icon-button {
  display: inline-grid;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  place-items: center;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #6e7685;
  cursor: pointer;
}

.app-icon-button:hover { background: #f3f4f6; color: #3a3f4a; }
.app-icon-button:focus-visible,
.app-menu-link:focus-visible,
.app-account-button:focus-visible,
.app-collapse-button:focus-visible,
.app-brand-link:focus-visible { outline: 2px solid #0066ff; outline-offset: 2px; }
.app-collapse-button {
  position: absolute;
  top: 50%;
  right: 0;
  z-index: 3;
  display: grid;
  width: 12px;
  height: 50px;
  padding: 0;
  transform: translate(50%, -50%);
  place-items: center;
  border: 0;
  border-radius: 6px;
  background: #e5e6ed;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease;
}
.app-collapse-button::before {
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-right: 7px solid currentColor;
  border-bottom: 6px solid transparent;
  content: "";
}
.app-collapse-button[aria-expanded="false"]::before {
  border-right: 0;
  border-left: 7px solid currentColor;
}
.app-sidebar:hover .app-collapse-button,
.app-sidebar:focus-within .app-collapse-button,
.app-collapse-button:focus-visible { opacity: 1; pointer-events: auto; }
.app-collapse-button:hover { background: #acb0ba; }

.app-primary-nav { min-height: 0; flex: 1; overflow: auto; padding: 12px 12px; }
.app-section-label { padding: 8px 8px 0; color: #9da2ac; font-size: 11px; line-height: 28px; }

.app-menu-link,
.app-bottom-link {
  display: flex;
  width: 100%;
  min-height: 38px;
  align-items: center;
  gap: 12px;
  margin: 0 0 4px;
  padding: 0 8px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #3a3f4a;
  font-size: 13px;
  line-height: 1.3;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}

.app-menu-link:hover,
.app-bottom-link:hover { background: #f3f4f6; }
.app-menu-link.is-active { background: #e6f0ff; color: #0066ff; font-weight: 600; }
.app-menu-link.is-group-active { background: #f3f4f6; color: #0066ff; font-weight: 600; }
.app-menu-icon { width: 16px; height: 16px; flex: 0 0 16px; }
.app-menu-label { min-width: 0; flex: 1; font-size: 13px; }
.app-group-chevron { width: 16px; height: 16px; transition: transform .2s ease; }
.app-group-toggle[aria-expanded="false"] .app-group-chevron { transform: rotate(-90deg); }
.app-submenu { overflow: hidden; max-height: 240px; opacity: 1; transition: max-height .2s ease, opacity .15s ease; }
.app-submenu.is-collapsed { max-height: 0; opacity: 0; pointer-events: none; }
.app-submenu .app-menu-link { min-height: 34px; padding-left: 36px; font-size: 13px; }
.app-sidebar-footer { padding: 12px; }
.app-sidebar-divider { height: 1px; margin-bottom: 12px; background: #dfe1e5; }

.app-sidebar.is-compact .app-menu-label,
.app-sidebar.is-compact .app-group-chevron,
.app-sidebar.is-compact .app-section-label,
.app-sidebar.is-compact .app-bottom-label { display: none; }
.app-sidebar.is-compact .app-menu-link,
.app-sidebar.is-compact .app-bottom-link { justify-content: center; padding-right: 0; padding-left: 0; }
.app-sidebar.is-compact .app-submenu { display: none; }

.app-workspace { display: flex; min-width: 0; height: 100%; min-height: 0; flex: 1; flex-direction: column; overflow: hidden; }
.app-topbar {
  position: relative;
  z-index: 50;
  display: flex;
  width: 100%;
  min-height: var(--app-topbar-height);
  flex: 0 0 var(--app-topbar-height);
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #fff;
  box-shadow: 0 4px 12px -4px rgba(26, 29, 36, .16);
  clip-path: inset(0 0 -16px 0);
}
.app-topbar-left,
.app-topbar-right { display: flex; min-width: 0; align-items: center; gap: 8px; }
.app-topbar-left { gap: 12px; }
.app-mobile-menu { display: none; }
.app-notice-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border: 1px solid #fff; border-radius: 50%; background: #d9001b; }
.app-topbar-separator { width: 1px; height: 20px; margin: 0 4px; background: #dfe1e5; }
.app-account-button { display: flex; align-items: center; gap: 8px; padding: 4px; border: 0; border-radius: 4px; background: transparent; color: #3a3f4a; cursor: pointer; }
.app-account-button:hover { background: #f3f4f6; }
.app-avatar { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 50%; background: #e6f0ff; color: #0066ff; font-weight: 600; }

.app-content { min-height: 0; flex: 1; overflow: auto; background: #f7f8fa; }
.app-route-outlet { min-height: 100%; }
.app-route-loading { display: grid; min-height: calc(100vh - var(--app-topbar-height)); place-items: center; color: #6e7685; }
.app-route-loading > div { display: flex; align-items: center; gap: 8px; }
.app-spinner { width: 16px; height: 16px; border: 2px solid #dfe1e5; border-top-color: #0066ff; border-radius: 50%; animation: app-spin .7s linear infinite; }
@keyframes app-spin { to { transform: rotate(360deg); } }

.app-business-module > .app-module-toolbar { display: none !important; }
.app-business-module > main { height: auto !important; min-height: calc(100vh - var(--app-topbar-height)) !important; overflow: visible !important; }
.app-business-module .app-module-compat { display: none !important; }

.app-popover {
  position: fixed;
  z-index: 70;
  border: 1px solid #dfe1e5;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 6px 24px rgba(26, 29, 36, .14);
}
.app-popover[hidden] { display: none; }
.app-notice-popover { top: 48px; right: 72px; width: min(340px, calc(100vw - 32px)); }
.app-account-popover { top: 48px; right: 16px; width: 184px; padding: 4px; }
.app-popover-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #dfe1e5; }
.app-popover-header strong { color: #1a1d24; font-size: 15px; }
.app-link-button { border: 0; background: transparent; color: #0066ff; cursor: pointer; }
.app-notice-item { display: flex; width: 100%; gap: 8px; padding: 12px 16px; border: 0; border-bottom: 1px solid #f0f1f3; background: #fff; text-align: left; cursor: pointer; }
.app-notice-item:hover { background: #f3f4f6; }
.app-notice-item-dot { width: 8px; height: 8px; flex: 0 0 8px; margin-top: 6px; border-radius: 50%; background: #0066ff; }
.app-notice-item-dot.is-read { background: #dfe1e5; }
.app-notice-title { color: #1a1d24; font-weight: 500; }
.app-notice-desc { overflow: hidden; margin-top: 4px; color: #6e7685; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.app-notice-time { margin-top: 4px; color: #9da2ac; font-size: 11px; }
.app-account-meta { padding: 10px 12px; border-bottom: 1px solid #f0f1f3; color: #6e7685; font-size: 12px; line-height: 1.7; }
.app-account-action { display: flex; width: 100%; min-height: 34px; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #3a3f4a; cursor: pointer; }
.app-account-action:hover { background: #f3f4f6; }

.app-mobile-overlay { position: fixed; inset: var(--app-topbar-height) 0 0; z-index: 38; border: 0; background: rgba(26, 29, 36, .28); }
.app-mobile-overlay[hidden] { display: none; }
.app-compact-flyout { position: fixed; z-index: 65; left: 76px; width: 176px; padding: 4px; border: 1px solid #dfe1e5; border-radius: 8px; background: #fff; box-shadow: 0 6px 24px rgba(26, 29, 36, .14); }
.app-compact-flyout[hidden] { display: none; }

.app-planning { min-height: calc(100vh - var(--app-topbar-height)); padding: 16px; }
.app-planning-inner { display: grid; min-height: 420px; place-items: center; background: #fff; }
.app-planning-copy { max-width: 460px; padding: 32px; text-align: center; }
.app-planning-icon { display: grid; width: 48px; height: 48px; margin: 0 auto; place-items: center; border-radius: 8px; background: #fdf2e9; color: #e7772d; }
.app-planning h1 { margin: 16px 0 8px; color: #1a1d24; font-size: 20px; }
.app-planning p { margin: 0; color: #6e7685; line-height: 1.7; }

.app-toast-container { position: fixed; top: 16px; left: 50%; z-index: 100; transform: translateX(-50%); pointer-events: none; }
.app-toast { margin-bottom: 8px; padding: 8px 16px; border-radius: 4px; background: #3a3f4a; color: #fff; box-shadow: 0 2px 8px rgba(26, 29, 36, .16); animation: app-toast-in .18s ease both; }
@keyframes app-toast-in { from { opacity: 0; transform: translateY(-8px); } }

@media (min-width: 768px) {
  .app-topbar { padding: 0 24px; }
}

@media (max-width: 767px) {
  .app-sidebar { position: fixed; top: var(--app-topbar-height); bottom: 0; left: 0; height: auto; transform: translateX(-100%); box-shadow: 0 6px 24px rgba(26, 29, 36, .16); }
  .app-sidebar.is-mobile-open { width: min(280px, calc(100vw - 48px)); transform: translateX(0); }
  .app-sidebar.is-compact { width: min(280px, calc(100vw - 48px)); }
  .app-sidebar.is-compact .app-menu-label,
  .app-sidebar.is-compact .app-group-chevron,
  .app-sidebar.is-compact .app-section-label,
  .app-sidebar.is-compact .app-bottom-label { display: block; }
  .app-sidebar.is-compact .app-menu-link,
  .app-sidebar.is-compact .app-bottom-link { justify-content: flex-start; padding-right: 8px; padding-left: 8px; }
  .app-sidebar.is-compact .app-submenu { display: block; }
  .app-collapse-button { display: none; }
  .app-mobile-menu { display: inline-grid; }
  .app-account-name,
  .app-account-chevron { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .app-sidebar,
  .app-collapse-button,
  .app-submenu,
  .app-group-chevron,
  .app-spinner,
  .app-toast { transition: none; animation: none; }
}

<button id="appNoticeButton" class="app-icon-button relative" type="button" aria-label="通知" aria-haspopup="dialog">

'},{id:'tracking-metrics',label:'指标管理',href:'指标管理.html'}]},\n        {id:'tracking-debug',label:'联调验证',icon:'radio-tower',href:'联调验证.html'},\n        {id:'tracking-quality',label:'质量监控',icon:'shield-alert',href:'质量监控.html'},\n        {id:'tracking-detail',label:'明细排查',icon:'list-filter',href:'明细排查.html'},\n        {id:'tracking-analysis',label:'数据分析',icon:'chart-column-increasing',href:'数据分析.html'},\n        {id:'tracking-dashboards',label:'资产沉淀',icon:'panels-top-left',href:'资产沉淀.html'},\n        {id:'tracking-insights',label:'决策复盘',icon:'lightbulb',href:'决策复盘.html'}\n      ]}\n    ];\n    const currentRoute = 'package-order';\n    let governanceExpanded = false;\n    function navLink(item, child=false) {\n      const active = item.id === currentRoute;\n      return `<a href=\"${item.href || 'index.html'}\" class=\"menu-link ${active?'active-leaf':''} w-full px-2 flex items-center gap-3 text-left mb-1\" ${active?'aria-current=\"page\"':''} title=\"${item.label}\">${child?'':`<i data-lucide=\"${item.icon}\" class=\"menu-icon\"></i>`}<span class=\"menu-label flex-1\">${item.label}</span></a>`;\n    }\n    function renderSidebar() {\n      document.getElementById('sidebarNav').innerHTML = navSections.map(section=>`<div class=\"section-label\" aria-hidden=\"true\">${section.label}</div>${section.items.map(item=>item.group?`<div class=\"mb-1\"><button type=\"button\" data-group-toggle class=\"menu-link w-full px-2 flex items-center gap-3 text-left\" aria-expanded=\"${governanceExpanded}\" aria-controls=\"submenu-governance\"><i data-lucide=\"${item.icon}\" class=\"menu-icon\"></i><span class=\"menu-label flex-1\">${item.label}</span><i data-lucide=\"chevron-down\" class=\"group-chevron w-4 h-4\"></i></button><div id=\"submenu-governance\" class=\"submenu ${governanceExpanded?'':'is-collapsed'}\">${item.children.map(child=>navLink(child,true)).join('')}</div></div>`:navLink(item)).join('')}`).join('');\n      document.querySelector('[data-group-toggle]').onclick = event = :59',channel:'企业网银',transaction:'EBANK****1418',source:'Web 控制台',attempts:1,error:'',refundId:'',versionNo:7},\n      {id:'PKG202608070009',subjectType:'PERSONAL',subject:'程念初',subjectCode:'cheng***@mail.com',type:'NEW',package:'个人专业版',version:'v3.1',env:10,seats:1,duration:12,benefits:['10 个云端环境','基础自动化','数据同步'],amount:799,payment:'PAID',fulfillment:'FULFILLED',created:'2026-08-07 21:06:52',paid:'2026-08-07 21:07:39',effective:'2026-08-07 21:07:51',expires:'2027-08-07 21:07:51',channel:'支付宝',transaction:'20260807****8624',source:'PC 客户端',attempts:1,error:'',refundId:'',versionNo:3},\n      {id:'PKG202608060004',subjectType:'ENTERPRISE',subject:'厦门海图跨境贸易有限公司',subjectCode:'ENT-D5B281',type:'NEW',package:'企业协作版',version:'v2.5',env:40,seats:15,duration:12,benefits:['40 个云端环境','15 个成员席位','团队权限管理'],amount:5999,payment:'CLOSED',fulfillment:'NA',created:'2026-08-06 10:18:33',paid:'--',effective:'--',expires:'--',channel:'支付宝',transaction:'--',source:'Web 控制台',attempts:0,error:'支付超时自动关闭',refundId:'',versionNo:2}\n    ];\n\n    const paymentMeta = {\n      PENDING:['待支付','badge-warning'],PAID:['已支付','badge-success'],CLOSED:['已关闭','badge-neutral'],\n      REFUNDING:['退款中','badge-warning'],REFUNDED:['已退款','badge-neutral'],REFUND_FAILED:['退款失败','badge-danger']\n    };\n    const fulfillmentMeta = {\n      NA:['未开始','badge-neutral'],PENDING:['待履约','badge-warning'],PROCESSING:['履约中','badge-info'],FULFILLED:['已履约','badge-success'],\n      FAILED:['履约失败','badge-danger'],REVOKING:['回收中','badge-info'],REVOKED:['已回收','badge-neutral'],REVOKE_FAILED:['回收失败','badge-danger']\n    };\n    const tabItems = [\n      ['all','全部'],['pendingPay','待支付'],['pendingFulfill','待履约'],['fulfilling','履约中'],['fulfilled','已履约'],['refunding','退款中'],['refunded','已退款'],['closed','已关闭']\n    ];\n    let activeTab='all', appliedFilters={}, currentPage=1, pageSize=10, pageState='normal', selectedOrder=null, activeAction=null, submitting=false;\n\n    // -------------------- 状态与筛选 --------------------\n    function matchTab(order, tab=activeTab) {\n      const rules={\n        all:()=>true,\n        pendingPay:o=>o.payment==='PENDING',\n        pendingFulfill:o=>o.payment==='PAID'&&o.fulfillment==='PENDING',\n        fulfilling:o=>o.fulfillment==='PROCESSING'||o.fulfillment==='REVOKING',\n        fulfilled:o=>o.payment==='PAID'&&o.fulfillment==='FULFILLED',\n        refunding:o=>o.payment==='REFUNDING',\n        refunded:o=>o.payment==='REFUNDED',\n        closed:o=>o.payment==='CLOSED'\n      };\n      return rules[tab](order);\n    }\n    function collectFilters() {\n      return {\n        keyword:document.getElementById('keyword').value.trim().toLowerCase(),\n        subjectType:document.getElementById('subjectType').value,\n        orderType:document.getElementById('orderType').value,\n        packageName:document.getElementById('packageName').value,\n        paymentStatus:document.getElementById('paymentStatus').value,\n        fulfillmentStatus:document.getElementById('fulfillmentStatus').value,\n        startDate:document.getElementById('startDate').value,\n        endDate:document.getElementById('endDate').value\n      };\n    }\n    function getFilteredOrders() {\n      const f=appliedFilters;\n      return orders.filter(order=>matchTab(order)\n        &&(!f.keyword||(order.id+order.subject+order.subjectCode).toLowerCase().includes(f.keyword))\n        &&(!f.subjectType||order.subjectType===f.subjectType)\n        &&(!f.orderType||order.type===f.orderType)\n        &&(!f.packageName||order.package===f.packageName)\n        &&(!f.paymentStatus||order.payment===f.paymentStatus)\n        &&(!f.fulfillmentStatus||order.fulfillment===f.fulfillmentStatus)\n        &&(!f.startDate||order.created.slice(0,10)>=f.startDate)\n        &&(!f.endDate||order.created.slice(0,10)<=f.endDate));\n    }\n    function renderTabs() {\n      document.getElementById('statusTabs').innerHTML=tabItems.map(([key,label])=>`<button type=\"button\" class=\"tab ${activeTab===key?'active':''}\" data-tab=\"${key}\" role=\"tab\" aria-selected=\"${activeTab===key}\">${label}<span class=\"tab-count\">${orders.filter(order=>matchTab(order,key)).length}</span></button>`).join('');\n    }\n    function statusBadge(kind,value) {\n      const meta=(kind==='payment'?paymentMeta:fulfillmentMeta)[value]||['未知','badge-neutral'];\n      return `<span class=\"badge ${meta[1]}\">${meta[0]}</span>`;\n    }\n    function allowedActions(order) {\n      const actions=[];\n      if(order.payment==='PENDING') actions.push('close');\n      if(order.payment==='PAID'&&(order.fulfillment==='PENDING'||order.fulfillment==='FAILED')) actions.push('fulfill');\n      if(order.payment==='PAID'&&order.fulfillment==='FULFILLED') actions.push('refund');\n      if(order.payment==='REFUND_FAILED') actions.push('retryRefund');\n      if(order.payment==='REFUNDED'&&order.fulfillment==='REVOKE_FAILED') actions.push('retryRevoke');\n      return actions;\n    }\n    const actionLabels={close:'关闭订单',fulfill:'重试履约',refund:'发起退款',retryRefund:'重试退款',retryRevoke:'重试回收'};\n\n    // -------------------- 列表与分页 --------------------\n    function renderPage() {\n      renderTabs();\n      if(pageState==='loading') return renderLoading();\n      if(pageState==='error') return renderState('订单列表加载失败','筛选条件已保留，请重新加载。','rotate-cw','重新加载');\n      if(pageState==='forbidden') return renderState('暂无查看权限','当前账号缺少套餐订单查看权限。','shield-ban','返回系统框架');\n      if(pageState==='empty') return renderState('暂无套餐订单','套餐订单产生后将在此展示。','package-open','恢复演示数据');\n      const data=getFilteredOrders();\n      if(!data.length) return renderState('未找到匹配订单','请调整筛选条件后重新查询。','search-x','重置筛选',true);\n      const totalPages=Math.max(1,Math.ceil(data.length/pageSize));\n      currentPage=Math.min(currentPage,totalPages);\n      const rows=data.slice((currentPage-1)*pageSize,currentPage*pageSize);\n      document.getElementById('resultSummary').textContent=`共 ${data.length} 条`;\n      const exceptionCount=data.filter(order=>['FAILED','REVOKE_FAILED'].includes(order.fulfillment)||order.payment==='REFUND_FAILED').length;\n      const hint=document.getElementById('exceptionHint');\n      hint.classList.toggle('hidden',exceptionCount===0);hint.classList.toggle('flex',exceptionCount>0);\n      if(exceptionCount) hint.querySelector('span').textContent=`${exceptionCount} 笔异常待处理`;\n      document.getElementById('tableContainer').innerHTML=`<table class=\"data-table\" aria-label=\"套餐订单列表\"><colgroup><col style=\"width:164px\"><col style=\"width:210px\"><col style=\"width:74px\"><col style=\"width:230px\"><col style=\"width:100px\"><col style=\"width:90px\"><col style=\"width:100px\"><col style=\"width:168px\"><col style=\"width:160px\"></colgroup><thead><tr><th>套餐订单号</th><th>购买主体</th><th>类型</th><th>套餐快照</th><th>实付金额</th><th data-anno=\"9\">支付状态</th><th>履约状态</th><th>创建 / 支付时间</th><th>操作</th></tr></thead><tbody>${rows.map((order,index)=>renderRow(order,index)).join('')}</tbody></table>`;\n      renderPager(data.length,totalPages);\n      bindTableEvents();\n      lucide.createIcons();\n      requestAnimationFrame(renderAnnoBadges);\n    }\n    function renderRow(order,index) {\n      const actions=allowedActions(order);\n      return `<tr><td><button ${index===0?'data-anno=\"10\"':''} class=\"order-link text-primary hover:text-primary-hover mono font-medium\" data-id=\"${order.id}\">${order.id}</button><button class=\"copy-order ml-1 text-ink-muted hover:text-primary\" data-id=\"${order.id}\" title=\"复制订单号\" aria-label=\"复制订单号\"><i data-lucide=\"copy\" class=\"w-3.5 h-3.5\"></i></button></td><td><span class=\"cell-ellipsis font-medium text-ink-title\" title=\"${order.subject}\">${order.subject}</span><span class=\"block mt-1 text-[11px] text-ink-muted mono\">${order.subjectCode} · ${order.subjectType==='PERSONAL'?'个人':'企业'}</span></td><td><span class=\"badge ${order.type==='NEW'?'badge-info':'badge-neutral'}\">${order.type==='NEW'?'新购':'续费'}</span></td><td><span class=\"cell-ellipsis font-medium text-ink-title\">${order.package} <span class=\"text-[11px] text-ink-muted mono\">${order.version}</span></span><span class=\"block mt-1 text-[11px] text-ink-muted mono\">${order.env} 环境 · ${order.seats} 席位 · ${order.duration} 个月</span></td><td class=\"mono font-medium text-ink-title\">¥${formatAmount(order.amount)}</td><td>${statusBadge('payment',order.payment)}</td><td>${statusBadge('fulfillment',order.fulfillment)}${order.error?`<button class=\"ml-1 text-danger\" title=\"${order.error}\" aria-label=\"查看失败原因\"><i data-lucide=\"circle-alert\" class=\"w-3.5 h-3.5\"></i></button>`:''}</td><td><span class=\"block mono text-[11px]\">${order.created}</span><span class=\"block mt-1 mono text-[11px] text-ink-muted\">${order.paid}</span></td><td><div ${index===0?'data-anno=\"11\"':''} class=\"flex items-center gap-3\"><button class=\"order-link text-primary hover:text-primary-hover\" data-id=\"${order.id}\">查看</button>${actions.slice(0,1).map(action=>`<button class=\"order-action ${action==='close'||action==='refund'?'text-danger':'text-primary'} hover:opacity-80\" data-action=\"${action}\" data-id=\"${order.id}\">${actionLabels[action]}</button>`).join('')}</div></td></tr>`;\n    }\n    function renderPager(total,totalPages) {\n      const pages=[];for(let i=1;i<=totalPages;i++) pages.push(i);\n      document.getElementById('pager').innerHTML=`<span class=\"mr-2 text-ink-sub\">共 <span class=\"mono\">${total}</span> 条</span><button class=\"pager-btn\" data-page=\"${currentPage-1}\" ${currentPage===1?'disabled':''} aria-label=\"上一页\"><i data-lucide=\"chevron-left\" class=\"w-4 h-4\"></i></button>${pages.map(page=>`<button class=\"pager-btn ${page===currentPage?'active':''}\" data-page=\"${page}\" aria-label=\"第 ${page} 页\">${page}</button>`).join('')}<button class=\"pager-btn\" data-page=\"${currentPage+1}\" ${currentPage===totalPages?'disabled':''} aria-label=\"下一页\"><i data-lucide=\"chevron-right\" class=\"w-4 h-4\"></i></button><select id=\"pageSize\" class=\"h-8 border border-line rounded px-2 bg-card\"><option value=\"10\" ${pageSize===10?'selected':''}>10 条/页</option><option value=\"20\" ${pageSize===20?'selected':''}>20 条/页</option><option value=\"50\" ${pageSize===50?'selected':''}>50 条/页</option></select><span class=\"ml-1 text-ink-sub\">跳至</span><input id=\"jumpPage\" class=\"w-12 h-8 border border-line rounded px-2 text-center mono\" inputmode=\"numeric\" aria-label=\"跳转页码\"><span class=\"text-ink-sub\">页</span>`;\n      document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{const next=Number(button.dataset.page);if(next>=1&&next<=totalPages){currentPage=next;renderPage();document.getElementById('tableContainer').scrollIntoView({behavior:'smooth',block:'start'})}});\n      document.getElementById('pageSize').onchange=event=>{pageSize=Number(event.target.value);currentPage=1;renderPage()};\n      document.getElementById('jumpPage').onkeydown=event=>{if(event.key==='Enter'){const next=Number(event.target.value);if(Number.isInteger(next)&&next>=1&&next<=totalPages){currentPage=next;renderPage()}else toast(`请输入 1-${totalPages} 的页码`,'warning')}};\n    }\n    function renderLoading() {\n      document.getElementById('resultSummary').textContent='加载中';document.getElementById('exceptionHint').classList.add('hidden');\n      document.getElementById('tableContainer').innerHTML=`<div class=\"py-2 space-y-2\">${Array.from({length:8},()=>'<div class=\"h-[54px] rounded skeleton\"></div>').join('')}</div>`;\n      document.getElementById('pager').innerHTML='';lucide.createIcons();renderAnnoBadges();\n    }\n    function renderState(title,desc,icon,action,filtered=false) {\n      document.getElementById('resultSummary').textContent='共 0 条';document.getElementById('exceptionHint').classList.add('hidden');\n      document.getElementById('tableContainer').innerHTML=`<div class=\"min-h-[430px] flex flex-col items-center justify-center text-center px-4\"><span class=\"w-14 h-14 rounded-lg bg-bg-page text-ink-muted flex items-center justify-center\"><i data-lucide=\"${icon}\" class=\"w-7 h-7\"></i></span><h3 class=\"mt-4 text-[16px] font-semibold text-ink-title\">${title}</h3><p class=\"mt-2 text-ink-sub\">${desc}</p><button id=\"stateRecover\" class=\"btn ${pageState==='forbidden'?'btn-default':'btn-primary'} mt-5\">${action}</button></div>`;\n      document.getElementById('pager').innerHTML='';document.getElementById('stateRecover').onclick=()=>{if(filtered) resetFilters();else if(pageState==='forbidden') location.href='index.html';else{pageState='normal';renderPage()}};lucide.createIcons();renderAnnoBadges();\n    }\n    function bindTableEvents() {\n      document.querySelectorAll('.order-link').forEach(button=>button.onclick=()=>openDrawer(button.dataset.id));\n      document.querySelectorAll('.copy-order').forEach(button=>button.onclick=()=>copyOrderId(button.dataset.id));\n      document.querySelectorAll('.order-action').forEach(button=>button.onclick=()=>openAction(button.dataset.action,button.dataset.id));\n    }\n    function formatAmount(value){return Number(value).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}\n\n    // -------------------- 详情抽屉 --------------------\n    function orderTimeline(order) {\n      const items=[['订单创建',order.created,'已保存套餐快照与购买主体'],['支付成功',order.paid,order.payment==='PENDING'||order.payment==='CLOSED'?'尚未确认支付结果':`${order.channel} · ${order.transaction}`]];\n      if(order.fulfillment!=='NA') items.push(['权益履约',order.effective==='--'?order.paid:order.effective,fulfillmentMeta[order.fulfillment][0]+(order.error?` · ${order.error}`:'')]);\n      if(order.refundId) items.push(['退款处理',order.created.slice(0,10)+' 20:18:06',`${order.refundId} · ${paymentMeta[order.payment][0]}`]);\n      return items.map(item=>`<div class=\"timeline-item\"><div class=\"flex items-start justify-between gap-4\"><strong class=\"text-ink-title\">${item[0]}</strong><span class=\"mono text-[11px] text-ink-muted\">${item[1]}</span></div><p class=\"mt-1 text-[12px] text-ink-sub\">${item[2]}</p></div>`).join('');\n    }\n    function detailSection(title,content,anno='') {return `<section class=\"mb-6\"><h3 ${anno?`data-anno=\"${anno}\"`:''} class=\"inline-block text-[16px] font-semibold text-ink-title mb-4\">${title}</h3>${content}</section>`}\n    function openDrawer(id) {\n      selectedOrder=orders.find(order=>order.id===id);if(!selectedOrder)return;\n      document.getElementById('drawerTitle').textContent=`套餐订单详情 · ${selectedOrder.id}`;\n      document.getElementById('drawerStatus').innerHTML=statusBadge('payment',selectedOrder.payment);\n      const info=`<div class=\"detail-grid\"><span class=\"detail-label\">订单号</span><span class=\"mono text-ink-title\">${selectedOrder.id} <button id=\"drawerCopy\" class=\"ml-1 text-primary\" title=\"复制订单号\"><i data-lucide=\"copy\" class=\"w-3.5 h-3.5 inline\"></i></button></span><span class=\"detail-label\">订单类型</span><span>${selectedOrder.type==='NEW'?'新购':'续费'}</span><span class=\"detail-label\">购买主体</span><span>${selectedOrder.subject}</span><span class=\"detail-label\">主体类型</span><span>${selectedOrder.subjectType==='PERSONAL'?'个人用户':'企业'}</span><span class=\"detail-label\">主体标识</span><span class=\"mono\">${selectedOrder.subjectCode}</span><span class=\"detail-label\">来源端</span><span>${selectedOrder.source}</span></div>`;\n      const snapshot=`<div class=\"rounded-lg bg-primary-subtle p-4\"><div class=\"flex flex-wrap items-start justify-between gap-3\"><div><strong class=\"text-ink-title\">${selectedOrder.package}</strong><span class=\"ml-2 mono text-[11px] text-ink-muted\">${selectedOrder.version}</span><p class=\"mt-1 text-[12px] text-ink-sub\">历史订单以本次下单快照为准，不跟随当前套餐配置变化。</p></div><span class=\"badge badge-info\">${selectedOrder.duration} 个月</span></div><div class=\"grid grid-cols-2 md:grid-cols-3 gap-3 mt-4\"><div class=\"bg-card rounded-md p-3\"><span class=\"text-[12px] text-ink-sub\">环境数</span><strong class=\"block mt-1 mono text-[16px] text-ink-title\">${selectedOrder.env}</strong></div><div class=\"bg-card rounded-md p-3\"><span class=\"text-[12px] text-ink-sub\">成员席位</span><strong class=\"block mt-1 mono text-[16px] text-ink-title\">${selectedOrder.seats}</strong></div><div class=\"bg-card rounded-md p-3\"><span class=\"text-[12px] text-ink-sub\">有效期</span><strong class=\"block mt-1 mono text-[16px] text-ink-title\">${selectedOrder.duration} 个月</strong></div></div><div class=\"mt-4 flex flex-wrap gap-2\">${selectedOrder.benefits.map(item=>`<span class=\"badge badge-neutral\">${item}</span>`).join('')}</div></div>`;\n      const payment=`<div class=\"detail-grid\"><span class=\"detail-label\">实付金额</span><span class=\"mono font-semibold text-ink-title\">¥${formatAmount(selectedOrder.amount)}</span><span class=\"detail-label\">支付状态</span><span>${statusBadge('payment',selectedOrder.payment)}</span><span class=\"detail-label\">支付方式</span><span>${selectedOrder.channel}</span><span class=\"detail-label\">支付流水</span><span class=\"mono\">${selectedOrder.transaction}</span><span class=\"detail-label\">支付时间</span><span class=\"mono\">${selectedOrder.paid}</span><span class=\"detail-label\">退款单号</span><span class=\"mono\">${selectedOrder.refundId||'--'}</span></div>`;\n      const fulfillment=`<div class=\"detail-grid\"><span class=\"detail-label\">履约状态</span><span>${statusBadge('fulfillment',selectedOrder.fulfillment)}</span><span class=\"detail-label\">尝试次数</span><span class=\"mono\">${selectedOrder.attempts}</span><span class=\"detail-label\">生效时间</span><span class=\"mono\">${selectedOrder.effective}</span><span class=\"detail-label\">到期时间</span><span class=\"mono\">${selectedOrder.expires}</span>${selectedOrder.error?`<span class=\"detail-label\">失败原因</span><span class=\"text-danger md:col-span-3\">${selectedOrder.error}</span>`:''}</div>`;\n      const audit=`<div class=\"overflow-x-auto\"><table class=\"w-full min-w-[600px] text-[12px]\"><thead><tr class=\"bg-bg-page text-ink-sub\"><th class=\"p-2 text-left\">时间</th><th class=\"p-2 text-left\">操作者</th><th class=\"p-2 text-left\">动作</th><th class=\"p-2 text-left\">结果</th></tr></thead><tbody><tr class=\"border-b border-line-lighter\"><td class=\"p-2 mono\">${selectedOrder.created}</td><td class=\"p-2\">系统</td><td class=\"p-2\">创建套餐订单</td><td class=\"p-2 text-success\">成功</td></tr>${selectedOrder.attempts?`<tr><td class=\"p-2 mono\">${selectedOrder.paid}</td><td class=\"p-2\">履约服务</td><td class=\"p-2\">按套餐快照授予权益</td><td class=\"p-2 ${selectedOrder.fulfillment==='FAILED'?'text-danger':'text-success'}\">${selectedOrder.fulfillment==='FAILED'?'失败':'已受理'}</td></tr>`:''}</tbody></table></div>`;\n      document.getElementById('drawerBody').innerHTML=detailSection('订单信息',info)+detailSection('套餐快照',snapshot,'14')+detailSection('支付与退款',payment)+detailSection('权益履约',fulfillment)+detailSection('状态时间线',`<div class=\"timeline\">${orderTimeline(selectedOrder)}</div>`,'15')+detailSection('操作记录',audit);\n      renderDrawerActions();\n      document.getElementById('drawerOverlay').classList.remove('hidden');pushAnnoScope(document.getElementById('drawerPanel'));\n      document.getElementById('drawerCopy').onclick=()=>copyOrderId(selectedOrder.id);\n      lucide.createIcons();requestAnimationFrame(renderAnnoBadges);document.getElementById('drawerClose').focus();\n    }\n    function renderDrawerActions() {\n      const actions=allowedActions(selectedOrder);\n      document.getElementById('drawerFooter').innerHTML=`<button type=\"button\" class=\"btn btn-default\" id=\"drawerBack\">关闭</button>${actions.map(action=>`<button type=\"button\" class=\"btn ${action==='close'||action==='refund'?'btn-danger':'btn-primary'} drawer-action\" data-action=\"${action}\">${actionLabels[action]}</button>`).join('')}`;\n      document.getElementById('drawerBack').onclick=closeDrawer;\n      document.querySelectorAll('.drawer-action').forEach(button=>button.onclick=()=>openAction(button.dataset.action,selectedOrder.id));\n    }\n    function closeDrawer() {document.getElementById('drawerOverlay').classList.add('hidden');popAnnoScope(document.getElementById('drawerPanel'));selectedOrder=null}\n\n    // -------------------- 操作弹窗 --------------------\n    function fieldError(id,message){return `<p id=\"${id}\" class=\"hidden mt-1 text-[12px] text-danger\">${message}</p>`}\n    function openAction(action,id) {\n      selectedOrder=orders.find(order=>order.id===id);activeAction=action;submitting=false;\n      const title={close:'关闭订单',fulfill:'重试权益履约',refund:'发起退款',retryRefund:'重试退款',retryRevoke:'重试权益回收'}[action];\n      document.getElementById('actionTitle').textContent=title;document.getElementById('actionConfirm').textContent=action==='refund'?'提交退款':action==='close'?'确认关闭':'确认重试';\n      document.getElementById('actionConfirm').className=`btn ${action==='close'||action==='refund'?'btn-danger':'btn-primary'}`;document.getElementById('actionConfirm').setAttribute('data-anno','19');\n      let body='';\n      if(action==='close') body=`<div class=\"rounded-md bg-warning-bg text-warning p-3 mb-5\">关闭后订单不可继续支付；若支付状态已变化，本次操作将被拒绝。</div><label class=\"block text-ink-title mb-2\" for=\"actionReason\"><span class=\"text-danger\">*</span> 关闭原因</label><select id=\"actionReason\" data-anno=\"18\" class=\"control !w-full\"><option value=\"\">请选择关闭原因</option><option>用户主动取消</option><option>订单信息有误</option><option>重复下单</option><option>其他</option></select>${fieldError('reasonError','请选择关闭原因')}<label class=\"block text-ink-title mt-4 mb-2\" for=\"actionRemark\">备注</label><textarea id=\"actionRemark\" class=\"control !w-full h-20\" maxlength=\"200\" placeholder=\"选填，最多 200 字\"></textarea>`;\n      if(action==='fulfill') body=`<div class=\"rounded-md bg-info-bg text-info p-3\">系统将按下单时套餐快照重试授予权益，重复请求不会重复增加额度。</div><div class=\"mt-5 detail-grid\"><span class=\"detail-label\">订单号</span><span class=\"mono\">${selectedOrder.id}</span><span class=\"detail-label\">套餐快照</span><span>${selectedOrder.package} ${selectedOrder.version}</span><span class=\"detail-label\">目标权益</span><span>${selectedOrder.env} 环境 · ${selectedOrder.seats} 席位 · ${selectedOrder.duration} 个月</span><span class=\"detail-label\">上次失败</span><span class=\"text-danger\">${selectedOrder.error||'--'}</span></div>`;\n      if(action==='refund') body=`<div class=\"rounded-md bg-danger-bg text-danger p-3 mb-5\">退款将原路退回，并回收本订单授予的套餐权益。提交前请确认主体资源可回收。</div><label class=\"block text-ink-title mb-2\" for=\"refundAmount\">退款金额</label><div id=\"refundAmount\" class=\"h-8 px-3 flex items-center rounded bg-bg-page mono font-semibold\">¥${formatAmount(selectedOrder.amount)}（全额，只读）</div><label class=\"block text-ink-title mt-4 mb-2\" for=\"actionReason\"><span class=\"text-danger\">*</span> 退款原因</label><select id=\"actionReason\" data-anno=\"18\" class=\"control !w-full\"><option value=\"\">请选择退款原因</option><option>用户误购</option><option>服务未达预期</option><option>重复购买</option><option>其他</option></select>${fieldError('reasonError','请选择退款原因')}<label class=\"block text-ink-title mt-4 mb-2\" for=\"actionRemark\">备注</label><textarea id=\"actionRemark\" class=\"control !w-full h-20\" maxlength=\"200\" placeholder=\"选填，最多 200 字\"></textarea>`;\n      if(action==='retryRefund') body=`<div class=\"rounded-md bg-warning-bg text-warning p-3\">上次退款失败，重试将复用原退款单，不会重复创建退款金额。</div><div class=\"mt-5 detail-grid\"><span class=\"detail-label\">退款单号</span><span class=\"mono\">${selectedOrder.refundId}</span><span class=\"detail-label\">退款金额</span><span class=\"mono\">¥${formatAmount(selectedOrder.amount)}</span><span class=\"detail-label\">失败原因</span><span class=\"text-danger\">${selectedOrder.error}</span></div>`;\n      if(action==='retryRevoke') body=`<div class=\"rounded-md bg-danger-bg text-danger p-3\">资金已原路退回，但权益尚未完全回收。请先处理占用资源，再重试回收。</div><div class=\"mt-5 detail-grid\"><span class=\"detail-label\">退款单号</span><span class=\"mono\">${selectedOrder.refundId}</span><span class=\"detail-label\">待回收权益</span><span>${selectedOrder.env} 环境 · ${selectedOrder.seats} 席位</span><span class=\"detail-label\">失败原因</span><span class=\"text-danger\">${selectedOrder.error}</span></div>`;\n      document.getElementById('actionBody').innerHTML=body;document.getElementById('actionModal').classList.remove('hidden');pushAnnoScope(document.getElementById('actionPanel'));lucide.createIcons();requestAnimationFrame(renderAnnoBadges);document.getElementById('actionClose').focus();\n    }\n    function closeAction(){if(submitting)return;document.getElementById('actionModal').classList.add('hidden');popAnnoScope(document.getElementById('actionPanel'));activeAction=null}\n    function submitAction(event) {\n      event.preventDefault();if(submitting||!selectedOrder||!activeAction)return;\n      const reason=document.getElementById('actionReason');\n      if(reason&&!reason.value){document.getElementById('reasonError').classList.remove('hidden');reason.focus();return}\n      submitting=true;const button=document.getElementById('actionConfirm');const original=button.textContent;button.disabled=true;button.innerHTML='<span class=\"w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin\"></span>提交中';\n      setTimeout(()=>{\n        if(activeAction==='close'){selectedOrder.payment='CLOSED';selectedOrder.fulfillment='NA';selectedOrder.error=reason.value;toast('订单已关闭','success')}\n        if(activeAction==='fulfill'){selectedOrder.fulfillment='PROCESSING';selectedOrder.error='';selectedOrder.attempts+=1;toast('履约任务已提交','success')}\n        if(activeAction==='refund'){selectedOrder.payment='REFUNDING';selectedOrder.refundId=`RF${Date.now().toString().slice(-12)}`;toast('退款申请已提交','success')}\n        if(activeAction==='retryRefund'){selectedOrder.payment='REFUNDING';selectedOrder.error='';toast('退款重试已提交','success')}\n        if(activeAction==='retryRevoke'){selectedOrder.fulfillment='REVOKING';selectedOrder.error='';toast('权益回收任务已提交','success')}\n        submitting=false;button.disabled=false;button.textContent=original;document.getElementById('actionModal').classList.add('hidden');popAnnoSco         { id: 'tracking-quality', label: '质量监控', icon: 'shield-alert', module: 'tracking-quality', description: '监控数据完整性、准确性和稳定性' },
        { id: 'tracking-detail', label: '明细排查', icon: 'list-filter', module: 'tracking-detail', description: '检索脱敏明细并定位数据问题' },
        { id: 'tracking-analysis', label: '数据分析', icon: 'chart-column-increasing', module: 'tracking-analysis', description: '开展漏斗、留存、路径和分群分析' },
        { id: 'tracking-dashboards', label: '资产沉淀', icon: 'panels-top-left', module: 'tracking-dashboards', description: '沉淀可复用看板和分析资产' },
        { id: 'tracking-insights', label: '决策复盘', icon: 'lightbulb', module: 'tracking-insights', description: '记录洞察、行动和迭代效果' }
      ]
    }
  ];

  const legacyRoutes = {
    'index.html': 'home',
    '系统框架.html': 'home',
    '用户统计.html': 'user-statistics',
    '团队列表.html': 'team-list',
    '企业列表.html': 'enterprise-list',
    '成员列表.html': 'member-list',
    '订单列表.html': 'order-list',
    '套餐订单.html': 'package-order',
    '发票管理.html': 'invoice-management',
    '环境管理.html': 'environment-management',
    '数据概览.html': 'tracking-overview',
    '事件管理.html': 'tracking-events',
    '指标管理.html': 'tracking-metrics',
    '联调验证.html': 'tracking-debug',
    '质量监控.html': 'tracking-quality',
    '明细排查.html': 'tracking-detail',
    '数据分析.html': 'tracking-analysis',
    '资产沉淀.html': 'tracking-dashboards',
    '决策复盘.html': 'tracking-insights'
  };

  const notices = [
    { title: '质量监控待处理', desc: 'browser_start_success 事件成功率低于阈值。', time: '5 分钟前', unread: true },
    { title: '指标口径待确认', desc: '代理购买转化率 V2 草案等待审核。', time: '今天 09:30', unread: true },
    { title: '历史数据补偿完成', desc: '2026-08-10 PC 端缺失事件已完成回补。', time: '昨天 18:20', unread: false }
  ];

  const routes = new Map();
  const routeParents = new Map();
  navigation.forEach((section) => {
    section.items.forEach((item) => {
      routes.set(item.id, { ...item, section: section.label });
      if (item.children) {
        item.children.forEach((child) => {
          routes.set(child.id, { ...child, section: section.label, parentLabel: item.label });
          routeParents.set(child.id, item.id);
        });
      }
    });
  });

  const $ = (id) => document.getElementById(id);
  const outlet = $('appRouteOutlet');
  const content = $('appContent');
  const sidebar = $('appSidebar');
  let currentRoute = resolveRoute(INLINE_ROUTE || decodeURIComponent(location.hash.slice(1)) || 'home');
  let groupState = readJson(GROUP_STATE_KEY, { 'tracking-governance': true });
  let moduleReady = false;
  let reloadScheduled = false;

  function readJson(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? { ...fallback, ...JSON.parse(value) } : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function writeJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
  }

  function resolveRoute(routeId) {
    const route = routes.get(routeId);
    if (!route) return routes.get('home');
    if (route.group) return routes.get(route.children[0].id);
    return route;
  }

  function routeHref(routeId, search = '') {
    const file = ROUTE_FILES[routeId] || APP_ENTRY;
    const inPrototype = /\/Prototype\//.test(location.pathname);
    const target = routeId === 'home' ? (inPrototype ? '../index.html' : 'index.html') : (inPrototype ? file : 'Prototype/' + file);
    return target + (search || '');
  }

  function icon(name, className = 'app-menu-icon') {
    return `<i data-lucide="${name}" class="${className}"></i>`;
  }

  function renderNavigation() {
    const activeParent = routeParents.get(currentRoute.id);
    $('appPrimaryNav').innerHTML = navigation.map((section) => {
      const items = section.items.map((item) => {
        if (!item.group) {
          const active = item.id === currentRoute.id;
          return `<a class="app-menu-link${active ? ' is-active' : ''}" href="${routeHref(item.id)}" data-app-route="${item.id}" ${active ? 'aria-current="page"' : ''}>${icon(item.icon)}<span class="app-menu-label">${item.label}</span></a>`;
        }
        const active = activeParent === item.id;
        const expanded = groupState[item.id] !== false;
        return `<div class="app-menu-group"><button class="app-menu-link app-group-toggle${active ? ' is-group-active' : ''}" type="button" data-app-group="${item.id}" aria-expanded="${expanded}" aria-controls="app-submenu-${item.id}">${icon(item.icon)}<span class="app-menu-label">${item.label}</span>${icon('chevron-down', 'app-group-chevron')}</button><div id="app-submenu-${item.id}" class="app-submenu${expanded ? '' : ' is-collapsed'}">${item.children.map((child) => {
          const childActive = child.id === currentRoute.id;
          return `<a class="app-menu-link${childActive ? ' is-active' : ''}" href="${routeHref(child.id)}" data-app-route="${child.id}" ${childActive ? 'aria-current="page"' : ''}><span class="app-menu-label">${child.label}</span></a>`;
        }).join('')}</div></div>`;
      }).join('');
      return `<div class="app-section-label">${section.label}</div>${items}`;
    }).join('');
    window.lucide?.createIcons();
  }

  function renderRouteTitle() {
    document.title = `云登后台 · ${currentRoute.label}`;
  }

  function setSidebarCompact(compact) {
    sidebar.classList.toggle('is-compact', compact);
    $('appCollapseButton').setAttribute('aria-label', compact ? '展开侧栏' : '收起侧栏');
    $('appCollapseButton').setAttribute('title', compact ? '展开侧栏' : '收起侧栏');
    $('appCollapseButton').setAttribute('aria-expanded', String(!compact));
    try { localStorage.setItem(SIDEBAR_STATE_KEY, String(compact)); } catch (_) {}
    window.lucide?.createIcons();
  }

  function readSidebarCompact() {
    if (innerWidth < 768) return false;
    try {
      const saved = localStorage.getItem(SIDEBAR_STATE_KEY);
      return saved === null ? innerWidth < 1100 : saved === 'true';
    } catch (_) {
      return innerWidth < 1100;
    }
  }

  function openMobileSidebar() {
    sidebar.classList.add('is-mobile-open');
    $('appMobileOverlay').hidden = false;
    $('appMobileMenu').setAttribute('aria-expanded', 'true');
  }

  function closeMobileSidebar() {
    sidebar.classList.remove('is-mobile-open');
    $('appMobileOverlay').hidden = true;
    $('appMobileMenu').setAttribute('aria-expanded', 'false');
  }

  function renderCompactFlyout(groupId, trigger) {
    const group = routes.get(groupId);
    const flyout = $('appCompactFlyout');
    const rect = trigger.getBoundingClientRect();
    flyout.style.top = `${Math.min(innerHeight - 120, Math.max(60, rect.top))}px`;
    flyout.innerHTML = group.children.map((child) => `<a class="app-menu-link${child.id === currentRoute.id ? ' is-active' : ''}" href="${routeHref(child.id)}" data-app-route="${child.id}"><span class="app-menu-label">${child.label}</span></a>`).join('');
    flyout.hidden = false;
  }

  function closeCompactFlyout() { $('appCompactFlyout').hidden = true; }

  function renderNotices() {
    $('appNoticeList').innerHTML = notices.map((item) => `<button type="button" class="app-notice-item"><span class="app-notice-item-dot${item.unread ? '' : ' is-read'}"></span><span class="min-w-0"><span class="app-notice-title">${item.title}</span><span class="app-notice-desc block">${item.desc}</span><span class="app-notice-time mono block">${item.time}</span></span></button>`).join('');
  }

  function togglePopover(id) {
    ['appNoticePopover', 'appAccountPopover'].forEach((popoverId) => {
      if (popoverId !== id) $(popoverId).hidden = true;
    });
    $(id).hidden = !$(id).hidden;
  }

  function closePopovers() {
    $('appNoticePopover').hidden = true;
    $('appAccountPopover').hidden = true;
  }

  function toast(message) {
    const element = document.createElement('div');
    element.className = 'app-toast';
    element.textContent = message;
    $('appToastContainer').append(element);
    setTimeout(() => element.remove(), 2600);
  }

  function moduleStateKey(routeId) { return `${MODULE_STATE_PREFIX}${routeId}`; }

  function controlKey(element, index) {
    if (element.id) return `id:${element.id}`;
    if (element.name) return `name:${element.name}:${index}`;
    return `index:${index}`;
  }

  function activeKey(element, index) {
    if (element.id) return `id:${element.id}`;
    for (const key of ['tab', 'view', 'page', 'status', 'mode', 'type']) {
      if (element.dataset[key] !== undefined) return `data-${key}:${element.dataset[key]}`;
    }
    return `text:${(element.textContent || '').trim()}:${index}`;
  }

  function captureModuleState() {
    if (!moduleReady || !currentRoute?.id) return;
    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file')
      .map((element, index) => ({
        key: controlKey(element, index),
        value: element.type === 'checkbox' || element.type === 'radio' ? element.checked : element.value,
        checked: element.type === 'checkbox' || element.type === 'radio'
      }));
    const active = [...outlet.querySelectorAll('.tab.active, .pg-btn.active, [role="tab"][aria-selected="true"], [data-view].active, [data-page].active')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => activeKey(element, index));
    const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => ({ key: element.id || `index:${index}`, top: element.scrollTop, left: element.scrollLeft }));
    const state = { controls, active, contentScroll: { top: content.scrollTop, left: content.scrollLeft }, scrollables, savedAt: Date.now() };
    try { sessionStorage.setItem(moduleStateKey(currentRoute.id), JSON.stringify(state)); } catch (_) {}
  }

  function restoreModuleState() {
    let state;
    try { state = JSON.parse(sessionStorage.getItem(moduleStateKey(currentRoute.id)) || 'null'); } catch (_) {}
    if (!state) return;

    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file');
    const controlMap = new Map(controls.map((element, index) => [controlKey(element, index), element]));
    state.controls?.forEach((entry) => {
      const element = controlMap.get(entry.key);
      if (!element) return;
      if (entry.checked) element.checked = Boolean(entry.value);
      else element.value = entry.value;
    });

    const activeElements = [...outlet.querySelectorAll('.tab, .pg-btn, [role="tab"], [data-view], [data-page]')]
      .filter((element) => !element.closest('.app-module-compat'));
    const activeMap = new Map(activeElements.map((element, index) => [activeKey(element, index), element]));
    state.active?.forEach((key) => {
      const element = activeMap.get(key);
      if (element && !element.classList.contains('active')) element.click();
    });

    requestAnimationFrame(() => {
      content.scrollTo(state.contentScroll || { top: 0, left: 0 });
      const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
        .filter((element) => !element.closest('.app-module-compat'));
      state.scrollables?.forEach((entry) => {
        const element = entry.key.startsWith('index:') ? scrollables[Number(entry.key.slice(6))] : document.getElementById(entry.key);
        element?.scrollTo({ top: entry.top, left: entry.left });
      });
    });
  }

  function loadScript(src, marker = 'resource') {
    const absolute = new URL(src, document.baseURI).href;
    const existing = [...document.scripts].find((script) => script.src === absolute);
    if (existing) {
      if (existing.dataset.loaded === 'true' || !existing.dataset.appDynamic) return Promise.resolve();
      return new Promise((resolve, reject) => {
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', reject, { once: true });
      });
    }
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.dataset.appDynamic = marker;
      script.addEventListener('load', () => { script.dataset.loaded = 'true'; resolve(); }, { once: true });
      script.addEventListener('error', () => reject(new Error(`无法加载脚本：${src}`)), { once: true });
      document.head.append(script);
    });
  }

  function moduleResource(src) {
    return /^(?:[a-z]+:|\/|data:)/i.test(src) ? src : `${RESOURCE_ROOT}${src}`;
  }

  function loadStyle(href) {
    const resourceHref = /^(?:[a-z]+:|\/|data:)/i.test(href) ? href : `${RESOURCE_ROOT}${href}`;
    const absolute = new URL(resourceHref, document.baseURI).href;
    if ([...document.styleSheets].some((sheet) => sheet.href === absolute)) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = resourceHref;
    link.dataset.appModuleStyle = currentRoute.id;
    document.head.append(link);
  }

  function runInlineScript(source, index) {
    const script = document.createElement('script');
    script.dataset.appModuleScript = `${currentRoute.id}:${index}`;
    script.textContent = `${source}\n//# sourceURL=yundeng-module-${currentRoute.id}-${index}.js`;
    document.body.append(script);
  }

  function disableInvoiceAnnotations(route) {
    if (route.id !== 'invoice-management') return;
    const moduleRoot = outlet.querySelector('[data-module-root="invoice-management"]');
    if (!moduleRoot) return;
    const toggle = moduleRoot.querySelector('#invoiceAnnoToggle');
    const popup = moduleRoot.querySelector('#invoiceAnnoPopup');
    const layer = moduleRoot.querySelector('#invoiceAnnoLayer');
    if (toggle) {
      toggle.remove();
    }
    if (popup) {
      popup.remove();
    }
    if (layer) {
      layer.replaceChildren();
      layer.hidden = true;
      layer.setAttribute('aria-hidden', 'true');
    }
    const stripAnchors = () => moduleRoot.querySelectorAll('[data-anno]').forEach((element) => element.removeAttribute('data-anno'));
    stripAnchors();
    const anchorObserver = new MutationObserver(stripAnchors);
    anchorObserver.observe(moduleRoot, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-anno'] });
  }

  function rewriteLegacyLink(anchor) {
    const raw = anchor.getAttribute('href');
    if (!raw || raw.startsWith('#') || /^(javascript:|mailto:|tel:)/i.test(raw)) return;
    let url;
    try { url = new URL(raw, document.baseURI); } catch (_) { return; }
    if (url.origin !== location.origin && location.protocol !== 'file:') return;
    const file = decodeURIComponent(url.pathname.split('/').pop() || '');
    let routeId = legacyRoutes[file];
    if ((file === '系统框架.html' || file === 'index.html') && url.hash) routeId = decodeURIComponent(url.hash.slice(1));
    if (!routeId) return;
    anchor.href = routeHref(routeId, url.search);
    anchor.dataset.appRoute = routeId;
  }

  function rewriteLegacyLinks(root = outlet) {
    root.querySelectorAll?.('a[href]').forEach(rewriteLegacyLink);
  }

  async function loadModule(route) {
    outlet.innerHTML = '<div class="app-route-loading" role="status"><div><span class="app-spinner"></span><span>正在加载业务模块</span></div></div>';
    if (!route.module) {
      renderPlanning(route);
      return;
    }

    const bundle = INLINE_BUNDLE && INLINE_BUNDLE.id === route.module ? INLINE_BUNDLE : null;
    if (!bundle) throw new Error(`当前页面未内嵌模块：${route.module}`);

    bundle.styleLinks.forEach(loadStyle);
    bundle.styles.forEach((css, index) => {
      const style = document.createElement('style');
      style.dataset.appModuleStyle = `${route.id}:${index}`;
      style.textContent = css;
      document.head.append(style);
    });

    // Page-local dependencies are embedded in this HTML file.

    outlet.innerHTML = bundle.html;
    rewriteLegacyLinks();
    const observer = new MutationObserver((records) => {
      records.forEach((record) => record.addedNodes.forEach((node) => {
        if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.matches?.('a[href]')) rewriteLegacyLink(node);
          rewriteLegacyLinks(node);
        }
      }));
    });
    observer.observe(outlet, { childList: true, subtree: true });

    window.lucide?.createIcons();
    bundle.scripts.forEach(runInlineScript);
    window.lucide?.createIcons();
    disableInvoiceAnnotations(route);
    moduleReady = true;
    restoreModuleState();
  }

  function renderPlanning(route) {
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('calendar-clock', 'w-6 h-6')}</span><h1>${route.label}</h1><p>${route.description}。该模块已纳入统一系统框架，目前保留稳定路由入口，业务内容将在后续里程碑中开发。</p></div></div></section>`;
    window.lucide?.createIcons();
    moduleReady = true;
  }

  function renderLoadError(error) {
    console.error(error);
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('triangle-alert', 'w-6 h-6')}</span><h1>模块加载失败</h1><p>${String(error.message || error)}</p><button type="button" class="app-account-action mt-4 justify-center" id="appRetryModule">重新加载</button></div></div></section>`;
    $('appRetryModule')?.addEventListener('click', () => location.reload());
    window.lucide?.createIcons();
  }

  function navigate(routeId) {
    const target = resolveRoute(routeId);
    captureModuleState();
    closeMobileSidebar();
    closeCompactFlyout();
    if (target.id === currentRoute.id) {
      content.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    location.assign(routeHref(target.id, location.search));
  }

  function scheduleReload() {
    if (reloadScheduled) return;
    reloadScheduled = true;
    captureModuleState();
    location.reload();
  }

  function bindEvents() {
    $('appCollapseButton').addEventListener('click', () => setSidebarCompact(!sidebar.classList.contains('is-compact')));
    $('appMobileMenu').addEventListener('click', openMobileSidebar);
    $('appMobileOverlay').addEventListener('click', closeMobileSidebar);
    $('appNoticeButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appNoticePopover'); });
    $('appAccountButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appAccountPopover'); });
    $('appReadAll').addEventListener('click', () => { notices.forEach((item) => { item.unread = false; }); renderNotices(); $('appNoticeDot').hidden = true; toast('通知已全部标记为已读'); });

    document.addEventListener('click', (event) => {
      const routeLink = event.target.closest('[data-app-route]');
      if (routeLink) {
        event.preventDefault();
        navigate(routeLink.dataset.appRoute);
        return;
      }
      const groupButton = event.target.closest('[data-app-group]');
      if (groupButton) {
        const groupId = groupButton.dataset.appGroup;
        if (sidebar.classList.contains('is-compact') && innerWidth >= 768) {
          renderCompactFlyout(groupId, groupButton);
        } else {
          groupState[groupId] = groupButton.getAttribute('aria-expanded') !== 'true';
          writeJson(GROUP_STATE_KEY, groupState);
          renderNavigation();
        }
        return;
      }
      if (!event.target.closest('.app-popover, #appNoticeButton, #appAccountButton')) closePopovers();
      if (!event.target.closest('#appCompactFlyout, [data-app-group]')) closeCompactFlyout();
      const globalAction = event.target.closest('[data-app-global-action]');
      if (globalAction) toast(`${globalAction.textContent.trim()}将在对应功能模块开放`);
    });

    window.addEventListener('hashchange', scheduleReload);
    window.addEventListener('popstate', scheduleReload);
    window.addEventListener('pagehide', captureModuleState);
    window.addEventListener('beforeunload', captureModuleState);
    window.addEventListener('resize', () => {
      if (innerWidth >= 768) closeMobileSidebar();
      closeCompactFlyout();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      closePopovers();
      closeCompactFlyout();
      closeMobileSidebar();
    });
  }

  async function init() {
    if (!location.hash || !routes.has(decodeURIComponent(location.hash.slice(1)))) {
      history.replaceState(null, '', `${location.pathname}${location.search}#${currentRoute.id}`);
    } else if (routes.get(decodeURIComponent(location.hash.slice(1)))?.group) {
      history.replaceState(null, '', `${location.pathname}${location.search}#${currentRoute.id}`);
    }
    setSidebarCompact(readSidebarCompact());
    document.body.dataset.appRoute = currentRoute.id;
    renderNavigation();
    renderRouteTitle();
    renderNotices();
    bindEvents();
    window.lucide?.createIcons();
    try { await loadModule(currentRoute); } catch (error) { renderLoadError(error); }
  }

  window.YundengAppShell = {
    navigation,
    legacyRoutes,
    navigate,
    captureModuleState,
    routeHref
  };

  init();
})();
</script>
</body>
