body {

.app-link-button { border: 0; background: transparent; color: #0066ff; cursor: pointer; }
.app-notice-item { display: flex; width: 100%; gap: 8px; padding: 12px 16px; border: 0; border-bottom: 1px solid #f0f1f3; background: #fff; text-align: left; cursor: pointer; }
.app-notice-item:hover { background: #f3f4f6; }
.app-notice-item-dot { width: 8px; height: 8px; flex: 0 0 8px; margin-top: 6px; border-radius: 50%; background: #0066ff; }

@media (min-width: 768px) {

hite rounded-lg shadow-xl p-5\" ><h2 class=\"text-[16px] font-semibold\">发起效果复盘</h2><div class=\"mt-4 grid grid-cols-3 gap-3\"><div class=\"p-3 bg-bg-page rounded\"><div class=\"text-ink-sub\">基线</div><div class=\"mono text-[18px] mt-1\">45.0%</div></div><div class=\"p-3 bg-bg-page rounded\"><div class=\"text-ink-sub\">目标</div><div class=\"mono text-[18px] mt-1\">50.0%</div></div><div class=\"p-3 bg-success-bg rounded\"><div class=\"text-success\">实际</div><div class=\"mono text-[18px] mt-1 text-success\">52.4%</div></div></div><label class=\"block mt-4\">复盘结论<textarea id=\"reviewConclusion\" class=\"control w-full h-24 py-2 mt-1\" placeholder=\"说明结果、限制和后续行动\"></textarea></label><div class=\"mt-2 text-warning\">不得仅凭指标同向变化宣称因果；需注明实验、同期对照与外部干扰。</div><div class=\"flex justify-end gap-2 mt-5\"><button id=\"reviewCancel\" class=\"btn btn-default\">取消</button><button id=\"reviewConfirm\" class=\"btn btn-primary\">完成复盘</button></div></section></div><div id=\"toast\" class=\"hidden fixed top-4 left-1/2 -translate-x-1/2 z-[80] bg-ink-title text-white rounded px-4 py-2 shadow-lg\"></div><div id=\"annoDesc\" class=\"p-5\"></div></div></div><div class=\"app-module-compat\" hidden aria-hidden=\"true\"><aside id=\"sidebar\" class=\"sidebar bg-white shrink-0\"></aside><header class=\"h-14 bg-white shadow-sm flex items-center px-5\"><span class=\"text-ink-sub\">数据埋点 / </span><strong class=\"ml-1 text-ink-title\">决策复盘</strong><span class=\"ml-auto text-ink-sub\">数据管理员</span></header></div></section>","styles":["*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#3A3F4A}.mono{font-family:'JetBrains Mono',monospace}.sidebar{width:220px}.control{height:32px;border:1px solid #DFE1E5;border-radius:4px;padding:0 8px;background:#fff;outline:none}.control:focus{border-color:#0066FF;box-shadow:0 0 0 2px rgba(0,102,255,.12)}.btn{height:32px;padding:0 14px;border-radius:4px;font-weight:500}.btn-primary{background:#0066FF;color:#fff}.btn-default{border:1px solid #DFE1E5;background:#fff}.filter-flow{display:flex;flex-wrap:wrap;align-items:center;gap:16px 16px;max-width:2184px}.filter-item{display:flex;flex:0 0 500px;width:500px;align-items:center;gap:12px}.filter-label{width:88px;flex:none;text-align:right;color:#3A3F4A;line-height:18px}.filter-label::after{content:'：'}.filter-flow .control{width:400px;max-width:400px}.filter-actions{display:flex;flex:0 0 auto;align-items:center;gap:12px;min-height:32px}.tab{height:40px;padding:0 8px;border-bottom:2px solid transparent;color:#6E7685}.tab.active{color:#0066FF;border-color:#0066FF;font-weight:600}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th{padding:9px 12px;background:#F0F1F3;color:#6E7685;text-align:left;font-size:12px;white-space:nowrap}.data-table td{padding:10px 12px;border-bottom:1px solid #F0F1F3;white-space:nowrap}.data-table tr:hover{background:#F3F4F6}.badge{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:12px}.drawer{animation:slide .2s ease}@keyframes slide{from{transform:translateX(100%)}to{transform:none}}.anno-badge{position:fixed;width:20px;height:20px;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px 'JetBrains Mono';text-align:center;pointer-events:auto}.board-col{min-width:250px;background:#F7F8FA;border-radius:8px;padding:12px}.insight-card{background:#fff;border:1px solid #E8EAED;border-radius:6px;padding:12px;margin-top:10px}@media(max-width:1100px){.sidebar{width:68px}}@media(max-width:720px){.filter-item{flex:1 1 100%;width:100%}.filter-flow .control{width:calc(100% - 100px);max-width:none}}"],"styleLinks":[],"externalScripts":[],"scripts":["\nconst insights=[\n {id:'INS-202608-001',title:'企业认证提交后恢复启动率明显低于个人认证',scene:'实名认证',status:'已验证',evidence:'A',owner:'王敏',metric:'认证后恢复率',baseline:'45.0%',target:'50.0%',actual:'52.4%',actions:2,review:'08-18'},\n {id:'INS-202608-002',title:'代理商品页到支付页在企业用户中流失集中',scene:'代理购买',status:'执行中',evidence:'B',owner:'周方',metric:'代理购买转化率',baseline:'12.6%',target:'15.0%',actual:'—',actions:3,review:'08-25'},\n {id:'INS-202608-003',title:'首个环境创建完成是七日留存的强相关行为',scene:'新用户激活',status:'待验证',evidence:'C',owner:'李楠',metric:'7日留存率',baseline:'28.4%',target:'32.0%',actual:'—',actions:1,review:'09-01'},\n {id:'INS-202608-004',title:'代理检测失败后缺少可恢复路径',scene:'环境启动',status:'待复盘',evidence:'A',owner:'周方',metric:'启动成功率',baseline:'96.8%',target:'98.0%',actual:'98.3%',actions:2,review:'08-12'},\n {id:'INS-202608-005',title:'低频入口“批量导入模板”与帮助中心能力重复',scene:'新用户激活',status:'已完成',evidence:'B',owner:'王敏',metric:'入口使用率',baseline:'0.3%',target:'—',actual:'入口已下线',actions:2,review:'08-05'},\n {id:'INS-202608-006',title:'客户端 4.0.2.3 启动前置校验耗时偏高',scene:'环境启动',status:'执行中',evidence:'A',owner:'李楠',metric:'启动耗时 P95',baseline:'8.4s',target:'6.0s',actual:'—',actions:2,review:'08-22'},\n {id:'INS-202608-007',title:'认证引导弹窗二次曝光对提交率无明显提升',scene:'实名认证',status:'已验证',evidence:'B',owner:'王敏',metric:'认证提交率',baseline:'50.9%',target:'53.0%',actual:'51.1%',actions:1,review:'08-20'},\n {id:'INS-202608-008',title:'购买后 24 小时内绑定代理显著关联长期续费',scene:'代理购买',status:'待验证',evidence:'C',owner:'周方',metric:'30日续费率',baseline:'34.2%',target:'38.0%',actual:'—',actions:1,review:'09-05'}];\nlet tab='list',active=null,annoVisible=false,scope=[];const statusClass={'待验证':'bg-warning-bg text-warning','已验证':'bg-info-bg text-info','执行中':'bg-primary-bg text-primary','待复盘':'bg-danger-bg text-danger','已完成':'bg-success-bg text-success'};\nfunction filtered(){const q=search.value.trim().toLowerCase();return insights.filter(x=>(!q||(x.title+x.id).toLowerCase().includes(q))&&(!scene.value||x.scene===scene.value)&&(!status.value||x.status===status.value)&&(!owner.value||x.owner===owner.value))}\nfunction render(){tab==='list'?renderList():renderBoard();lucide.createIcons();setTimeout(renderAnno,30)}\nfunction renderList(){const data=filtered();content.innerHTML=`<div class=\"overflow-x-auto\"><table class=\"data-table\"><thead><tr><th>洞察</th><th>核心场景</th><th>状态</th><th>证据等级</th><th>关联指标</th><th>基线 / 目标 / 实际</th><th>行动项</th><th>负责人</th><th>复盘日</th><th>操作</th></tr></thead><tbody>${data.map((x,i)=>`<tr><td class=\"max-w-[360px]\"><button class=\"text-left text-primary view\" data-i=\"${i}\">${x.title}</button><div class=\"mono text-[11px] text-ink-muted\">${x.id}</div></td><td>${x.scene}</td><td><span class=\"badge ${statusClass[x.status]}\">${x.status}</span></td><td><span class=\"badge ${x.evidence==='A'?'bg-success-bg text-success':x.evidence==='B'?'bg-info-bg text-info':'bg-warning-bg text-warning'}\">${x.evidence} 级</span></td><td>${x.metric}</td><td class=\"mono\">${x.baseline} / ${x.target} / ${x.actual}</td><td>${x.actions}</td><td>${x.owner}</td><td class=\"mono\">${x.review}</td><td><button class=\"text-primary action\" data-i=\"${i}\">建行动</button>${x.status==='待复盘'?`<button class=\"ml-3 text-primary review\" data-i=\"${i}\">复盘</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;pager.innerHTML=`<span>共 ${data.length} 条（示例资产 16 条）</span><span class=\"mono\">1 / 2　10 条/页　‹　›</span>`;bindRows()}\nfunction renderBoard(){const cols=['待验证','已验证','执行中','待复盘','已完成'];content.innerHTML=`<div class=\"p-4 overflow-x-auto\"><div class=\"flex gap-3 min-w-[1300px]\">${cols.map(c=>`<div class=\"board-col flex-1\"><div class=\"font-semibold text-ink-title\">${c} <span class=\"text-ink-muted\">${insights.filter(x=>x.status===c).length}</span></div>${insights.filter(x=>x.status===c).map(x=>`<button class=\"insight-card w-full text-left board-view\" data-id=\"${x.id}\"><div class=\"text-ink-title leading-relaxed\">${x.title}</div><div class=\"mt-2 flex justify-between text-[11px] text-ink-muted\"><span>${x.scene} · ${x.evidence}级证据</span><span>${x.owner}</span></div></button>`).join('')}</div>`).join('')}</div></div>`;pager.innerHTML='<span>按状态呈现洞察闭环</span><span>拖拽流转需满足状态前置条件</span>';document.querySelectorAll('.board-view').forEach(b=>b.onclick=()=>openDetail(insights.find(x=>x.id===b.dataset.id)))}\nfunction bindRows(){document.querySelectorAll('.view').forEach((b,i)=>b.onclick=()=>openDetail(filtered()[i]));document.querySelectorAll('.action').forEach((b,i)=>b.onclick=()=>openAction(filtered()[i]));document.querySelectorAll('.review').forEach((b,i)=>b.onclick=()=>openReview(filtered()[i]))}\nfunction detailHTML(x){return `<div class=\"flex items-start justify-between\"><div><span class=\"badge ${statusClass[x.status]}\">${x.status}</span><span class=\"ml-2 badge bg-info-bg text-info\">${x.evidence} 级证据</span></div><span class=\"mono text-ink-muted\">${x.id}</span></div><h3 class=\"mt-5 text-[18px] font-semibold text-ink-title leading-relaxed\">${x.title}</h3><div class=\"mt-5 grid grid-cols-3 gap-3\"><div class=\"p-3 bg-bg-page rounded\"><div class=\"text-ink-sub\">基线</div><div class=\"mono text-[20px] mt-1\">${x.baseline}</div></div><div class=\"p-3 bg-bg-page rounded\"><div class=\"text-ink-sub\">目标</div><div class=\"mono text-[20px] mt-1\">${x.target}</div></div><div class=\"p-3 bg-success-bg rounded\"><div class=\"text-success\">实际</div><div class=\"mono text-[20px] mt-1 text-success\">${x.actual}</div></div></div><h3 class=\"mt-6 font-semibold text-ink-title\">证据链</h3><div class=\"mt-2 border border-line rounded p-4 space-y-3\"><div><span class=\"badge bg-primary-bg text-primary\">漏斗</span> 企业认证提交 → 审核通过 → 恢复启动</div><div><span class=\"badge bg-info-bg text-info\">分群</span> 企业用户 vs 个人用户，同版本、同渠道</div><div><span class=\"badge bg-warning-bg text-warning\">限制</span> 当前为观察性数据，不能单独证明因果</div></div><h3 class=\"mt-6 font-semibold text-ink-title\">行动与复盘</h3><div class=\"mt-2 p-4 bg-bg-page rounded\">${x.actions} 个行动项 · 负责人 ${x.owner} · 计划复盘 ${x.review}</div>`}\nfunction formHTML(){return `<form class=\"space-y-4\"><label class=\"block\">洞察标题<span class=\"text-danger\"> *</span><input id=\"fTitle\" class=\"control w-full mt-1\"></label><div class=\"grid grid-cols-2 gap-4\"><label>核心场景<select class=\"control w-full mt-1\"><option>新用户激活</option><option>代理购买</option><option>实名认证</option><option>环境启动</option></select></label><label>证据等级<select class=\"control w-full mt-1\"><option>C · 初步信号</option><option>B · 多维交叉验证</option><option>A · 实验或准实验</option></select></label></div><label class=\"block\">关联指标<select class=\"control w-full mt-1\"><option>实名认证通过率</option><option>代理购买转化率</option><option>环境启动成功率</option></select></label><label class=\"block\">洞察描述<textarea id=\"fDesc\" class=\"control w-full h-28 py-2 mt-1\"></textarea></label><div class=\"p-3 bg-warning-bg text-warning rounded\">必须记录数据范围、分群条件、指标版本和限制；不得把相关性表述为因果。</div></form>`}\nfunction openDetail(x){active=x;drawerTitle.textContent='洞察详情';drawerBody.innerHTML=detailHTML(x);drawerSave.classList.add('hidden');drawerOverlay.classList.remove('hidden');scope.push(drawerPanel);renderAnno();lucide.createIcons()}function openCreate(){active=null;drawerTitle.textContent='新建洞察';drawerBody.innerHTML=formHTML();drawerSave.classList.remove('hidden');drawerOverlay.classList.remove('hidden');scope.push(drawerPanel);renderAnno()}function closeDrawer(){drawerOverlay.classList.add('hidden');scope=scope.filter(x=>x!==drawerPanel);renderAnno()}function openAction(x){active=x;actionName.value='';actionDialog.classList.remove('hidden');scope.push(actionPanel);renderAnno()}function openReview(x){active=x;reviewConclusion.value='';reviewDialog.classList.remove('hidden');scope.push(reviewPanel);renderAnno()}\ntabs.onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};query.onclick=render;reset.onclick=()=>{search.value='';scene.value='';status.value='';owner.value='';render()};createBtn.onclick=openCreate;drawerClose.onclick=drawerCancel.onclick=closeDrawer;drawerOverlay.onclick=e=>{if(e.target===drawerOverlay)closeDrawer()};drawerSave.onclick=()=>{if(!fTitle.value.trim()||!fDesc.value.trim()){toastMsg('请填写洞察标题和描述');return}toastMsg('洞察草稿已保存');closeDrawer()};actionCancel.onclick=()=>{actionDialog.classList.add('hidden');scope=scope.filter(x=>x!==actionPanel);renderAnno()};actionConfirm.onclick=()=>{if(!actionName.value.trim()){toastMsg('请填写行动名称');return}actionCancel.click();toastMsg('行动项已创建并通知负责人')};reviewCancel.onclick=()=>{reviewDialog.classList.add('hidden');scope=scope.filter(x=>x!==reviewPanel);renderAnno()};reviewConfirm.onclick=()=>{if(!reviewConclusion.value.trim()){toastMsg('请填写复盘结论');return}if(active)active.status='已完成';reviewCancel.click();render();toastMsg('复盘已完成，结果已沉淀')};reviewDue.onclick=()=>{status.value='待复盘';render()};function toastMsg(m){toast.textContent=m;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),1800)}\nfunction renderAnno(){}\nrender();lucide.createIcons();\n"],"usesAnnotations":false};</script>

      items: [
        { id: 'environment-management', label: '环境管理', icon: 'monitor-cog', module: 'environment-management', description: '管理浏览器环境和运行状态' },
        { id: 'proxy-list', label: '代理列表', icon: 'network', state: 'planning', description: '查看代理资源、分配和可用状态' }
      ]
    },
    {
      id: 'section-tracking',
      label: '数据埋点',
      items: [
        { id: 'tracking-overview', label: '数据概览', icon: 'layout-dashboard', module: 'tracking-overview', description: '查看数据链路核心指标与异常' },
        {
          id: 'tracking-governance',
          label: '口径治理',
          icon: 'book-check',
          group: true,
          children: [
            { id: 'tracking-events', label: '事件管理', module: 'tracking-events', description: '管理事件、属性、版本和生命周期' },
            { id: 'tracking-metrics', label: '指标管理', module: 'tracking-metrics', description: '管理指标口径、计算规则和版本' }
          ]
        },
        { id: 'tracking-debug', label: '联调验证', icon: 'radio-tower', module: 'tracking-debug', description: '实时监听并校验测试事件' },
        { id: 'tracking-quality', label: '质量监控', icon: 'shield-alert', module: 'tracking-quality', description: '监控数据完整性、准确性和稳定性' },
        { id: 'tracking-detail', label: '明细排查', icon: 'list-filter', module: 'tracking-detail', description: '检索脱敏明细并定位数据问题' },
        { id: 'tracking-analysis', label: '数据分析', icon: 'chart-column-increasing', module: 'tracking-analysis', description: '开展漏斗、留存、路径和分群分析' },
        { id: 'tracking-dashboards', label: '资产沉淀', icon: 'panels-top-left', module: 'tracking-dashboards', description: '沉淀可复用看板和分析资产' },
        { id: 'tracking-insights', label: '决策复盘', icon: 'lightbulb', module: 'tracking-insights', description: '记录洞察、行动和迭代效果' }
      ]
    }
  ];

  const legacyRoutes = {
    'index.html': 'home',
    '系统框架.html': 'home',
    '用户统计.html': 'user-statistics',
    '团队列表.html': 'team-list',
    '企业列表.html': 'enterprise-list',
    '成员列表.html': 'member-list',
    '订单列表.html': 'order-list',
    '套餐订单.html': 'package-order',
    '发票管理.html': 'invoice-management',
    '环境管理.html': 'environment-management',
    '数据概览.html': 'tracking-overview',
    '事件管理.html': 'tracking-events',
    '指标管理.html': 'tracking-metrics',
    '联调验证.html': 'tracking-debug',
    '质量监控.html': 'tracking-quality',
    '明细排查.html': 'tracking-detail',
    '数据分析.html': 'tracking-analysis',
    '资产沉淀.html': 'tracking-dashboards',
    '决策复盘.html': 'tracking-insights'
  };

  const notices = [
    { title: '质量监控待处理', desc: 'browser_start_success 事件成功率低于阈值。', time: '5 分钟前', unread: true },
    { title: '指标口径待确认', desc: '代理购买转化率 V2 草案等待审核。', time: '今天 09:30', unread: true },
    { title: '历史数据补偿完成', desc: '2026-08-10 PC 端缺失事件已完成回补。', time: '昨天 18:20', unread: false }
  ];

  const routes = new Map();
  const routeParents = new Map();
  navigation.forEach((section) => {
    section.items.forEach((item) => {
      routes.set(item.id, { ...item, section: section.label });
      if (item.children) {
        item.children.forEach((child) => {
          routes.set(child.id, { ...child, section: section.label, parentLabel: item.label });
          routeParents.set(child.id, item.id);
        });
      }
    });
  });

  const $ = (id) => document.getElementById(id);
  const outlet = $('appRouteOutlet');
  const content = $('appContent');
  const sidebar = $('appSidebar');
  let currentRoute = resolveRoute(INLINE_ROUTE || decodeURIComponent(location.hash.slice(1)) || 'home');
  let groupState = readJson(GROUP_STATE_KEY, { 'tracking-governance': true });
  let moduleReady = false;
  let reloadScheduled = false;

  function readJson(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? { ...fallback, ...JSON.parse(value) } : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function writeJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
  }

  function resolveRoute(routeId) {
    const route = routes.get(routeId);
    if (!route) return routes.get('home');
    if (route.group) return routes.get(route.children[0].id);
    return route;
  }

  function routeHref(routeId, search = '') {
    const file = ROUTE_FILES[routeId] || APP_ENTRY;
    const inPrototype = /\/Prototype\//.test(location.pathname);
    const target = routeId === 'home' ? (inPrototype ? '../index.html' : 'index.html') : (inPrototype ? file : 'Prototype/' + file);
    return target + (search || '');
  }

  function icon(name, className = 'app-menu-icon') {
    return `<i data-lucide="${name}" class="${className}"></i>`;
  }

  function renderNavigation() {
    const activeParent = routeParents.get(currentRoute.id);
    $('appPrimaryNav').innerHTML = navigation.map((section) => {
      const items = section.items.map((item) => {
        if (!item.group) {
          const active = item.id === currentRoute.id;
          return `<a class="app-menu-link${active ? ' is-active' : ''}" href="${routeHref(item.id)}" data-app-route="${item.id}" ${active ? 'aria-current="page"' : ''}>${icon(item.icon)}<span class="app-menu-label">${item.label}</span></a>`;
        }
        const active = activeParent === item.id;
        const expanded = groupState[item.id] !== false;
        return `<div class="app-menu-group"><button class="app-menu-link app-group-toggle${active ? ' is-group-active' : ''}" type="button" data-app-group="${item.id}" aria-expanded="${expanded}" aria-controls="app-submenu-${item.id}">${icon(item.icon)}<span class="app-menu-label">${item.label}</span>${icon('chevron-down', 'app-group-chevron')}</button><div id="app-submenu-${item.id}" class="app-submenu${expanded ? '' : ' is-collapsed'}">${item.children.map((child) => {
          const childActive = child.id === currentRoute.id;
          return `<a class="app-menu-link${childActive ? ' is-active' : ''}" href="${routeHref(child.id)}" data-app-route="${child.id}" ${childActive ? 'aria-current="page"' : ''}><span class="app-menu-label">${child.label}</span></a>`;
        }).join('')}</div></div>`;
      }).join('');
      return `<div class="app-section-label">${section.label}</div>${items}`;
    }).join('');
    window.lucide?.createIcons();
  }

  function renderRouteTitle() {
    document.title = `云登后台 · ${currentRoute.label}`;
  }

  function setSidebarCompact(compact) {
    sidebar.classList.toggle('is-compact', compact);
    $('appCollapseButton').setAttribute('aria-label', compact ? '展开侧栏' : '收起侧栏');
    $('appCollapseButton').setAttribute('title', compact ? '展开侧栏' : '收起侧栏');
    $('appCollapseButton').setAttribute('aria-expanded', String(!compact));
    try { localStorage.setItem(SIDEBAR_STATE_KEY, String(compact)); } catch (_) {}
    window.lucide?.createIcons();
  }

  function readSidebarCompact() {
    if (innerWidth < 768) return false;
    try {
      const saved = localStorage.getItem(SIDEBAR_STATE_KEY);
      return saved === null ? innerWidth < 1100 : saved === 'true';
    } catch (_) {
      return innerWidth < 1100;
    }
  }

  function openMobileSidebar() {
    sidebar.classList.add('is-mobile-open');
    $('appMobileOverlay').hidden = false;
    $('appMobileMenu').setAttribute('aria-expanded', 'true');
  }

  function closeMobileSidebar() {
    sidebar.classList.remove('is-mobile-open');
    $('appMobileOverlay').hidden = true;
    $('appMobileMenu').setAttribute('aria-expanded', 'false');
  }

  function renderCompactFlyout(groupId, trigger) {
    const group = routes.get(groupId);
    const flyout = $('appCompactFlyout');
    const rect = trigger.getBoundingClientRect();
    flyout.style.top = `${Math.min(innerHeight - 120, Math.max(60, rect.top))}px`;
    flyout.innerHTML = group.children.map((child) => `<a class="app-menu-link${child.id === currentRoute.id ? ' is-active' : ''}" href="${routeHref(child.id)}" data-app-route="${child.id}"><span class="app-menu-label">${child.label}</span></a>`).join('');
    flyout.hidden = false;
  }

  function closeCompactFlyout() { $('appCompactFlyout').hidden = true; }

  function renderNotices() {
    $('appNoticeList').innerHTML = notices.map((item) => `<button type="button" class="app-notice-item"><span class="app-notice-item-dot${item.unread ? '' : ' is-read'}"></span><span class="min-w-0"><span class="app-notice-title">${item.title}</span><span class="app-notice-desc block">${item.desc}</span><span class="app-notice-time mono block">${item.time}</span></span></button>`).join('');
  }

  function togglePopover(id) {
    ['appNoticePopover', 'appAccountPopover'].forEach((popoverId) => {
      if (popoverId !== id) $(popoverId).hidden = true;
    });
    $(id).hidden = !$(id).hidden;
  }

  function closePopovers() {
    $('appNoticePopover').hidden = true;
    $('appAccountPopover').hidden = true;
  }

  function toast(message) {
    const element = document.createElement('div');
    element.className = 'app-toast';
    element.textContent = message;
    $('appToastContainer').append(element);
    setTimeout(() => element.remove(), 2600);
  }

  function moduleStateKey(routeId) { return `${MODULE_STATE_PREFIX}${routeId}`; }

  function controlKey(element, index) {
    if (element.id) return `id:${element.id}`;
    if (element.name) return `name:${element.name}:${index}`;
    return `index:${index}`;
  }

  function activeKey(element, index) {
    if (element.id) return `id:${element.id}`;
    for (const key of ['tab', 'view', 'page', 'status', 'mode', 'type']) {
      if (element.dataset[key] !== undefined) return `data-${key}:${element.dataset[key]}`;
    }
    return `text:${(element.textContent || '').trim()}:${index}`;
  }

  function captureModuleState() {
    if (!moduleReady || !currentRoute?.id) return;
    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file')
      .map((element, index) => ({
        key: controlKey(element, index),
        value: element.type === 'checkbox' || element.type === 'radio' ? element.checked : element.value,
        checked: element.type === 'checkbox' || element.type === 'radio'
      }));
    const active = [...outlet.querySelectorAll('.tab.active, .pg-btn.active, [role="tab"][aria-selected="true"], [data-view].active, [data-page].active')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => activeKey(element, index));
    const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => ({ key: element.id || `index:${index}`, top: element.scrollTop, left: element.scrollLeft }));
    const state = { controls, active, contentScroll: { top: content.scrollTop, left: content.scrollLeft }, scrollables, savedAt: Date.now() };
    try { sessionStorage.setItem(moduleStateKey(currentRoute.id), JSON.stringify(state)); } catch (_) {}
  }

  function restoreModuleState() {
    let state;
    try { state = JSON.parse(sessionStorage.getItem(moduleStateKey(currentRoute.id)) || 'null'); } catch (_) {}
    if (!state) return;

    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file');
    const controlMap = new Map(controls.map((element, index) => [controlKey(element, index), element]));
    state.controls?.forEach((entry) => {
      const element = controlMap.get(entry.key);
      if (!element) return;
      if (entry.checked) element.checked = Boolean(entry.value);
      else element.value = entry.value;
    });

    const activeElements = [...outlet.querySelectorAll('.tab, .pg-btn, [role="tab"], [data-view], [data-page]')]
      .filter((element) => !element.closest('.app-module-compat'));
    const activeMap = new Map(activeElements.map((element, index) => [activeKey(element, index), element]));
    state.active?.forEach((key) => {
      const element = activeMap.get(key);
      if (element && !element.classList.contains('active')) element.click();
    });

    requestAnimationFrame(() => {
      content.scrollTo(state.contentScroll || { top: 0, left: 0 });
      const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
        .filter((element) => !element.closest('.app-module-compat'));
      state.scrollables?.forEach((entry) => {
        const element = entry.key.startsWith('index:') ? scrollables[Number(entry.key.slice(6))] : document.getElementById(entry.key);
        element?.scrollTo({ top: entry.top, left: entry.left });
      });
    });
  }

  function loadScript(src, marker = 'resource') {
    const absolute = new URL(src, document.baseURI).href;
    const existing = [...document.scripts].find((script) => script.src === absolute);
    if (existing) {
      if (existing.dataset.loaded === 'true' || !existing.dataset.appDynamic) return Promise.resolve();
      return new Promise((resolve, reject) => {
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', reject, { once: true });
      });
    }
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.dataset.appDynamic = marker;
      script.addEventListener('load', () => { script.dataset.loaded = 'true'; resolve(); }, { once: true });
      script.addEventListener('error', () => reject(new Error(`无法加载脚本：${src}`)), { once: true });
      document.head.append(script);
    });
  }

  function moduleResource(src) {
    return /^(?:[a-z]+:|\/|data:)/i.test(src) ? src : `${RESOURCE_ROOT}${src}`;
  }

  function loadStyle(href) {
    const resourceHref = /^(?:[a-z]+:|\/|data:)/i.test(href) ? href : `${RESOURCE_ROOT}${href}`;
    const absolute = new URL(resourceHref, document.baseURI).href;
    if ([...document.styleSheets].some((sheet) => sheet.href === absolute)) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = resourceHref;
    link.dataset.appModuleStyle = currentRoute.id;
    document.head.append(link);
  }

  function runInlineScript(source, index) {
    const script = document.createElement('script');
    script.dataset.appModuleScript = `${currentRoute.id}:${index}`;
    script.textContent = `${source}\n//# sourceURL=yundeng-module-${currentRoute.id}-${index}.js`;
    document.body.append(script);
  }

  function disableInvoiceAnnotations(route) {
    if (route.id !== 'invoice-management') return;
    const moduleRoot = outlet.querySelector('[data-module-root="invoice-management"]');
    if (!moduleRoot) return;
    const toggle = moduleRoot.querySelector('#invoiceAnnoToggle');
    const popup = moduleRoot.querySelector('#invoiceAnnoPopup');
    const layer = moduleRoot.querySelector('#invoiceAnnoLayer');
    if (toggle) {
      toggle.remove();
    }
    if (popup) {
      popup.remove();
    }
    if (layer) {
      layer.replaceChildren();
      layer.hidden = true;
      layer.setAttribute('aria-hidden', 'true');
    }
    const stripAnchors = () => moduleRoot.querySelectorAll('[data-anno]').forEach((element) => element.removeAttribute('data-anno'));
    stripAnchors();
    const anchorObserver = new MutationObserver(stripAnchors);
    anchorObserver.observe(moduleRoot, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-anno'] });
  }

  function rewriteLegacyLink(anchor) {
    const raw = anchor.getAttribute('href');
    if (!raw || raw.startsWith('#') || /^(javascript:|mailto:|tel:)/i.test(raw)) return;
    let url;
    try { url = new URL(raw, document.baseURI); } catch (_) { return; }
    if (url.origin !== location.origin && location.protocol !== 'file:') return;
    const file = decodeURIComponent(url.pathname.split('/').pop() || '');
    let routeId = legacyRoutes[file];
    if ((file === '系统框架.html' || file === 'index.html') && url.hash) routeId = decodeURIComponent(url.hash.slice(1));
    if (!routeId) return;
    anchor.href = routeHref(routeId, url.search);
    anchor.dataset.appRoute = routeId;
  }

  function rewriteLegacyLinks(root = outlet) {
    root.querySelectorAll?.('a[href]').forEach(rewriteLegacyLink);
  }

  async function loadModule(route) {
    outlet.innerHTML = '<div class="app-route-loading" role="status"><div><span class="app-spinner"></span><span>正在加载业务模块</span></div></div>';
    if (!route.module) {
      renderPlanning(route);
      return;
    }

    const bundle = INLINE_BUNDLE && INLINE_BUNDLE.id === route.module ? INLINE_BUNDLE : null;
    if (!bundle) throw new Error(`当前页面未内嵌模块：${route.module}`);

    bundle.styleLinks.forEach(loadStyle);
    bundle.styles.forEach((css, index) => {
      const style = document.createElement('style');
      style.dataset.appModuleStyle = `${route.id}:${index}`;
      style.textContent = css;
      document.head.append(style);
    });

    // Page-local dependencies are embedded in this HTML file.

    outlet.innerHTML = bundle.html;
    rewriteLegacyLinks();
    const observer = new MutationObserver((records) => {
      records.forEach((record) => record.addedNodes.forEach((node) => {
        if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.matches?.('a[href]')) rewriteLegacyLink(node);
          rewriteLegacyLinks(node);
        }
      }));
    });
    observer.observe(outlet, { childList: true, subtree: true });

    window.lucide?.createIcons();
    bundle.scripts.forEach(runInlineScript);
    window.lucide?.createIcons();
    disableInvoiceAnnotations(route);
    moduleReady = true;
    restoreModuleState();
  }

  function renderPlanning(route) {
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('calendar-clock', 'w-6 h-6')}</span><h1>${route.label}</h1><p>${route.description}。该模块已纳入统一系统框架，目前保留稳定路由入口，业务内容将在后续里程碑中开发。</p></div></div></section>`;
    window.lucide?.createIcons();
    moduleReady = true;
  }

  function renderLoadError(error) {
    console.error(error);
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('triangle-alert', 'w-6 h-6')}</span><h1>模块加载失败</h1><p>${String(error.message || error)}</p><button type="button" class="app-account-action mt-4 justify-center" id="appRetryModule">重新加载</button></div></div></section>`;
    $('appRetryModule')?.addEventListener('click', () => location.reload());
    window.lucide?.createIcons();
  }

  function navigate(routeId) {
    const target = resolveRoute(routeId);
    captureModuleState();
    closeMobileSidebar();
    closeCompactFlyout();
    if (target.id === currentRoute.id) {
      content.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    location.assign(routeHref(target.id, location.search));
  }

  function scheduleReload() {
    if (reloadScheduled) return;
    reloadScheduled = true;
    captureModuleState();
    location.reload();
  }

  function bindEvents() {
    $('appCollapseButton').addEventListener('click', () => setSidebarCompact(!sidebar.classList.contains('is-compact')));
    $('appMobileMenu').addEventListener('click', openMobileSidebar);
    $('appMobileOverlay').addEventListener('click', closeMobileSidebar);
    $('appNoticeButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appNoticePopover'); });
    $('appAccountButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appAccountPopover'); });
    $('appReadAll').addEventListener('click', () => { notices.forEach((item) => { item.unread = false; }); renderNotices(); $('appNoticeDot').hidden = true; toast('通知已全部标记为已读'); });

    document.addEventListener('click', (event) => {
      const routeLink = event.target.closest('[data-app-route]');
      if (routeLink) {
        event.preventDefault();
        navigate(routeLink.dataset.appRoute);
        return;
      }
      const groupButton = event.target.closest('[data-app-group]');
      if (groupButton) {
        const groupId = groupButton.dataset.appGroup;
        if (sidebar.classList.contains('is-compact') && innerWidth >= 768) {
          renderCompactFlyout(groupId, groupButton);
        } else {
          groupState[groupId] = groupButton.getAttribute('aria-expanded') !== 'true';
          writeJson(GROUP_STATE_KEY, groupState);
          renderNavigation();
        }
        return;
      }
      if (!event.target.closest('.app-popover, #appNoticeButton, #appAccountButton')) closePopovers();
      if (!event.target.closest('#appCompactFlyout, [data-app-group]')) closeCompactFlyout();
      const globalAction = event.target.closest('[data-app-global-action]');
      if (globalAction) toast(`${globalAction.textContent.trim()}将在对应功能模块开放`);
    });

    window.addEventListener('hashchange', scheduleReload);
    window.addEventListener('popstate', scheduleReload);
    window.addEventListener('pagehide', captureModuleState);
    window.addEventListener('beforeunload', captureModuleState);
    window.addEventListener('resize', () => {
      if (innerWidth >= 768) closeMobileSidebar();
      closeCompactFlyout();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      closePopovers();
      closeCompactFlyout();
      closeMobileSidebar();
    });
  }

  async function init() {
    if (!location.hash || !routes.has(decodeURIComponent(location.hash.slice(1)))) {
      history.replaceState(null, '', `${location.pathname}${location.search}#${currentRoute.id}`);
    } else if (routes.get(decodeURIComponent(location.hash.slice(1)))?.group) {
      history.replaceState(null, '', `${location.pathname}${location.search}#${currentRoute.id}`);
    }
    setSidebarCompact(readSidebarCompact());
    document.body.dataset.appRoute = currentRoute.id;
    renderNavigation();
    renderRouteTitle();
    renderNotices();
    bindEvents();
    window.lucide?.createIcons();
    try { await loadModule(currentRoute); } catch (error) { renderLoadError(error); }
  }

  window.YundengAppShell = {
    navigation,
    legacyRoutes,
    navigate,
    captureModuleState,
    routeHref
  };

  init();
})();
</script>
</body>
