<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>云登后台 · 工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0066FF', hover: '#0052CC', active: '#0047B3', bg: '#E6F0FF' },
            ink: { title: '#1A1D24', body: '#3A3F4A', sub: '#6E7685', muted: '#9DA2AC' },
            line: { DEFAULT: '#DFE1E5', light: '#E8EAED', lighter: '#F0F1F3' },
            page: '#F7F8FA', card: '#FFFFFF', hover: '#F3F4F6',
            bg: { page: '#F7F8FA', card: '#FFFFFF', hover: '#F3F4F6', subtle: '#F5F8FF' },
            success: { DEFAULT: '#0FC060', bg: '#E7F9F0' },
            warning: { DEFAULT: '#E7772D', bg: '#FDF2E9' },
            danger: { DEFAULT: '#D9001B', bg: '#FFE8EB' },
            info: { DEFAULT: '#0091D5', bg: '#E4F4FB' },
            primaryBg: '#E6F0FF'
          },
          fontFamily: { mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    };
  </script>
<link href="Prototype/系统框架.css" rel="stylesheet"/></head>
<body>
<div class="app-shell">
<header class="app-topbar" id="appTopbar">
<div class="app-topbar-left">
<button aria-controls="appSidebar" aria-expanded="false" aria-label="展开导航" class="app-icon-button app-mobile-menu" id="appMobileMenu" type="button">
<i class="w-5 h-5" data-lucide="menu"></i>
</button>
<a aria-label="云登后台工作台" class="app-brand-link" data-app-route="home" href="index.html?page=home">
<span class="app-brand-mark">云</span>
<span class="app-brand-copy">云登后台</span>
</a>
</div>
<div class="app-topbar-right">
<button aria-haspopup="dialog" aria-label="通知" class="app-icon-button relative" id="appNoticeButton" type="button">
<i class="w-[18px] h-[18px]" data-lucide="bell"></i>
<span class="app-notice-dot" id="appNoticeDot"></span>
</button>
<span aria-hidden="true" class="app-topbar-separator"></span>
<button aria-haspopup="menu" aria-label="管理员账号" class="app-account-button" id="appAccountButton" type="button">
<span class="app-avatar">数</span>
<span class="app-account-name">数据管理员</span>
<i class="app-account-chevron w-3.5 h-3.5 text-ink-muted" data-lucide="chevron-down"></i>
</button>
</div>
</header>
<div class="app-shell-body">
<aside aria-label="主导航" class="app-sidebar" id="appSidebar">
<nav aria-label="后台功能导航" class="app-primary-nav" id="appPrimaryNav"></nav>
<div class="app-sidebar-footer">
<div aria-hidden="true" class="app-sidebar-divider"></div>
<button class="app-bottom-link" data-app-global-action="settings" type="button">
<i class="app-menu-icon" data-lucide="settings-2"></i>
<span class="app-bottom-label">系统设置</span>
</button>
</div>
<button aria-controls="appSidebar" aria-expanded="true" aria-label="收起侧栏" class="app-collapse-button" id="appCollapseButton" title="收起侧栏" type="button"></button>
</aside>
<button aria-label="关闭导航" class="app-mobile-overlay" hidden="" id="appMobileOverlay" type="button"></button>
<div class="app-workspace">
<main class="app-content" id="appContent" tabindex="-1">
<div aria-live="polite" class="app-route-outlet" id="appRouteOutlet"></div>
</main>
</div>
</div>
</div>
<div aria-label="通知" class="app-popover app-notice-popover" hidden="" id="appNoticePopover" role="dialog">
<div class="app-popover-header">
<strong>通知</strong>
<button class="app-link-button" id="appReadAll" type="button">全部已读</button>
</div>
<div id="appNoticeList"></div>
<button class="app-account-action justify-center" data-app-global-action="notice-center" type="button">查看全部通知</button>
</div>
<div aria-label="管理员账号菜单" class="app-popover app-account-popover" hidden="" id="appAccountPopover" role="menu">
<div class="app-account-meta">角色：数据管理员<br/>数据范围：全部授权团队</div>
<button class="app-account-action" data-app-global-action="profile" role="menuitem" type="button"><i class="w-4 h-4" data-lucide="user-round"></i>账号资料</button>
<button class="app-account-action" data-app-global-action="security" role="menuitem" type="button"><i class="w-4 h-4" data-lucide="shield-check"></i>安全设置</button>
</div>
<div aria-label="侧栏二级菜单" class="app-compact-flyout" hidden="" id="appCompactFlyout" role="menu"></div>
<div aria-live="polite" class="app-toast-container" id="appToastContainer"></div>


<script src="Prototype/app-shell.js"></script>
</body>
</html>
