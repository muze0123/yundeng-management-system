*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#3A3F4A}.mono{font-family:'JetBrains Mono',monospace}.sidebar{width:220px}.nav-item{height:38px;border-radius:4px;display:flex;align-items:center;gap:10px;padding:0 12px}.nav-item:hover{background:#F3F4F6}.nav-item.group{color:#0066FF;font-weight:600}.submenu a{height:34px;padding-left:44px;font-size:12px}.submenu a.active{color:#0066FF;background:#E6F0FF;font-weight:600}.btn{height:32px;padding:0 14px;border-radius:4px;font-weight:500}.btn-primary{background:#0066FF;color:#fff}.btn-default{border:1px solid #DFE1E5;background:#fff}.control{height:32px;border:1px solid #DFE1E5;border-radius:4px;padding:0 8px;width:100%;outline:none}.tab{height:30px;padding:0 14px;border-radius:4px}.tab.active{background:#E6F0FF;color:#0066FF;font-weight:600}.data-table{width:100%;border-collapse:collapse}.data-table th{background:#F0F1F3;color:#6E7685;font-size:12px;text-align:left;padding:9px 12px}.data-table td{padding:10px 12px;border-bottom:1px solid #F0F1F3;text-align:left;white-space:nowrap}.data-table tr:hover{background:#F3F4F6}.badge{padding:2px 7px;border-radius:4px;font-size:12px;display:inline-flex}.toggle{width:40px;height:22px;border-radius:11px;background:#C7CAD1;padding:2px;transition:.2s}.toggle:after{content:'';display:block;width:18px;height:18px;background:white;border-radius:50%;transition:.2s}.toggle.on{background:#0066FF}.toggle.on:after{transform:translateX(18px)}.drawer{animation:in .22s}@keyframes in{from{transform:translateX(100%)}to{transform:none}}.field{display:flex;gap:14px;margin-bottom:16px}.field label{width:120px;text-align:right;line-height:32px;flex:none}.anno-badge{position:fixed;width:20px;height:20px;border-radius:50%;background:#0066FF;color:#fff;font:700 11px/20px 'JetBrains Mono';text-align:center;pointer-events:auto}@media(max-width:1100px){.sidebar{width:68px}.brand-name,.menu-text,.submenu,.chev{display:none}.nav-item,.brand{justify-content:center}}</style></head>
<body class="bg-bg-page text-[13px]"><div class="flex min-h-screen"><aside class="sidebar sticky top-0 h-screen bg-white shrink-0"><div class="brand h-14 px-5 flex items-center gap-2"><a href="后台index.html" class="flex gap-2 items-center"><span class="w-7 h-7 bg-primary text-white rounded flex justify-center items-center font-bold">云</span><span class="brand-name font-semibold text-[16px]">云登后台</span></a></div><nav class="px-3 pt-3"><button class="nav-item group w-full"><i data-lucide="chart-no-axes-combined" class="w-[18px]"></i><span class="menu-text flex-1 text-left">数据埋点</span><i data-lucide="chevron-down" class="chev w-4"></i></button><div class="submenu mt-1 space-y-1"><a class="nav-item" href="数据总览.html">数据总览</a><a class="nav-item" href="事件管理.html">事件管理</a><a class="nav-item" href="事件明细.html">事件明细</a><a class="nav-item" href="分析中心.html">分析中心</a><a class="nav-item" href="实时调试.html">实时调试</a><a class="nav-item active" href="数据质量告警.html">数据质量告警</a></div></nav></aside><div class="flex-1 min-w-0 flex flex-col"><header class="h-14 bg-white shadow-[0_4px_12px_rgba(26,29,36,.10)] flex justify-between items-center px-6"><span class="text-ink-sub">数据埋点 / 数据质量告警</span><div class="flex gap-2"><button id="stateBtn" class="btn btn-default">模拟状态</button><span class="w-7 h-7 rounded-full bg-primary-bg text-primary flex justify-center items-center">数</span></div></header><main id="main" class="p-4 flex-1 overflow-auto relative"><div id="stateMenu" class="hidden absolute right-10 top-2 z-20 bg-white border rounded shadow p-1"></div><section class="bg-white rounded-lg p-5 mb-4"><div class="flex gap-2 mb-4"><button class="tab active" data-tab="instances">告警实例</button><button class="tab" data-tab="rules">规则管理</button></div><div class="filter-flow"><div class="filter-item"><label class="filter-label">搜索</label><input class="control" placeholder="告警或规则名称"></div><div class="filter-item"><label class="filter-label">级别</label><select class="control"><option>全部级别</option><option>严重</opt <div id="drawerOverlay" class="hidden fixed inset-0 z-50 bg-black/30"><section id="drawerPanel" class="drawer ml-auto w-[800px] h-full bg-white flex flex-col"><header class="h-14 p-4 border-b flex justify-between"><h2 data-anno="1" id="drawerTitle" class="font-semibold">告警详情</h2><button onclick="closeDrawer()">×</button></header><div id="drawerBody" class="p-6 overflow-auto flex-1"></div><footer id="drawerFoot" class="p-4 border-t flex justify-end gap-3"></footer></section></div>
<div id="dialog" class="hidden fixed inset-0 z-[60] bg-black/30 flex items-center justify-center"><div id="dialogPanel" class="w-[600px] h-[250px] bg-white rounded-lg flex flex-col"><div class="flex-1 flex items-center p-6"><span class="w-5 h-5 rounded-full bg-warning-bg text-warning flex justify-center items-center mr-3">?</span><div><h2 class="font-semibold text-[16px]">确认告警？</h2><p class="text-ink-sub mt-2">确认表示已开始处理，系统仍会继续监控恢复状态。</p><select id="ackState" class="control w-[300px] mt-3"><option>处理中</option><option>已知问题</option></select></div></div><div class="p-5 flex justify-end gap-3"><button onclick="closeDialog()" class="btn btn-default">取消</button><button onclick="ack()" class="btn btn-primary">确认告警</button></div></div></div>

<script>
const incidents=[['ALT-240807-019','Critical','P0事件10分钟无数据','identity_complete','到达率','0.00%','≥99.5%','firing','16:42','1h 12m','李楠'],['ALT-240807-018','High','必填属性完整率下降','environment_launch_result','完整率','98.74%','≥99.5%','acknowledged','15:38','2h 16m','赵越'],['ALT-240807-017','High','重复事件超出阈值','proxy_test_result','重复率','0.62%','<0.1%','firing','14:20','3h 34m','周方'],['ALT-240807-016','Medium','数据延迟升高','payment_result','延迟 P95','8m 12s','<5m','silenced','13:06','4h 48m','陈宁'],['ALT-240807-015','Critical','敏感字段扫描命中','account_bind_result','敏感命中','3','0','resolved','11:42','42m','安全组'],['ALT-240806-042','Low','枚举值未注册','config_field_change','非法枚举','12','0','resolved','昨天','18m','李楠']];
const rules=[['P0 事件到达率','到达率','P0 全部事件','固定阈值','<99.5%','10 分钟','Critical','飞书值班群',true,'16:42'],['敏感字段实时检测','敏感命中','全部事件','固定阈值','>0','立即','Critical','安全告警群',true,'11:42'],['客户端流量异常','事件量','PC 全版本','7日基线','±50%','10 分钟','High','研发值班群',true,'昨天'],['必填属性完整率','完整率','P0 全部事件','固定阈值','<99.5%','5 分钟','High','数据质量群',true,'15:38'],['数据延迟 P95','延迟','全部事件','固定阈值','>5m','10 分钟','Medium','数据质量群',true,'13:06'],['非法枚举值','非法枚举','全部事件','固定阈值','>0','5 分钟','Medium','研发值班群',false,'08-06'],['支付双端差异','双端差异','PAY','固定阈值','>0.5%','30 分钟','High','支付业务群',true,'08-05'],['历史低优事件','到达率','P3 事件','7日基线','-80%','60 分钟','Low','邮件',false,'从未']];
let tab='instances',state='normal',chart,active,annoVisible=true,annoScopeStack=[];const tone={Critical:'bg-danger-bg text-danger',High:'bg-warning-bg text-warning',Medium:'bg-info-bg text-info',Low:'bg-bg-page text-ink-muted'},levelLabel={Critical:'严重',High:'高',Medium:'中',Low:'低'};const stat={firing:'bg-danger-bg text-danger',acknowledged:'bg-warning-bg text-warning',silenced:'bg-info-bg text-info',resolved:'bg-success-bg text-success'};
function render(){if(chart){chart.destroy();chart=null}if(state==='loading'){content.innerHTML='<div class="grid grid-cols-4 gap-3 mb-4">'+Array(4).fill('<div class="h-20 bg-line-lighter animate-pulse rounded"></div>').join('')+'</div>'+Array(7).fill('<div class="h-11 bg-line-lighter animate-pulse rounded mb-2"></div>').join('');return}if(state==='empty'){content.innerHTML=empty(tab==='instances'?'当前没有数据质量告警':'暂无告警规则');return}if(state==='error'){content.innerHTML=empty('告警数据加载失败');return}tab==='instances'?renderInstances():renderRules();lucide.createIcons();setTimeout(renderAnno,30)}
function empty(t){return `<div class="h-[480px] flex flex-col justify-center items-center"><i data-lucide="shield-check" class="w-10 text-ink-muted"></i><h3 class="mt-4 text-[16px] font-semibold">${t}</h3><p class="mt-2 text-ink-sub">当前筛选条件下暂无需要处理的数据</p></div>`}
function renderInstances(){content.innerHTML=`<div data-anno="3" class="grid grid-cols-4 gap-3 mb-4"><div class="p-3 bg-danger-bg rounded"><span>触发中</span><strong class="block mono text-[22px] text-danger mt-1">3</strong></div><div class="p-3 bg-warning-bg rounded"><span>未确认</span><strong class="block mono text-[22px] text-warning mt-1">2</strong></div><div class="p-3 bg-bg-page rounded"><span>平均确认时长</span><strong class="block mono text-[22px] mt-1">12 分钟</strong></div><div class="p-3 bg-bg-page rounded"><span>平均恢复时长</span><strong class="block mono text-[22px] mt-1">1 小时 48 分钟</strong></div></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>级别</th><th>告警标题</th><th>事件</th><th>指标</th><th>当前值</th><th>阈值</th><th>状态</th><th>开始时间</th><th>持续</th><th>负责人</th><th>操作</th></tr></thead><tbody>${incidents.map((x,i)=>`<tr><td><span class="badge ${tone[x[1]]}">${levelLabel[x[1]]}</span></td><td><button data-i="${i}" class="view text-primary">${x[2]}</button><div class="mono text-[11px] text-ink-muted">${x[0]}</div></td><td class="mono">${x[3]}</td><td>${x[4]}</td><td class="mono">${x[5]}</td><td class="mono">${x[6]}</td><td><span class="badge ${stat[x[7]]}">${x[7]}</span></td><td class="mono">${x[8]}</td><td class="mono">${x[9]}</td><td>${x[10]}</td><td><button data-i="${i}" class="view text-primary">查看</button></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('.view').forEach(x=>x.onclick=()=>openIncident(+x.dataset.i))}
function renderRules(){content.innerHTML=`<table class="data-table"><thead><tr><th>规则名称</th><th>指标</th><th>事件范围</th><th>比较方式</th><th>阈值</th><th>持续时间</th><th>级别</th><th>通知渠道</th><th>状态</th><th>最近触发</th><th>操作</th></tr></thead><tbody>${rules.map((x,i)=>`<tr><td class="font-medium text-ink-title">${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td class="mono">${x[4]}</td><td>${x[5]}</td><td><span class="badge ${tone[x[6]]}">${levelLabel[x[6]]}</span></td><td>${x[7]}</td><td><button data-toggle="${i}" class="toggle ${x[8]?'on':''}"></button></td><td class="mono">${x[9]}</td><td><button data-edit="${i}" class="text-primary">编辑</button></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{b.disabled=true;setTimeout(()=>{rules[b.dataset.toggle][8]=!rules[b.dataset.toggle][8];render();toast('规则状态已更新')},450)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRule(+b.dataset.edit))}
function openIncident(i){active=i;const x=incidents[i];drawerTitle.textContent='告警详情 · '+x[0];drawerBody.innerHTML=`<div class="p-4 rounded ${tone[x[1]]}"><strong class="text-[16px]">${x[2]}</strong><p class="mt-2">${x[3]} · ${x[4]} · 当前 ${x[5]}</p></div><div class="grid grid-cols-3 gap-3 mt-4"><div class="p-3 bg-bg-page rounded"><span>开始时间</span><strong class="block mono mt-1">${x[8]}</strong></div><div class="p-3 bg-bg-page rounded"><span>持续时间</span><strong class="block mono mt-1">${x[9]}</strong></div><div class="p-3 bg-bg-page rounded"><span>负责人</span><strong class="block mt-1">${x[10]}</strong></div></div><h3 class="font-semibold mt-6">指标趋势与阈值</h3><div class="h-[240px] mt-3"><canvas id="alertChart"></canvas></div><h3 class="font-semibold mt-6">处置时间线</h3><div class="mt-3 border-l-2 border-line pl-4 space-y-4"><p><b>17:24</b> · 重复通知已发送</p><p><b>16:42</b> · 持续 10 分钟，告警触发</p><p><b>16:32</b> · 指标首次越过阈值</p></div>`;drawerFoot.innerHTML=x[7]==='firing'?'<button onclick="silence()" class="btn btn-default">静默 1 小时</button><button onclick="openAck()" class="btn btn-primary">确认告警</button>':'<button onclick="closeDrawer()" class="btn btn-default">关闭</button>';drawerOverlay.classList.remove('hidden');annoScopeStack.push(drawerPanel);setTimeout(()=>{chart=new Chart(alertChart,{type:'line',data:{labels:['16:20','16:30','16:40','16:50','17:00','17:10','17:20'],datasets:[{label:'当前值',data:[99.8,99.6,98.4,72,20,0,0],borderColor:'#D9001B',tension:.25},{label:'阈值',data:[99.5,99.5,99.5,99.5,99.5,99.5,99.5],borderColor:'#E7772D',borderDash:[5,5]}]},options:{maintainAspectRatio:false}});renderAnno()},50)}
function openRule(i){const x=rules[i]||['','','','','','','','',''];drawerTitle.textContent=i>=0?'编辑告警规则':'新建告警规则';drawerBody.innerHTML=`<div class="field"><label>* 规则名称</label><input class="control w-[500px]" value="${x[0]||''}"></div><div class="field"><label>* 质量指标</label><select class="control w-[500px]"><option>到达率</option><option>完整率</option><option>重复率</option><option>敏感命中</option></select></div><div class="field"><label>* 事件范围</label><select class="control w-[500px]"><option>P0 全部事件</option><option>全部事件</option><option>单个事件</option></select></div><div class="field"><label>* 比较方式</label><select class="control w-[500px]"><option>固定阈值</option><option>7日同时间基线</option></select></div><div class="field"><label>* 阈值</label><input class="control w-[500px] mono" value="99.5%"></div><div class="field"><label>* 持续时间</label><select class="control w-[500px]"><option>10 分钟</option><option>5 分钟</option><option>立即</option></select></div><div class="field"><label>通知渠道</label><select class="control w-[500px]"><option>数据质量群</option><option>研发值班群</option></select></div>`;drawerFoot.innerHTML='<button onclick="closeDrawer()" class="btn btn-default">取消</button><button onclick="saveRule()" class="btn btn-primary">保存规则</button>';drawerOverlay.classList.remove('hidden');annoScopeStack.push(drawerPanel);renderAnno()}
function closeDrawer(){drawerOverlay.classList.add('hidden');annoScopeStack=[];if(chart){chart.destroy();chart=null}renderAnno()}function openAck(){dialog.classList.remove('hidden');annoScopeStack.push(dialogPanel);renderAnno()}function closeDialog(){dialog.classList.add('hidden');annoScopeStack=annoScopeStack.filter(x=>x!==dialogPanel);renderAnno()}function ack(){incidents[active][7]='acknowledged';closeDialog();closeDrawer();render();toast('告警已确认，系统将继续监控恢复状态')}function silence(){incidents[active][7]='silenced';closeDrawer();render();toast('告警已静默 1 小时')}function saveRule(){closeDrawer();toast('告警规则已保存')}Object.assign(window,{closeDrawer,openAck,closeDialog,ack,silence,saveRule});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));title.textContent=tab==='instances'?'告警实例':'规则管理';desc.textContent=tab==='instances'?'确认不等于恢复，系统将持续监控指标状态。':'规则支持固定阈值与 7 日同时间基线。';create.classList.toggle('hidden',tab!=='rules');render()});create.onclick=()=>openRule(-1);
const states=['normal','loading','empty','error'];stateMenu.innerHTML=states.map(s=>`<button data-s="${s}" class="block px-3 py-2 w-full text-left hover:bg-bg-hover mono">${s}</button>`).join('');stateBtn.onclick=()=>stateMenu.classList.toggle('hidden');stateMenu.onclick=e=>{if(e.target.dataset.s){state=e.target.dataset.s;render();stateMenu.classList.add('hidden')}};function toast(m){toastBox.textContent=m;toastBox.classList.remove('hidden');setTimeout(()=>toastBox.classList.add('hidden'),1800)}
const annotations={1:{title:'质量告警工作区',desc:['告警实例与规则管理共享质量上下文。','确认不等于恢复。']},2:{title:'新建规则',desc:['支持固定阈值或 7 日同时间基线。','敏感字段命中必须立即触发 Critical。']},3:{title:'告警健康指标',desc:['触发中、未确认、MTTA 与 MTTR。','用于判断质量治理响应效率。']}};
function renderAnno(){annoLayer.innerHTML='';if(!annoVisible)return;(annoScopeStack.at(-1)||document).querySelectorAll('[data-anno]').forEach(el=>{const r=el.getBoundingClientRect(),b=document.createElement('button');b.className='anno-badge';b.textContent=el.dataset.anno;b.style.top=r.top-10+'px';b.style.left=r.right-10+'px';annoLayer.appendChild(b)})}annoToggle.onclick=()=>{annoVisible=!annoVisible;renderAnno()};main.onscroll=renderAnno;window.onresize=renderAnno;render();lucide.createIcons();
</script><script src="侧栏交互.js"></script><script src="标注交互.js"></script></body></html>
