<style data-inline="app-shell">* { box-sizing: border-box; }

:root {
  color-scheme: light;
  --app-sidebar-width: 220px;
  --app-sidebar-compact-width: 68px;
  --app-topbar-height: 56px;
}

html,
body { min-height: 100%; }

body {
  margin: 0;
  background: #f7f8fa;
  color: #3a3f4a;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button,
input,
select,
textarea { font: inherit; letter-spacing: 0; }

button,
a { -webkit-tap-highlight-color: transparent; }

.mono {
  font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
}

.app-shell { display: flex; width: 100%; height: 100vh; min-height: 100vh; flex-direction: column; overflow: hidden; }
.app-shell-body { display: flex; min-height: 0; flex: 1; overflow: hidden; }

.app-sidebar {
  position: relative;
  z-index: 40;
  display: flex;
  width: var(--app-sidebar-width);
  height: 100%;
  flex: 0 0 auto;
  flex-direction: column;
  overflow: visible;
  background: #fff;
  transition: width .2s ease, transform .2s ease;
}

.app-sidebar.is-compact { width: var(--app-sidebar-compact-width); }

.app-brand-link { display: flex; min-width: 0; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.app-brand-mark { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 6px; background: #0066ff; color: #fff; font-size: 15px; font-weight: 700; }
.app-brand-copy { overflow: hidden; color: #1a1d24; font-size: 16px; font-weight: 600; white-space: nowrap; }

.app-icon-button {
  display: inline-grid;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  place-items: center;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #6e7685;
  cursor: pointer;
}

.app-icon-button:hover { background: #f3f4f6; color: #3a3f4a; }
.app-icon-button:focus-visible,
.app-menu-link:focus-visible,
.app-account-button:focus-visible,
.app-collapse-button:focus-visible,
.app-brand-link:focus-visible { outline: 2px solid #0066ff; outline-offset: 2px; }
.app-collapse-button {
  position: absolute;
  top: 50%;
  right: 0;
  z-index: 3;
  display: grid;
  width: 12px;
  height: 50px;
  padding: 0;
  transform: translate(50%, -50%);
  place-items: center;
  border: 0;
  border-radius: 6px;
  background: #e5e6ed;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease;
}
.app-collapse-button::before {
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-right: 7px solid currentColor;
  border-bottom: 6px solid transparent;
  content: "";
}
.app-collapse-button[aria-expanded="false"]::before {
  border-right: 0;
  border-left: 7px solid currentColor;
}
.app-sidebar:hover .app-collapse-button,
.app-sidebar:focus-within .app-collapse-button,
.app-collapse-button:focus-visible { opacity: 1; pointer-events: auto; }
.app-collapse-button:hover { background: #acb0ba; }

.app-primary-nav { min-height: 0; flex: 1; overflow: auto; padding: 12px 12px; }
.app-section-label { padding: 8px 8px 0; color: #9da2ac; font-size: 11px; line-height: 28px; }

.app-menu-link,
.app-bottom-link {
  display: flex;
  width: 100%;
  min-height: 38px;
  align-items: center;
  gap: 12px;
  margin: 0 0 4px;
  padding: 0 8px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #3a3f4a;
  font-size: 13px;
  line-height: 1.3;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}

.app-menu-link:hover,
.app-bottom-link:hover { background: #f3f4f6; }
.app-menu-link.is-active { background: #e6f0ff; color: #0066ff; font-weight: 600; }
.app-menu-link.is-group-active { background: #f3f4f6; color: #0066ff; font-weight: 600; }
.app-menu-icon { width: 16px; height: 16px; flex: 0 0 16px; }
.app-menu-label { min-width: 0; flex: 1; font-size: 13px; }
.app-group-chevron { width: 16px; height: 16px; transition: transform .2s ease; }
.app-group-toggle[aria-expanded="false"] .app-group-chevron { transform: rotate(-90deg); }
.app-submenu { overflow: hidden; max-height: 240px; opacity: 1; transition: max-height .2s ease, opacity .15s ease; }
.app-submenu.is-collapsed { max-height: 0; opacity: 0; pointer-events: none; }
.app-submenu .app-menu-link { min-height: 34px; padding-left: 36px; font-size: 13px; }
.app-sidebar-footer { padding: 12px; }
.app-sidebar-divider { height: 1px; margin-bottom: 12px; background: #dfe1e5; }

.app-sidebar.is-compact .app-menu-label,
.app-sidebar.is-compact .app-group-chevron,
.app-sidebar.is-compact .app-section-label,
.app-sidebar.is-compact .app-bottom-label { display: none; }
.app-sidebar.is-compact .app-menu-link,
.app-sidebar.is-compact .app-bottom-link { justify-content: center; padding-right: 0; padding-left: 0; }
.app-sidebar.is-compact .app-submenu { display: none; }

.app-workspace { display: flex; min-width: 0; height: 100%; min-height: 0; flex: 1; flex-direction: column; overflow: hidden; }
.app-topbar {
  position: relative;
  z-index: 50;
  display: flex;
  width: 100%;
  min-height: var(--app-topbar-height);
  flex: 0 0 var(--app-topbar-height);
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #fff;
  box-shadow: 0 4px 12px -4px rgba(26, 29, 36, .16);
  clip-path: inset(0 0 -16px 0);
}
.app-topbar-left,
.app-topbar-right { display: flex; min-width: 0; align-items: center; gap: 8px; }
.app-topbar-left { gap: 12px; }
.app-mobile-menu { display: none; }
.app-notice-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border: 1px solid #fff; border-radius: 50%; background: #d9001b; }
.app-topbar-separator { width: 1px; height: 20px; margin: 0 4px; background: #dfe1e5; }
.app-account-button { display: flex; align-items: center; gap: 8px; padding: 4px; border: 0; border-radius: 4px; background: transparent; color: #3a3f4a; cursor: pointer; }
.app-account-button:hover { background: #f3f4f6; }
.app-avatar { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 50%; background: #e6f0ff; color: #0066ff; font-weight: 600; }

.app-content { min-height: 0; flex: 1; overflow: auto; background: #f7f8fa; }
.app-route-outlet { min-height: 100%; }
.app-route-loading { display: grid; min-height: calc(100vh - var(--app-topbar-height)); place-items: center; color: #6e7685; }
.app-route-loading > div { display: flex; align-items: center; gap: 8px; }
.app-spinner { width: 16px; height: 16px; border: 2px solid #dfe1e5; border-top-color: #0066ff; border-radius: 50%; animation: app-spin .7s linear infinite; }
@keyframes app-spin { to { transform: rotate(360deg); } }

.app-business-module > .app-module-toolbar { display: none !important; }
.app-business-module > main { height: auto !important; min-height: calc(100vh - var(--app-topbar-height)) !important; overflow: visible !important; }
.app-business-module .app-module-compat { display: none !important; }

.app-popover {
  position: fixed;
  z-index: 70;
  border: 1px solid #dfe1e5;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 6px 24px rgba(26, 29, 36, .14);
}
.app-popover[hidden] { display: none; }
.app-notice-popover { top: 48px; right: 72px; width: min(340px, calc(100vw - 32px)); }
.app-account-popover { top: 48px; right: 16px; width: 184px; padding: 4px; }
.app-popover-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #dfe1e5; }
.app-popover-header strong { color: #1a1d24; font-size: 15px; }
.app-link-button { border: 0; background: transparent; color: #0066ff; cursor: pointer; }
.app-notice-item { display: flex; width: 100%; gap: 8px; padding: 12px 16px; border: 0; border-bottom: 1px solid #f0f1f3; background: #fff; text-align: left; cursor: pointer; }
.app-notice-item:hover { background: #f3f4f6; }
.app-notice-item-dot { width: 8px; height: 8px; flex: 0 0 8px; margin-top: 6px; border-radius: 50%; background: #0066ff; }
.app-notice-item-dot.is-read { background: #dfe1e5; }
.app-notice-title { color: #1a1d24; font-weight: 500; }
.app-notice-desc { overflow: hidden; margin-top: 4px; color: #6e7685; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.app-notice-time { margin-top: 4px; color: #9da2ac; font-size: 11px; }
.app-account-meta { padding: 10px 12px; border-bottom: 1px solid #f0f1f3; color: #6e7685; font-size: 12px; line-height: 1.7; }
.app-account-action { display: flex; width: 100%; min-height: 34px; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #3a3f4a; cursor: pointer; }
.app-account-action:hover { background: #f3f4f6; }

.app-mobile-overlay { position: fixed; inset: var(--app-topbar-height) 0 0; z-index: 38; border: 0; background: rgba(26, 29, 36, .28); }
.app-mobile-overlay[hidden] { display: none; }
.app-compact-flyout { position: fixed; z-index: 65; left: 76px; width: 176px; padding: 4px; border: 1px solid #dfe1e5; border-radius: 8px; background: #fff; box-shadow: 0 6px 24px rgba(26, 29, 36, .14); }
.app-compact-flyout[hidden] { display: none; }

.app-planning { min-height: calc(100vh - var(--app-topbar-height)); padding: 16px; }
.app-planning-inner { display: grid; min-height: 420px; place-items: center; background: #fff; }
.app-planning-copy { max-width: 460px; padding: 32px; text-align: center; }
.app-planning-icon { display: grid; width: 48px; height: 48px; margin: 0 auto; place-items: center; border-radius: 8px; background: #fdf2e9; color: #e7772d; }
.app-planning h1 { margin: 16px 0 8px; color: #1a1d24; font-size: 20px; }
.app-planning p { margin: 0; color: #6e7685; line-height: 1.7; }

.app-toast-container { position: fixed; top: 16px; left: 50%; z-index: 100; transform: translateX(-50%); pointer-events: none; }
.app-toast { margin-bottom: 8px; padding: 8px 16px; border-radius: 4px; background: #3a3f4a; color: #fff; box-shadow: 0 2px 8px rgba(26, 29, 36, .16); animation: app-toast-in .18s ease both; }
@keyframes app-toast-in { from { opacity: 0; transform: translateY(-8px); } }

@media (min-width: 768px) {
  .app-topbar { padding: 0 24px; }
}

@media (max-width: 767px) {
  .app-sidebar { position: fixed; top: var(--app-topbar-height); bottom: 0; left: 0; height: auto; transform: translateX(-100%); box-shadow: 0 6px 24px rgba(26, 29, 36, .16); }
  .app-sidebar.is-mobile-open { width: min(280px, calc(100vw - 48px)); transform: translateX(0); }
  .app-sidebar.is-compact { width: min(280px, calc(100vw - 48px)); }
  .app-sidebar.is-compact .app-menu-label,
  .app-sidebar.is-compact .app-group-chevron,
  .app-sidebar.is-compact .app-section-label,
  .app-sidebar.is-compact .app-bottom-label { display: block; }
  .app-sidebar.is-compact .app-menu-link,
  .app-sidebar.is-compact .app-bottom-link { justify-content: flex-start; padding-right: 8px; padding-left: 8px; }
  .app-sidebar.is-compact .app-submenu { display: block; }
  .app-collapse-button { display: none; }
  .app-mobile-menu { display: inline-grid; }
  .app-account-name,
  .app-account-chevron { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .app-sidebar,
  .app-collapse-button,
  .app-submenu,
  .app-group-chevron,
  .app-spinner,
  .app-toast { transition: none; animation: none; }
}

<button id="appNoticeButton" class="app-icon-button relative" type="button" aria-label="通知" aria-haspopup="dialog">

          <div id="appRouteOutlet" class="app-route-outlet" aria-live="polite"></div>
        </main>
      </div>
    </div>
  </div>

  <div id="appNoticePopover" class="app-popover app-notice-popover" role="dialog" aria-label="通知" hidden>
    <div class="app-popover-header">
      <strong>通知</strong>
      <button id="appReadAll" class="app-link-button" type="button">全部已读</button>
    </div>
    <div id="appNoticeList"></div>
    <button class="app-account-action justify-center" type="button" data-app-global-action="notice-center">查看全部通知</button>
  </div>

  <div id="appAccountPopover" class="app-popover app-account-popover" role="menu" aria-label="管理员账号菜单" hidden>

    <button class="app-account-action" type="button" role="menuitem" data-app-global-action="security"><i data-lucide="shield-check" class="w-4 h-4"></i>安全设置</button>

  <div id="appCompactFlyout" class="app-compact-flyout" role="menu" aria-label="口径治理二级菜单" hidden></div>
  <div id="appToastContainer" class="app-toast-container" aria-live="polite"></div>
</div>

  function readJson(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? { ...fallback, ...JSON.parse(value) } : fallback;
    } catch (_) {

  }

  function resolveRoute(routeId) {
    const route = routes.get(routeId);

    const file = ROUTE_FILES[routeId] || APP_ENTRY;

  function moduleStateKey(routeId) { return `${MODULE_STATE_PREFIX}${routeId}`; }

  function controlKey(element, index) {
    if (element.id) return `id:${element.id}`;
    if (element.name) return `name:${element.name}:${index}`;
    return `index:${index}`;
  }

  function activeKey(element, index) {
    if (element.id) return `id:${element.id}`;
    for (const key of ['tab', 'view', 'page', 'status', 'mode', 'type']) {
      if (element.dataset[key] !== undefined) return `data-${key}:${element.dataset[key]}`;
    }
    return `text:${(element.textContent || '').trim()}:${index}`;
  }

  function captureModuleState() {
    if (!moduleReady || !currentRoute?.id) return;
    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file')
      .map((element, index) => ({
        key: controlKey(element, index),
        value: element.type === 'checkbox' || element.type === 'radio' ? element.checked : element.value,
        checked: element.type === 'checkbox' || element.type === 'radio'
      }));
    const active = [...outlet.querySelectorAll('.tab.active, .pg-btn.active, [role="tab"][aria-selected="true"], [data-view].active, [data-page].active')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => activeKey(element, index));
    const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
      .filter((element) => !element.closest('.app-module-compat'))
      .map((element, index) => ({ key: element.id || `index:${index}`, top: element.scrollTop, left: element.scrollLeft }));
    const state = { controls, active, contentScroll: { top: content.scrollTop, left: content.scrollLeft }, scrollables, savedAt: Date.now() };
    try { sessionStorage.setItem(moduleStateKey(currentRoute.id), JSON.stringify(state)); } catch (_) {}
  }

  function restoreModuleState() {
    let state;
    try { state = JSON.parse(sessionStorage.getItem(moduleStateKey(currentRoute.id)) || 'null'); } catch (_) {}
    if (!state) return;

    const controls = [...outlet.querySelectorAll('input, select, textarea')]
      .filter((element) => !element.closest('.app-module-compat') && element.type !== 'password' && element.type !== 'file');
    const controlMap = new Map(controls.map((element, index) => [controlKey(element, index), element]));
    state.controls?.forEach((entry) => {
      const element = controlMap.get(entry.key);
      if (!element) return;
      if (entry.checked) element.checked = Boolean(entry.value);
      else element.value = entry.value;
    });

    const activeElements = [...outlet.querySelectorAll('.tab, .pg-btn, [role="tab"], [data-view], [data-page]')]
      .filter((element) => !element.closest('.app-module-compat'));
    const activeMap = new Map(activeElements.map((element, index) => [activeKey(element, index), element]));
    state.active?.forEach((key) => {
      const element = activeMap.get(key);
      if (element && !element.classList.contains('active')) element.click();
    });

    requestAnimationFrame(() => {
      content.scrollTo(state.contentScroll || { top: 0, left: 0 });
      const scrollables = [...outlet.querySelectorAll('main, [data-module-scroll]')]
        .filter((element) => !element.closest('.app-module-compat'));
      state.scrollables?.forEach((entry) => {
        const element = entry.key.startsWith('index:') ? scrollables[Number(entry.key.slice(6))] : document.getElementById(entry.key);
        element?.scrollTo({ top: entry.top, left: entry.left });
      });
    });
  }

  function loadScript(src, marker = 'resource') {
    const absolute = new URL(src, document.baseURI).href;
    const existing = [...document.scripts].find((script) => script.src === absolute);
    if (existing) {
      if (existing.dataset.loaded === 'true' || !existing.dataset.appDynamic) return Promise.resolve();
      return new Promise((resolve, reject) => {
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', reject, { once: true });
      });
    }
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.dataset.appDynamic = marker;
      script.addEventListener('load', () => { script.dataset.loaded = 'true'; resolve(); }, { once: true });
      script.addEventListener('error', () => reject(new Error(`无法加载脚本：${src}`)), { once: true });
      document.head.append(script);
    });
  }

  function moduleResource(src) {
    return /^(?:[a-z]+:|\/|data:)/i.test(src) ? src : `${RESOURCE_ROOT}${src}`;
  }

  function loadStyle(href) {
    const resourceHref = /^(?:[a-z]+:|\/|data:)/i.test(href) ? href : `${RESOURCE_ROOT}${href}`;
    const absolute = new URL(resourceHref, document.baseURI).href;
    if ([...document.styleSheets].some((sheet) => sheet.href === absolute)) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = resourceHref;
    link.dataset.appModuleStyle = currentRoute.id;
    document.head.append(link);
  }

  function runInlineScript(source, index) {
    const script = document.createElement('script');
    script.dataset.appModuleScript = `${currentRoute.id}:${index}`;
    script.textContent = `${source}\n//# sourceURL=yundeng-module-${currentRoute.id}-${index}.js`;
    document.body.append(script);
  }

  function disableInvoiceAnnotations(route) {
    if (route.id !== 'invoice-management') return;
    const moduleRoot = outlet.querySelector('[data-module-root="invoice-management"]');
    if (!moduleRoot) return;
    const toggle = moduleRoot.querySelector('#invoiceAnnoToggle');
    const popup = moduleRoot.querySelector('#invoiceAnnoPopup');
    const layer = moduleRoot.querySelector('#invoiceAnnoLayer');
    if (toggle) {
      toggle.remove();
    }
    if (popup) {
      popup.remove();
    }
    if (layer) {
      layer.replaceChildren();
      layer.hidden = true;
      layer.setAttribute('aria-hidden', 'true');
    }
    const stripAnchors = () => moduleRoot.querySelectorAll('[data-anno]').forEach((element) => element.removeAttribute('data-anno'));
    stripAnchors();
    const anchorObserver = new MutationObserver(stripAnchors);
    anchorObserver.observe(moduleRoot, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-anno'] });
  }

  function rewriteLegacyLink(anchor) {
    const raw = anchor.getAttribute('href');
    if (!raw || raw.startsWith('#') || /^(javascript:|mailto:|tel:)/i.test(raw)) return;
    let url;
    try { url = new URL(raw, document.baseURI); } catch (_) { return; }
    if (url.origin !== location.origin && location.protocol !== 'file:') return;
    const file = decodeURIComponent(url.pathname.split('/').pop() || '');
    let routeId = legacyRoutes[file];
    if ((file === '系统框架.html' || file === 'index.html') && url.hash) routeId = decodeURIComponent(url.hash.slice(1));
    if (!routeId) return;
    anchor.href = routeHref(routeId, url.search);
    anchor.dataset.appRoute = routeId;
  }

  function rewriteLegacyLinks(root = outlet) {
    root.querySelectorAll?.('a[href]').forEach(rewriteLegacyLink);
  }

  async function loadModule(route) {
    outlet.innerHTML = '<div class="app-route-loading" role="status"><div><span class="app-spinner"></span><span>正在加载业务模块</span></div></div>';
    if (!route.module) {
      renderPlanning(route);
      return;
    }

    const bundle = INLINE_BUNDLE && INLINE_BUNDLE.id === route.module ? INLINE_BUNDLE : null;
    if (!bundle) throw new Error(`当前页面未内嵌模块：${route.module}`);

    bundle.styleLinks.forEach(loadStyle);
    bundle.styles.forEach((css, index) => {
      const style = document.createElement('style');
      style.dataset.appModuleStyle = `${route.id}:${index}`;
      style.textContent = css;
      document.head.append(style);
    });

    // Page-local dependencies are embedded in this HTML file.

    outlet.innerHTML = bundle.html;
    rewriteLegacyLinks();
    const observer = new MutationObserver((records) => {
      records.forEach((record) => record.addedNodes.forEach((node) => {
        if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.matches?.('a[href]')) rewriteLegacyLink(node);
          rewriteLegacyLinks(node);
        }
      }));
    });
    observer.observe(outlet, { childList: true, subtree: true });

    window.lucide?.createIcons();
    bundle.scripts.forEach(runInlineScript);
    window.lucide?.createIcons();
    disableInvoiceAnnotations(route);
    moduleReady = true;
    restoreModuleState();
  }

  function renderPlanning(route) {
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('calendar-clock', 'w-6 h-6')}</span><h1>${route.label}</h1><p>${route.description}。该模块已纳入统一系统框架，目前保留稳定路由入口，业务内容将在后续里程碑中开发。</p></div></div></section>`;
    window.lucide?.createIcons();
    moduleReady = true;
  }

  function renderLoadError(error) {
    console.error(error);
    outlet.innerHTML = `<section class="app-planning"><div class="app-planning-inner"><div class="app-planning-copy"><span class="app-planning-icon">${icon('triangle-alert', 'w-6 h-6')}</span><h1>模块加载失败</h1><p>${String(error.message || error)}</p><button type="button" class="app-account-action mt-4 justify-center" id="appRetryModule">重新加载</button></div></div></section>`;
    $('appRetryModule')?.addEventListener('click', () => location.reload());
    window.lucide?.createIcons();
  }

  function navigate(routeId) {
    const target = resolveRoute(routeId);
    captureModuleState();
    closeMobileSidebar();
    closeCompactFlyout();
    if (target.id === currentRoute.id) {
      content.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    location.assign(routeHref(target.id, location.search));
  }

  function scheduleReload() {
    if (reloadScheduled) return;
    reloadScheduled = true;
    captureModuleState();
    location.reload();
  }

  function bindEvents() {
    $('appCollapseButton').addEventListener('click', () => setSidebarCompact(!sidebar.classList.contains('is-compact')));
    $('appMobileMenu').addEventListener('click', openMobileSidebar);
    $('appMobileOverlay').addEventListener('click', closeMobileSidebar);
    $('appNoticeButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appNoticePopover'); });
    $('appAccountButton').addEventListener('click', (event) => { event.stopPropagation(); togglePopover('appAccountPopover'); });
    $('appReadAll').addEventListener('click', () => { notices.forEach((item) => { item.unread = false; }); renderNotices(); $('appNoticeDot').hidden = true; toast('通知已全部标记为已读'); });

    document.addEventListener('click', (event) => {
      const routeLink = event.target.closest('[data-app-route]');
      if (routeLink) {
        event.preventDefault();
        navigate(routeLink.dataset.appRoute);
        return;
      }
      const groupButton = event.target.closest('[data-app-group]');
      if (groupButton) {
        const groupId = groupButton.dataset.appGroup;
        if (sidebar.classList.contains('is-compact') && innerWidth >= 768) {
          renderCompactFlyout(groupId, groupButton);
        } else {
          groupState[groupId] = groupButton.getAttribute('aria-expanded') !== 'true';
          writeJson(GROUP_STATE_KEY, groupState);
          renderNavigation();
        }
        return;
      }
      if (!event.target.closest('.app-popover, #appNoticeButton, #appAccountButton')) closePopovers();
      if (!event.target.closest('#appCompactFlyout, [data-app-group]')) closeCompactFlyout();
      const globalAction = event.target.closest('[data-app-global-action]');
      if (globalAction) toast(`${globalAction.textContent.trim()}将在对应功能模块开放`);
    });

    window.addEventListener('hashchange', scheduleReload);
    window.addEventListener('popstate', scheduleReload);
    window.addEventListener('pagehide', captureModuleState);
    window.addEventListener('beforeunload', captureModuleState);
    window.addEventListener('resize', () => {
      if (innerWidth >= 768) closeMobileSidebar();
      closeCompactFlyout();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      closePopovers();
      closeCompactFlyout();
      closeMobileSidebar();
    });
  }

  async function init() {

<script data-inline="invoice-drawer-reference">
(function () {
  function installInvoiceDrawerReference() {
    var root = document.querySelector('[data-module-root="invoice-management"]');
    if (!root || root.dataset.drawerReferenceReady === 'true') return Boolean(root);
    var drawer = root.querySelector('#invoiceDrawer');
    var panel = drawer && drawer.querySelector('.invoice-drawer');
    var main = root.querySelector('.invoice-main');
    if (!drawer || !panel || !main) return false;
    root.dataset.drawerReferenceReady = 'true';
    panel.tabIndex = -1;
    var lastFocus = null;

    function rememberDrawerTrigger(event) {
      var trigger = event.target.closest('[data-action="open-application"]');
      if (trigger) lastFocus = trigger;
    }
    root.addEventListener('pointerdown', rememberDrawerTrigger, true);
    root.addEventListener('click', rememberDrawerTrigger, true);

    function focusableElements() {
      return Array.from(panel.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
        .filter(function (element) { return element.offsetParent !== null; });
    }

    function syncDrawerState() {
      var isOpen = !drawer.hidden;
      if (isOpen && !lastFocus && root.contains(document.activeElement) && !drawer.contains(document.activeElement)) {
        lastFocus = document.activeElement;
      }
      main.inert = isOpen;
      if (!isOpen) {
        if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
        lastFocus = null;
        return;
      }
      var title = root.querySelector('#invoiceDrawerTitle');
      var meta = root.querySelector('#invoiceDrawerMeta');
      if (title && title.textContent !== '开票申请详情') {
        title.textContent = '开票申请详情';
      }
      if (meta) {
        meta.textContent = '';
        meta.hidden = true;
        meta.setAttribute('aria-hidden', 'true');
      }
      requestAnimationFrame(function () { panel.focus({ preventScroll: true }); });
    }

    new MutationObserver(syncDrawerState).observe(drawer, { attributes: true, attributeFilter: ['hidden'] });
    drawer.addEventListener('keydown', function (event) {
      if (event.key !== 'Tab' || drawer.hidden) return;
      var elements = focusableElements();
      if (!elements.length) {
        event.preventDefault();
        panel.focus();
        return;
      }
      var first = elements[0];
      var last = elements[elements.length - 1];
      if (event.shiftKey && (document.activeElement === first || document.activeElement === panel)) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || document.activeElement === panel)) {
        event.preventDefault();
        first.focus();
      }
    });
    window.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape' || drawer.hidden) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      drawer.hidden = true;
      document.body.classList.remove('invoice-lock-scroll');
    }, true);
    syncDrawerState();
    return true;
  }

  if (!installInvoiceDrawerReference()) {
    var observer = new MutationObserver(function () {
      if (installInvoiceDrawerReference()) observer.disconnect();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>

<script data-inline="invoice-management-adjustments">
(function () {
  var root = document.querySelector('[data-module-root="invoice-management"]');
  if (!root) return;
  var dialog = root.querySelector('#invoiceDialog');
  var title = root.querySelector('#invoiceDialogTitle');
  var footer = root.querySelector('#invoiceDialogFooter');
  if (!dialog || !title || !footer) return;

  function normalizeDialogFooter(type) {
    if (type !== 'correction' && type !== 'red-retry') return;
    footer.querySelectorAll('[data-lucide], .lucide').forEach(function (icon) {
      icon.remove();
    });
    if (type !== 'red-retry') return;
    var cancel = footer.querySelector('[data-action="close-dialog"]');
    var confirm = footer.querySelector('[data-action="confirm-dialog"]');
    if (cancel && confirm && cancel.nextElementSibling !== confirm) footer.insertBefore(cancel, confirm);
  }

  function syncDialogType() {
    var titleText = title.textContent.trim();
    var isCorrection = titleText === '发起财务纠错';
    var isRedRetry = titleText === '确认关闭旧任务并重试' || titleText === '确认关闭旧开具任务并重试';
    var nextType = isCorrection ? 'correction' : isRedRetry ? 'red-retry' : '';
    if (dialog.dataset.dialogType !== nextType) {
      if (nextType) dialog.dataset.dialogType = nextType;
      else delete dialog.dataset.dialogType;
    }
    normalizeDialogFooter(nextType);
    removeProductionVersionCopy();
  }

  function removeProductionVersionCopy() {
    root.querySelectorAll('.invoice-config-state').forEach(function (element) {
      element.remove();
    });
  }

  function mergeConfigBlocks() {
    var page = root.querySelector('.invoice-config-page');
    if (!page) return;
    page.classList.add('invoice-config-shell');
    var context = page.querySelector(':scope > .invoice-config-top');
    var nav = page.querySelector(':scope > .invoice-config-workspace > .invoice-config-nav');
    var list = page.querySelector(':scope > .invoice-config-workspace > .invoice-config-list');
    if (context) context.classList.remove('invoice-block');
    if (nav) nav.classList.remove('invoice-block');
    if (list) list.classList.remove('invoice-block');
  }

  function syncSelectionColumnSpacing() {
    root.querySelectorAll('.invoice-table').forEach(function (table) {
      var headerRow = table.tHead && table.tHead.rows.length ? table.tHead.rows[0] : null;
      var headerCells = headerRow ? Array.from(headerRow.cells) : [];
      var hasSelection = Boolean(headerCells[0] && headerCells[0].querySelector('input[type="checkbox"], input[type="radio"]'));
      table.querySelectorAll('tbody tr').forEach(function (row) {
        var cells = Array.from(row.children);
        var selectionCell = cells[0];
        if (!selectionCell || !selectionCell.querySelector('input[type="checkbox"], input[type="radio"]')) return;
        hasSelection = true;
        selectionCell.classList.add('invoice-selection-cell');
        if (cells[1]) cells[1].classList.add('invoice-first-field-cell');
      });
      if (!hasSelection || !headerCells.length) return;
      if (headerCells[0]) headerCells[0].classList.add('invoice-selection-cell');
      if (headerCells[1]) headerCells[1].classList.add('invoice-first-field-cell');
    });
  }

  new MutationObserver(function () {
    syncDialogType();
    removeProductionVersionCopy();
    mergeConfigBlocks();
    syncSelectionColumnSpacing();
  }).observe(root, { childList: true, subtree: true, characterData: true });

  syncDialogType();
  removeProductionVersionCopy();
  mergeConfigBlocks();
  syncSelectionColumnSpacing();
})();
</script>

    popover.setAttribute('role', 'tooltip');
    popover.hidden = true;
    document.body.appendChild(popover);
    popover.addEventListener('mouseenter', function () { clearTimeout(closeTimer); });
    popover.addEventListener('mouseleave', scheduleClose);
    return popover;
  }

  function positionPopover() {
    if (!popover || popover.hidden || !activeButton) return;
    var rect = activeButton.getBoundingClientRect();
    var width = popover.offsetWidth;
    var height = popover.offsetHeight;
    var left = Math.min(Math.max(16, rect.left), Math.max(16, window.innerWidth - width - 16));
    var top = rect.bottom + 8;
    if (top + height > window.innerHeight - 16) top = Math.max(16, rect.top - height - 8);
    popover.style.left = left + 'px';
    popover.style.top = top + 'px';
  }

  function showPopover(button) {
    var orders = applicationOrders[button.dataset.applicationId] || [];
    if (orders.length < 2) return;
    clearTimeout(closeTimer);
    var tip = ensurePopover();
    activeButton = button;
    tip.innerHTML = '<p class="invoice-order-popover-title">全部订单号（' + orders.length + ' 笔）</p><ul class="invoice-order-popover-list">' + orders.map(function (order) { return '<li>' + esc(order) + '</li>'; }).join('') + '</ul>';
    tip.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    button.setAttribute('aria-controls', tip.id);
    positionPopover();
  }

  function scheduleClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(hidePopover, 120);
  }

  function hidePopover() {
    if (popover) popover.hidden = true;
    if (activeButton) activeButton.setAttribute('aria-expanded', 'false');
    activeButton = null;
  }

  function renderMultiOrderCells() {
    if (activeButton && !document.contains(activeButton)) hidePopover();
    var table = root.querySelector('table[aria-label="开票申请列表"]');
    if (!table) return;
    table.querySelectorAll('tbody tr').forEach(function (row) {
      var idButton = row.querySelector('[data-action="open-application"]');
      var applicationId = idButton && idButton.dataset.id;
      var orders = applicationOrders[applicationId];
      var cell = row.children[4];
      if (!orders || orders.length < 2 || !cell || cell.dataset.multiOrderReady === applicationId) return;
      cell.dataset.multiOrderReady = applicationId;
      cell.classList.add('invoice-order-cell');
      cell.innerHTML = '<span class="invoice-order-primary">' + esc(orders[0]) + '</span><button type="button" class="invoice-order-more" data-order-more="true" data-application-id="' + esc(applicationId) + '" aria-label="查看 ' + orders.length + ' 笔订单号" aria-expanded="false">+' + (orders.length - 1) + '</button>';
    });
  }

  root.addEventListener('mouseenter', function (event) {
    var button = event.target.closest('[data-order-more]');
    if (button && root.contains(button)) showPopover(button);
  }, true);
  root.addEventListener('mouseleave', function (event) {
    var button = event.target.closest('[data-order-more]');
    if (button && root.contains(button) && !event.relatedTarget?.closest?.('#invoiceOrderPopover')) scheduleClose();
  }, true);
  root.addEventListener('focusin', function (event) {
    var button = event.target.closest('[data-order-more]');
    if (button && root.contains(button)) showPopover(button);
  }, true);
  root.addEventListener('focusout', function (event) {
    var button = event.target.closest('[data-order-more]');
    if (button && root.contains(button)) scheduleClose();
  }, true);
  root.addEventListener('click', function (event) {
    var button = event.target.closest('[data-order-more]');
    if (!button || !root.contains(button)) return;
    event.preventDefault();
    showPopover(button);
  }, true);
  window.addEventListener('resize', positionPopover);
  window.addEventListener('scroll', positionPopover, true);
  window.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (popover && !popover.hidden) {
      event.preventDefault();
      hidePopover();
      event.stopImmediatePropagation();
      return;
    }
    /* Annotation DOM is intentionally removed; guard the legacy Escape listener. */
    var annotationPopup = root.querySelector('#invoiceAnnoPopup');
    var invoiceDrawer = root.querySelector('#invoiceDrawer');
    var invoiceDialog = root.querySelector('#invoiceDialog');
    var invoicePreview = root.querySelector('#invoicePreview');
    if (!annotationPopup && invoiceDrawer && invoiceDrawer.hidden && invoiceDialog && invoiceDialog.hidden && invoicePreview && invoicePreview.hidden) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);

  new MutationObserver(renderMultiOrderCells).observe(root, { childList: true, subtree: true });
  renderMultiOrderCells();
})();
</script>

<script data-inline="invoice-detail-adjustments">
(function () {
  var root = document.querySelector('[data-module-root="invoice-management"]');
  var body = root && root.querySelector('#invoiceDrawerBody');
  if (!root || !body) return;
  var busy = false;
  var scheduled = false;

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function fieldValue(section, label) {
    var fields = section ? Array.from(section.querySelectorAll('.invoice-detail-field')) : [];
    var field = fields.find(function (item) {
      var term = item.querySelector('dt');
      return term && term.textContent.trim() === label;
    });
    return field && field.querySelector('dd') ? field.querySelector('dd').textContent.trim() : '';
  }

  function fieldMarkup(label, value, mono) {
    return '<div class="invoice-detail-field"><dt>' + esc(label) + '</dt><dd' + (mono ? ' class="mono"' : '') + '>' + esc(value || '—') + '</dd></div>';
  }

  function activeDetailTab() {
    var active = body.querySelector('.invoice-detail-tab.is-active');
    return active ? active.dataset.value || '' : '';
  }

  function buildOverviewContent(shell) {
    var sections = Array.from(shell.children).filter(function (element) { return element.classList.contains('invoice-detail-section'); });
    if (!sections.length || sections[0].dataset.detailOverviewReady === 'true') return;
    var overview = sections[0];
    var amountSection = sections.find(function (section) { return section.querySelector('h3') && section.querySelector('h3').textContent.trim() === '金额与资格'; }) || sections[1];
    var buyer = fieldValue(overview, '购买主体');
    var subjectTypeMatch = buyer.match(/[（(](企业|组织|个人)[）)]/);
    var subjectType = subjectTypeMatch ? subjectTypeMatch[1] : (/个人/.test(buyer) ? '个人' : '企业');

      fieldMarkup('发票类型', values.invoiceType),
      fieldMarkup('申请人', values.applicant),
      fieldMarkup('发票内容', values.content)
    ];
    if (subjectType !== '个人') {
      identityFields.push(
        fieldMarkup('开户银行', '中国工商银行上海浦东分行'),
        fieldMarkup('银行账号', '6222 **** **** 4812', true),

    identityFields.push(
      fieldMarkup('联系邮箱', values.email || 'f***@yunstack.cn'),
      fieldMarkup('联系电话', '138****8888', true)
    );
    var identitySection = '<section class="invoice-detail-section"><h3>申请与受票</h3><dl class="invoice-detail-grid">' + identityFields.join('') + '</dl></section>';
    var amountMarkup = '<section class="invoice-detail-section"><h3>金额与资格</h3><dl class="invoice-detail-grid">' + [
      fieldMarkup('本次申请金额', values.amount, true),
      fieldMarkup('法币实付净额', values.paid, true),
      fieldMarkup('已确认退款', values.refund, true),
      fieldMarkup('有效申请占用', values.reserved, true)
    ].join('') + '</dl></section>';
    sections.forEach(function (section) { section.remove(); });
    shell.insertAdjacentHTML('beforeend', identitySection + amountMarkup);
    shell.querySelectorAll('.invoice-detail-section').forEach(function (section) { section.dataset.detailOverviewReady = 'true'; });
  }

  function normalizeOrderTable(shell) {
    var table = shell.querySelector('.invoice-detail-section table');
    if (!table || table.dataset.detailOrderReady === 'true') return;
    var headers = table.tHead && table.tHead.rows[0] ? table.tHead.rows[0].cells : [];

    var typeHead = document.createElement('th');
    typeHead.textContent = '订单类型';
    headers[0].after(typeHead);
    Array.from(table.tBodies[0] ? table.tBodies[0].rows : []).forEach(function (row, index) {

      row.children[0].after(typeCell);

      if (cell.textContent.trim() === '商品') cell.textContent = '商品名称';
    });

  }

  function normalizeDocumentEmpty(shell) {
    var table = shell.querySelector('.invoice-detail-section table');
    if (!table || !table.tBodies[0] || table.dataset.detailDocumentReady === 'true') return;
    if (!table.tBodies[0].rows.length) {

      row.innerHTML = '<td colspan="5"><div class="invoice-detail-empty">暂无数据</div></td>';
      table.tBodies[0].appendChild(row);

  }

  function ensureTabShell() {
    var tabs = body.querySelector('.invoice-detail-tabs');
    if (!tabs) return null;
    var shell = body.querySelector('.invoice-detail-tab-shell');
    if (!shell) {
      shell = document.createElement('div');
      shell.className = 'invoice-detail-tab-shell';
      tabs.parentNode.insertBefore(shell, tabs);
      shell.appendChild(tabs);
      Array.from(body.children).filter(function (element) {
        return element.classList.contains('invoice-detail-section');
      }).forEach(function (section) { shell.appendChild(section); });
    }
    return shell;
  }

  function normalizeDetail() {
    if (busy || !body.querySelector('.invoice-detail-tabs')) return;
    busy = true;
    try {
      var head = body.querySelector('.invoice-detail-head');
      if (head) head.remove();
      var shell = ensureTabShell();
      if (!shell) return;
      var tab = activeDetailTab();
      if (tab === 'overview') buildOverviewContent(shell);
      if (tab === 'orders') normalizeOrderTable(shell);
      if (tab === 'documents') normalizeDocumentEmpty(shell);
    } finally {
      busy = false;
    }
  }

  function scheduleNormalize() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(function () {
      scheduled = false;
      normalizeDetail();
    });
  }

  new MutationObserver(scheduleNormalize).observe(body, { childList: true, subtree: true });
  root.addEventListener('click', function (event) {
    if (event.target.closest('.invoice-detail-tab')) setTimeout(normalizeDetail, 0);
  }, true);
  scheduleNormalize();
})();
</script>

    NETWORK_ERROR: '审批请求未确认，请刷新后查看处理结果',
    TIMEOUT: '审批请求未确认，请刷新后查看处理结果',
    UNKNOWN_RESULT: '审批请求未确认，请刷新后查看处理结果',
    RATE_LIMITED: '操作过于频繁，请稍后重试',
    SERVICE_UNAVAILABLE: '审批服务暂不可用，请稍后重试',
    DEPENDENCY_UNAVAILABLE: '审批服务暂不可用，请稍后重试',
    INTERNAL_ERROR: '审批服务暂不可用，请稍后重试'
  };

  function showToast(message, type) {
    if (!toastHost) return;
    var item = document.createElement('div');
    item.className = 'invoice-toast' + (type ? ' is-' + type : '');
    item.setAttribute('role', 'status');
    item.textContent = message;
    toastHost.appendChild(item);
    setTimeout(function () { item.remove(); }, type === 'danger' ? 5000 : 4200);
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function closeApprovalDialog() {
    if (dialog && !dialog.hidden) {
      dialog.hidden = true;
      dialog.removeAttribute('data-approval-id');
      dialog.removeAttribute('data-approval-action');
    }
    directDecision = null;
  }

  function openDirectReviewDialog(action, id) {
    if (!dialog || !id) return;
    var title = dialog.querySelector('#invoiceDialogTitle');
    var body = dialog.querySelector('#invoiceDialogBody');
    var footer = dialog.querySelector('#invoiceDialogFooter');
    if (!title || !body || !footer) return;
    directDecision = { action: action, id: id };
    dialog.classList.remove('invoice-dialog-wide', 'invoice-config-editor-dialog');
    dialog.dataset.approvalId = id;
    dialog.dataset.approvalAction = action;
    if (action === 'approve-application') {
      title.textContent = '审核通过并提交开具';
      body.innerHTML = '<p class="invoice-dialog-copy">确认通过申请 <strong>' + escapeHtml(id) + '</strong>？服务端会重新校验权限、对象版本、金额、主体快照和税务配置。</p><div class="invoice-config-callout" style="margin-top:14px"><i data-lucide="shield-check" class="w-4 h-4"></i><div>确认后将原子写入审核决定与唯一开具任务。</div></div>';
      footer.innerHTML = '<button type="button" class="invoice-btn invoice-btn-default" data-direct-review-close>取消</button><button type="button" class="invoice-btn invoice-btn-primary" data-direct-review-confirm><i data-lucide="check-circle-2" class="w-4 h-4"></i><span>确认通过</span></button>';
    } else {
      title.textContent = '驳回开票申请';
      body.innerHTML = '<p class="invoice-dialog-copy">驳回后当前申请将结束，用户修改后需以新申请编号重新提交。</p><label for="directRejectReason" class="invoice-filter-label">结构化驳回原因</label><textarea id="directRejectReason" class="invoice-textarea" maxlength="200" placeholder="请输入具体驳回原因"></textarea><div id="directRejectError" class="invoice-form-error" hidden>请填写驳回原因。</div>';
      footer.innerHTML = '<button type="button" class="invoice-btn invoice-btn-default" data-direct-review-close>取消</button><button type="button" class="invoice-btn invoice-btn-danger" data-direct-review-confirm><i data-lucide="x-circle" class="w-4 h-4"></i><span>确认驳回</span></button>';
    }
    dialog.hidden = false;
    window.lucide && window.lucide.createIcons();
  }

  function completeDirectReview() {
    if (!directDecision) return;
    if (directDecision.action === 'reject-application') {
      var reason = dialog.querySelector('#directRejectReason');
      var error = dialog.querySelector('#directRejectError');
      if (!reason || !reason.value.trim()) {
        if (error) error.hidden = false;
        if (reason) reason.focus();
        return;
      }
    }
    var decision = directDecision;
    var row = Array.from(root.querySelectorAll('table[aria-label="开票申请列表"] tbody tr')).find(function (item) {
      return item.cells[1] && item.cells[1].textContent.trim() === decision.id;
    });
    if (row && row.cells[7]) {
      var badge = row.cells[7].querySelector('.invoice-badge');
      var assignee = row.cells[7].querySelector('.muted');
      if (badge) {
        badge.textContent = decision.action === 'approve-application' ? '开具中' : '已驳回';
        badge.classList.remove('invoice-badge-primary', 'invoice-badge-info', 'invoice-badge-success', 'invoice-badge-warning', 'invoice-badge-danger', 'invoice-badge-neutral');
        badge.classList.add(decision.action === 'approve-application' ? 'invoice-badge-info' : 'invoice-badge-danger');
      }
      if (assignee) assignee.textContent = '当前管理员';
    }
    closeApprovalDialog();
    if (drawer && !drawer.hidden) drawer.hidden = true;
    document.body.classList.remove('invoice-lock-scroll');
    showToast(decision.action === 'approve-application' ? '审核已通过，开票任务将自动提交' : '申请已驳回，订单金额占用将按规则释放', 'success');
    scheduleNormalize();
  }

  function handleConflict(code, detail) {
    var normalized = String(code || '').toUpperCase();
    var message = conflictMessages[normalized] || '该表单处理失败，请刷新后重试';
    closeApprovalDialog();
    var dangerCodes = ['UNAUTHENTICATED', 'FORBIDDEN', 'FORBIDDEN_SCOPE', 'SERVICE_UNAVAILABLE', 'DEPENDENCY_UNAVAILABLE', 'INTERNAL_ERROR'];
    showToast(message, dangerCodes.indexOf(normalized) >= 0 ? 'danger' : 'warning');
    window.dispatchEvent(new CustomEvent('invoice-approval-conflict-handled', { detail: { code: normalized, message: message, source: detail || null } }));
  }

  function findDrawerApplicationId() {
    var fields = drawer && drawer.querySelectorAll('.invoice-detail-field');
    if (!fields) return '';
    var result = '';
    Array.from(fields).some(function (field) {
      var dt = field.querySelector('dt');
      var dd = field.querySelector('dd');
      if (dt && dd && dt.textContent.trim() === '申请编号') {
        result = dd.textContent.trim();
        return true;
      }
      return false;
    });
    return result;
  }

  function makeReviewButton(action, label, cls, id, icon) {
    return '<button type="button" class="invoice-btn ' + cls + '" data-action="' + action + '" data-id="' + escapeHtml(id) + '"><i data-lucide="' + icon + '" class="w-4 h-4"></i><span>' + label + '</span></button>';
  }

  function normalizeDrawerReviewActions() {
    if (!drawer || drawer.hidden) return;
    var body = drawer.querySelector('#invoiceDrawerBody');
    var footer = drawer.querySelector('#invoiceDrawerFooter');
    if (!body || !footer) return;
    var status = '';
    var state = body.querySelector('.invoice-detail-state-value');
    if (state) status = state.textContent.trim();
    if (status === '审核中') {
      state.textContent = '待审核';
      state.classList.remove('invoice-badge-info');
      state.classList.add('invoice-badge-primary');
    }
    var id = findDrawerApplicationId();
    var hasClaim = Boolean(footer.querySelector('[data-action="claim-application"]'));
    var hasLockText = /审核锁|领取审核|lock_id|延长/.test(footer.textContent);
    if (hasClaim || hasLockText) {
      footer.innerHTML = '<div class="invoice-direct-review-note">待审核，可直接审批</div><div class="invoice-direct-review-actions">' + makeReviewButton('reject-application', '驳回', 'invoice-btn-danger', id, 'x-circle') + makeReviewButton('approve-application', '审核通过', 'invoice-btn-primary', id, 'check-circle-2') + '</div>';
      window.lucide && window.lucide.createIcons();
    }
    body.querySelectorAll('*').forEach(function (element) {
      if (element.children.length) return;
      if (!/审核锁|领取审核|lock_id|延长 30 分钟/.test(element.textContent)) return;
      element.textContent = '审核决定按对象版本提交并记录审计。';
    });
  }

  function normalizeApplicationList() {
    var primary = root.querySelector('.invoice-primary-tab.is-active');
    if (!primary || primary.dataset.tab !== 'applications') return;
    root.querySelectorAll('.invoice-status-tab[data-status="REVIEWING"]').forEach(function (button) { button.remove(); });
    root.querySelectorAll('[data-action="claim-application"]').forEach(function (button) { button.remove(); });
    var rows = Array.from(root.querySelectorAll('table[aria-label="开票申请列表"] tbody tr'));
    rows.forEach(function (row) {
      row.querySelectorAll('.invoice-badge').forEach(function (badge) {
        if (badge.textContent.trim() !== '审核中') return;
        badge.textContent = '待审核';
        badge.classList.remove('invoice-badge-info');
        badge.classList.add('invoice-badge-primary');
        var assignee = badge.closest('td') && badge.closest('td').querySelector('.muted');
        if (assignee) assignee.textContent = '—';
      });
    });
    var pendingTab = root.querySelector('.invoice-status-tab[data-status="PENDING_REVIEW"]');
    if (pendingTab) {
      var activeStatus = root.querySelector('.invoice-status-tab.is-active');
      var currentPendingCount = rows.filter(function (row) {
        return row.cells[7] && /待审核|审核中/.test(row.cells[7].textContent);
      }).length;
      if ((activeStatus && activeStatus.dataset.status === 'ALL') || directPendingFilter) pendingReviewTotal = currentPendingCount;
      var countNode = pendingTab.querySelector('.mono');
      var nextCount = pendingReviewTotal || currentPendingCount;
      if (countNode && countNode.textContent !== String(nextCount)) countNode.textContent = String(nextCount);
    }
    if (directPendingFilter) {
      var visibleCount = 0;
      rows.forEach(function (row) {
        var matches = Boolean(row.cells[7] && /待审核|审核中/.test(row.cells[7].textContent));
        row.hidden = !matches;
        if (matches) visibleCount += 1;
      });
      root.querySelectorAll('.invoice-status-tab').forEach(function (button) {
        var active = button.dataset.status === 'PENDING_REVIEW';
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-selected', String(active));
      });
      var listTotal = root.querySelector('.invoice-list-total .mono');
      if (listTotal && listTotal.textContent !== String(visibleCount)) listTotal.textContent = String(visibleCount);
      var pageStats = root.querySelector('.invoice-pagination .invoice-page-stats');
      var pageSummary = '共 ' + visibleCount + ' 条记录　第 1/1 页';
      if (pageStats && pageStats.textContent !== pageSummary) pageStats.textContent = pageSummary;
    }
    normalizeDrawerReviewActions();
  }

  function scheduleNormalize() {
    if (normalizeQueued) return;
    normalizeQueued = true;
    requestAnimationFrame(function () {
      normalizeQueued = false;
      normalizeApplicationList();
    });
  }

  root.addEventListener('click', function (event) {
    var directClose = event.target.closest('[data-direct-review-close]');
    if (directClose && root.contains(directClose)) {
      event.preventDefault();
      event.stopImmediatePropagation();
      closeApprovalDialog();
      return;
    }
    var directConfirm = event.target.closest('[data-direct-review-confirm]');
    if (directConfirm && root.contains(directConfirm)) {
      event.preventDefault();
      event.stopImmediatePropagation();
      completeDirectReview();
      return;
    }
    var target = event.target.closest('[data-action]');
    if (!target || !root.contains(target)) return;
    var action = target.dataset.action;
    if (action === 'claim-application') {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if ((action === 'approve-application' || action === 'reject-application') && target.dataset.approvalConflict) {
      event.preventDefault();
      event.stopImmediatePropagation();
      handleConflict(target.dataset.approvalConflict, { id: target.dataset.id, action: action });
      return;
    }
    if (action === 'approve-application' || action === 'reject-application') {
      event.preventDefault();
      event.stopImmediatePropagation();
      openDirectReviewDialog(action, target.dataset.id);
    }
  }, true);

  window.addEventListener('click', function (event) {
    if (forcingAllApplications) return;
    var statusTab = event.target.closest && event.target.closest('.invoice-status-tab[data-action="application-status"]');
    if (statusTab && root.contains(statusTab) && statusTab.dataset.status === 'PENDING_REVIEW') {
      event.preventDefault();
      event.stopImmediatePropagation();
      directPendingFilter = true;
      var allTab = root.querySelector('.invoice-status-tab[data-status="ALL"]');
      if (allTab && !allTab.classList.contains('is-active')) {
        forcingAllApplications = true;
        allTab.click();
        forcingAllApplications = false;
        directPendingFilter = true;
      }
      scheduleNormalize();
      return;
    }
    if (statusTab || (event.target.closest && event.target.closest('[data-action="query-applications"], [data-action="reset-applications"], .invoice-primary-tab'))) {
      directPendingFilter = false;
    }
  }, true);

  window.addEventListener('invoice-approval-conflict', function (event) {
    var detail = event.detail || {};
    handleConflict(detail.code || detail.error_code || detail.reason, detail);
  });
  window.addEventListener('invoice-approval-result', function (event) {
    var detail = event.detail || {};
    if (detail.ok === false || detail.success === false) handleConflict(detail.code || detail.error_code || detail.reason, detail);
  });
  window.YundengInvoiceApproval = window.YundengInvoiceApproval || {};
  window.YundengInvoiceApproval.handleConflict = handleConflict;
  window.YundengInvoiceApproval.messages = conflictMessages;

  var demoConflictCode = new URLSearchParams(window.location.search).get('approval_conflict');
  if (demoConflictCode) setTimeout(function () { handleConflict(demoConflictCode, { source: 'prototype-query' }); }, 120);

  new MutationObserver(scheduleNormalize).observe(root, { childList: true, subtree: true, characterData: true });
  scheduleNormalize();
  }

  var root = document.querySelector('[data-module-root="invoice-management"]');
  if (root) {
    installDirectReview(root);
  } else {
    var observer = new MutationObserver(function () {
      var readyRoot = document.querySelector('[data-module-root="invoice-management"]');
      if (!readyRoot) return;
      observer.disconnect();
      installDirectReview(readyRoot);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
</body>
</html>
